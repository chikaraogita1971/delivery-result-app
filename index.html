<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>個人リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      padding-bottom: 32px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      margin-bottom: 14px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .main-tab {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #e5e7eb;
      color: #374151;
      font-weight: 800;
    }

    .main-tab.active {
      background: #111827;
      color: #ffffff;
    }

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .period-tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 4px;
      background: #ffffff;
      color: #4b5563;
      font-weight: 800;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .period-tab.active {
      background: #111827;
      color: #ffffff;
    }

    .history-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .history-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .history-label {
      font-size: 11px;
      font-weight: 800;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .history-box select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px;
      color: #111827;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .card-subtitle {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .hero-card {
      background: #111827;
      color: #ffffff;
      border-radius: 16px;
      padding: 16px;
    }

    .hero-label {
      font-size: 12px;
      opacity: .75;
      margin-bottom: 5px;
    }

    .hero-value {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
    }

    .stats-grid,
    .highlight-grid,
    .analytics-grid,
    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-box,
    .highlight-box,
    .analytics-box,
    .report-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label,
    .highlight-label,
    .analytics-label,
    .report-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
    }

    .stat-value,
    .highlight-value,
    .analytics-value,
    .report-value {
      font-size: 17px;
      font-weight: 900;
      margin-top: 4px;
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record {
      padding: 12px;
      border-radius: 12px;
      background: #f9fafb;
    }

    .record-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .record-left {
      min-width: 0;
    }

    .record-date {
      font-size: 12px;
      font-weight: 800;
      color: #374151;
    }

    .record-meta {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
      line-height: 1.6;
    }

    .record-sales {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .record-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .record-action {
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .record-edit-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .record-delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .analytics-section-title {
      font-size: 13px;
      font-weight: 900;
      margin: 18px 0 8px;
    }

    .analytics-note {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    .chart-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .daily-chart {
      display: block;
      width: 100%;
      min-width: 320px;
      height: 240px;
    }

    .chart-empty {
      padding: 30px 10px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    .report-best {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #f9fafb;
      font-size: 12px;
      line-height: 1.8;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.45);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.2);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .form-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      background: #ffffff;
      color: #111827;
      outline: none;
    }

    .form-input:focus {
      border-color: #111827;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-cancel,
    .modal-save {
      border: 0;
      border-radius: 10px;
      padding: 11px;
      font-weight: 800;
    }

    .modal-cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .modal-save {
      background: #111827;
      color: #ffffff;
    }

    .modal-error {
      display: none;
      padding: 9px 10px;
      border-radius: 9px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 12px;
      font-weight: 700;
    }

    .modal-error.show {
      display: block;
    }

    .danger-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #dc2626;
      color: #ffffff;
      font-weight: 900;
    }

    .loading {
      padding: 24px 10px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .empty {
      padding: 22px 10px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    .error {
      padding: 14px;
      border-radius: 12px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {

      .app {
        padding: 12px;
      }

      .hero-value {
        font-size: 21px;
      }

      .stat-value,
      .highlight-value {
        font-size: 16px;
      }

    }

  </style>

</head>

<body>

  <div class="app">

    <header class="header">

      <div
        id="userName"

        個人ダッシュボード
      </div>

    <div class="main-tabs">

      </div>


      <div class="history-selector">

        <div class="history-box">

            <option value="">

      <div

      <div class="card">

        <div class="card-title">

            📊 基本実績
          </span>

          <span
            id="periodLabel"
            class="card-subtitle"
          >
            今日
          </span>

        </div>

        <div
          id="personalStats"
          class="stats-grid"
        >

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </div>


      <div class="card">

        <div class="card-title">
          🔥 ハイライト
        </div>

        <div
          id="highlightGrid"
          class="highlight-grid"
        >

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </div>


      <div class="card">

        <div class="card-title">
          🏆 自己ベスト
        </div>

        <div
          id="bestGrid"
          class="highlight-grid"
        >

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </div>


      <div class="card">

        <div class="card-title">
          🔥 継続日数
        </div>

        <div
          id="streakGrid"
          class="highlight-grid"
        >

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </div>


      <div class="card">

        <div class="card-title">

          <span>
            📝 実績履歴
          </span>

          <span
            id="recordPeriodLabel"
            class="card-subtitle"
          >
            今日
          </span>

        </div>

        <div

            読み込み中...
          </div>

      <div class="card">

          🗑 自分の実績をリセット
        </button>

    </section>


    <div
      id="editModal"

      role="dialog"
      aria-modal="true"
    >

      <div class="modal">

        <div class="modal-title">
          ✏️ 実績を編集
        </div>

        <div class="form-group">

          <label

            売上

            id="editSaleAmount"

            type="number"
            min="0"

        </div>


        <div class="form-group">

          <label
            class="form-label"

            配達数
          </label>

          <input
            id="editDeliveryCount"

            type="number"
            min="0"

        <div class="form-group">

          <label

        <div class="modal-actions">

          🏆 自己ベスト

        <div

            読み込み中...
          </div>

        <div class="analytics-section-title">

        <div

      <div class="card">

        </div>

  <script>

    const tg =
      window.Telegram?.WebApp || null;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    let currentPeriod =
      "today";

    let currentData =
      null;

    let editingRecordId =
      null;


    const userNameEl =
      document.getElementById(
        "userName"
      );

    const personalSection =
      document.getElementById(
        "personalSection"
      );

    const analyticsSection =
      document.getElementById(
        "analyticsSection"
      );

    const personalError =

      );

    const personalHero =
      document.getElementById(
        "personalHero"
      );

    const personalStats =
      document.getElementById(
        "personalStats"
      );

    const highlightGrid =
      document.getElementById(
        "highlightGrid"
      );

    const bestGrid =
      document.getElementById(
        "bestGrid"
      );

    const streakGrid =
      document.getElementById(
        "streakGrid"
      );

    const recordsEl =
      document.getElementById(
        "records"
      );

    const periodLabel =
      document.getElementById(
        "periodLabel"
      );

    const recordPeriodLabel =
      document.getElementById(
        "recordPeriodLabel"
      );

    const monthSelector =
      document.getElementById(
        "monthSelector"
      );

    const yearSelector =
      document.getElementById(
        "yearSelector"
      );

    const todayAnalytics =
      document.getElementById(
        "todayAnalytics"
      );

    const paceAnalytics =
      document.getElementById(
        "paceAnalytics"
      );

    const bestAnalytics =
      document.getElementById(
        "bestAnalytics"
      );

    const comparisonAnalytics =
      document.getElementById(
        "comparisonAnalytics"
      );

    const analyticsDateLabel =
      document.getElementById(
        "analyticsDateLabel"
      );

    const monthlyReport =
      document.getElementById(
        "monthlyReport"
      );

    const monthlyReportBest =
      document.getElementById(
        "monthlyReportBest"
      );

    const dailyChart =
      document.getElementById(
        "dailyChart"
      );

    const dailyList =
      document.getElementById(
        "dailyList"
      );

    const editModal =
      document.getElementById(
        "editModal"
      );

    const editSaleAmount =
      document.getElementById(
        "editSaleAmount"
      );

    const editDeliveryCount =
      document.getElementById(
        "editDeliveryCount"
      );

    const editWorkHours =
      document.getElementById(
        "editWorkHours"
      );

    const editModalError =
      document.getElementById(
        "editModalError"
      );

    const editCancelBtn =
      document.getElementById(
        "editCancelBtn"
      );

    const editSaveBtn =
      document.getElementById(
        "editSaveBtn"
      );

    const resetBtn =
      document.getElementById(
        "resetBtn"
      );


    /* =====================================================
       Telegram user
    ===================================================== */

    function getTelegramUser() {

      try {

        if (
          tg?.initDataUnsafe?.user
        ) {

          return tg.initDataUnsafe.user;

        }

        const params =
          new URLSearchParams(
            tg?.initData || ""
          );

        const raw =
          params.get("user");

        if (!raw) {
          return null;
        }

        return JSON.parse(raw);

      } catch (error) {

        console.error(
          "Telegram user parse error:",
          error
        );

        return null;

      }

    }


    function getInitData() {

      return tg?.initData || "";

    }


    function getDisplayName() {

      const user =
        getTelegramUser();

      if (!user) {
        return "個人ダッシュボード";
      }

      if (user.first_name) {
        return `${user.first_name}さん`;
      }

      if (user.username) {
        return `@${user.username}`;
      }

      return "個人ダッシュボード";

    }


    /* =====================================================
       Number format
    ===================================================== */

    function formatNumber(value) {

      const number =
        Number(value || 0);

      return number.toLocaleString(
        "ja-JP"
      );

    }


    function formatYen(value) {

      return `¥${formatNumber(value)}`;

    }


    function formatHours(value) {

      const number =
        Number(value || 0);

      return number.toFixed(2);

    }


    function formatHourly(value) {

      const number =
        Number(value || 0);

      return `${formatYen(
        Math.round(number)
      )}/h`;

    }


    /* =====================================================
       日付処理
       ★ ここが今回の修正ポイント
    ===================================================== */

    function parseDateValue(value) {

      if (!value) {
        return null;
      }

      const text =
        String(value).trim();

      /*
       * YYYY-MM-DD は「日付だけ」なので、
       * new Date("2026-10-02") にすると
       * UTC解釈によるズレが起こる可能性がある。
       *
       * そのため、この形式は手動で作る。
       */

      const dateOnly =
        text.match(
          /^(\d{4})-(\d{2})-(\d{2})$/
        );

      if (dateOnly) {

        return {
          year: Number(dateOnly[1]),
          month: Number(dateOnly[2]),
          day: Number(dateOnly[3])
        };

      }


      const date =
        new Date(text);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return null;

      }


      const formatter =
        new Intl.DateTimeFormat(
          "ja-JP",
          {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }
        );


      const parts =
        formatter.formatToParts(
          date
        );


      const result = {};

      parts.forEach(
        part => {

          if (
            part.type === "year" ||
            part.type === "month" ||
            part.type === "day"
          ) {

            result[part.type] =
              Number(part.value);

          }

        }
      );


      if (
        !result.year ||
        !result.month ||
        !result.day
      ) {

        return null;

      }


      return result;

    }


    function formatDateJST(
      value
    ) {

      const parsed =
        parseDateValue(value);

      if (!parsed) {

        return String(
          value || ""
        );

      }


      return `${parsed.year}/${String(
        parsed.month
      ).padStart(2, "0")}/${String(
        parsed.day
      ).padStart(2, "0")}`;

    }


    function formatDailyShortDate(
      value
    ) {

      const parsed =
        parseDateValue(value);

      if (!parsed) {

        return String(
          value || ""
        );

      }


      return `${String(
        parsed.month
      ).padStart(2, "0")}/${String(
        parsed.day
      ).padStart(2, "0")}`;

    }


    function normalizeDailyDate(
      value
    ) {

      const parsed =
        parseDateValue(value);

      if (!parsed) {
        return "";
      }


      return `${parsed.year}-${String(
        parsed.month
      ).padStart(2, "0")}-${String(
        parsed.day
      ).padStart(2, "0")}`;

    }


    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }

    /* =====================================================
       API
    ===================================================== */

    async function apiFetch(
      url,
      options = {}
    ) {

      const headers = {
        ...(options.headers || {})
      };

      const initData =
        getInitData();

      if (initData) {

        headers[
          "X-Telegram-Init-Data"
        ] = initData;

      }


      const response =
        await fetch(
          url,
          {
            ...options,
            headers
          }
        );


      let data = null;

      try {

        data =
          await response.json();

      } catch {

        data = null;

      }


      if (!response.ok) {

        throw new Error(
          data?.error ||
          `HTTP ${response.status}`
        );

      }


      if (
        data &&
        data.ok === false
      ) {

        throw new Error(
          data.error ||
          "APIエラー"
        );

      }


      return data;

    }


    function buildResultUrl(
      period = currentPeriod
    ) {

      const params =
        new URLSearchParams();

      params.set(
        "period",
        period
      );


      if (
        period === "month" &&
        monthSelector.value
      ) {

        params.set(
          "month",
          monthSelector.value
        );

      }


      if (
        period === "year" &&
        yearSelector.value
      ) {

        params.set(
          "year",
          yearSelector.value
        );

      }


      return `/api/result?${params.toString()}`;

    }

    async function saveEdit() {

      if (!editingRecordId) {
        return;
      }

      const saleAmount =
        Number(
          editSaleAmount.value
        );

      const deliveryCount =
        Number(
          editDeliveryCount.value
        );

      const workHours =
        Number(
          editWorkHours.value
        );


      if (
        !Number.isInteger(
          saleAmount
        ) ||
        saleAmount < 0
      ) {

        showEditError(
          "売上は0以上の整数で入力してください。"
        );

        return;

      }


      if (
        !Number.isInteger(
          deliveryCount
        ) ||
        deliveryCount < 0
      ) {

        showEditError(
          "配達数は0以上の整数で入力してください。"
        );

        return;

      }


      if (
        !Number.isFinite(
          workHours
        ) ||
        workHours <= 0 ||
        workHours > 999.99
      ) {

        showEditError(
          "稼働時間を正しく入力してください。"
        );

        return;

      }


      editSaveBtn.disabled =
        true;

      editSaveBtn.textContent =
        "保存中...";


      try {

        await apiFetch(
          "/api/result",
          {
            method: "PUT",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              id:
                Number(
                  editingRecordId
                ),
              saleAmount,
              deliveryCount,
              workHours
            })
          }
        );


        closeEditModal();

        await loadResult();


        if (
          analyticsSection.classList.contains(
            "active"
          )
        ) {

          await loadAnalytics();

        }


      } catch (error) {

        console.error(
          "saveEdit error:",
          error
        );

        showEditError(
          error.message ||
          "保存に失敗しました。"
        );

      } finally {

        editSaveBtn.disabled =
          false;

        editSaveBtn.textContent =
          "保存";

      }

    }

        yearSelector.value
      ) {

        return `${yearSelector.value}年`;

      }

      return getPeriodLabel(
        currentPeriod
      );

    }


    /* =====================================================
       API
    ===================================================== */

    async function apiFetch(
      url,
      options = {}
    ) {

      const headers = {
        ...(options.headers || {})
      };

      const initData =
        getInitData();

      if (initData) {
        headers[
          "X-Telegram-Init-Data"
        ] = initData;
      }

      const response =
        await fetch(
          url,
          {
            ...options,
            headers
          }
        );

      let data = null;

      try {

        data =
          await response.json();

      } catch {

        data = null;

      }

      if (!response.ok) {

        const message =
          data?.error ||
          `HTTP ${response.status}`;

        throw new Error(message);
      }

      if (
        data &&
        data.ok === false
      ) {

        throw new Error(
          data.error ||
          "APIエラー"
        );

      }

      return data;

    }


    /* =====================================================
       Build result API URL
    ===================================================== */

    function buildResultUrl(
      period = currentPeriod
    ) {

      const params =
        new URLSearchParams();

      params.set(
        "period",
        period
      );


      if (
        period === "month" &&
        monthSelector.value
      ) {

        params.set(
          "month",
          monthSelector.value
        );

      }


      if (
        period === "year" &&
        yearSelector.value
      ) {

        params.set(
          "year",
          yearSelector.value
        );

      }


      return `/api/result?${params.toString()}`;

    }

    /* =====================================================
       Save edit
    ===================================================== */

    async function saveEdit() {

      if (!editingRecordId) {
        return;
      }


      const saleAmount =
        Number(
          editSaleAmount.value
        );

      const deliveryCount =
        Number(
          editDeliveryCount.value
        );

      const workHours =
        Number(
          editWorkHours.value
        );


      if (
        !Number.isInteger(
          saleAmount
        ) ||
        saleAmount < 0
      ) {

        showEditError(
          "売上は0以上の整数で入力してください。"
        );

        return;
      }


      if (
        !Number.isInteger(
          deliveryCount
        ) ||
        deliveryCount < 0
      ) {

        showEditError(
          "配達数は0以上の整数で入力してください。"
        );

        return;
      }


      if (
        !Number.isFinite(
          workHours
        ) ||
        workHours <= 0 ||
        workHours > 999.99
      ) {

        showEditError(
          "稼働時間を正しく入力してください。"
        );

        return;
      }


      editSaveBtn.disabled =
        true;

      editSaveBtn.textContent =
        "保存中...";


      try {

        await apiFetch(
          "/api/result",
          {
            method: "PUT",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              id:
                Number(
                  editingRecordId
                ),
              saleAmount,
              deliveryCount,
              workHours
            })
          }
        );


        closeEditModal();

        await loadResult();


        if (
          analyticsSection.classList.contains(
            "active"
          )
        ) {

          await loadAnalytics();

        }


      } catch (error) {

        console.error(
          "saveEdit error:",
          error
        );

        showEditError(
          error.message ||
          "保存に失敗しました。"
        );

      } finally {

        editSaveBtn.disabled =
          false;

        editSaveBtn.textContent =
          "保存";

      }

    }


    function showEditError(
      message
    ) {

      editModalError.textContent =
        message;

      editModalError.classList.add(
        "show"
      );

    }

      const confirmed =
        window.confirm(
          "この実績を削除しますか？"
        );


      if (!confirmed) {
        return;
      }


      try {

        await apiFetch(
          `/api/result?id=${encodeURIComponent(id)}`,
          {
            method: "DELETE"
          }
        );


        await loadResult();


        if (
          analyticsSection.classList.contains(
            "active"
          )
        ) {

          await loadAnalytics();

        }


      } catch (error) {

        console.error(
          "deleteRecord error:",
          error
        );

        window.alert(
          error.message ||
          "削除に失敗しました。"
        );

      }

    }

      const hourly =
        Number(
          report.hourlySales || 0
        );

      const unitPrice =
        Number(
          report.unitPrice || 0
        );


      monthlyReport.innerHTML = `

        <div class="report-box">

          <div class="report-label">
            月間売上
          </div>

          <div class="report-value">
            ${formatYen(sales)}
          </div>

        </div>


        <div class="report-box">

          <div class="report-label">
            配達数
          </div>

          <div class="report-value">
            ${formatNumber(
              deliveries
            )}件
          </div>

        </div>


        <div class="report-box">

          <div class="report-label">
            稼働時間
          </div>

          <div class="report-value">
            ${formatHours(
              hours
            )}h
          </div>

        </div>


        <div class="report-box">

          <div class="report-label">
            時給換算
          </div>

          <div class="report-value">
            ${formatHourly(hourly)}
          </div>

        </div>


        <div class="report-box">

          <div class="report-label">
            平均単価
          </div>

          <div class="report-value">
            ${formatYen(
              Math.round(unitPrice)
            )}
          </div>

        </div>


        <div class="report-box">

          <div class="report-label">
            記録件数
          </div>

          <div class="report-value">
            ${formatNumber(
              records
            )}件
          </div>

        </div>

      `;


      const bestSales =
        Number(
          report.bestDaySales || 0
        );

      const bestDate =
        report.bestDayDate || "";


      if (bestSales > 0) {

        monthlyReportBest.innerHTML = `
          🏆 月間最高売上日
          <strong>
            ${escapeHtml(
              bestDate
            )}
          </strong>
          ／
          <strong>
            ${formatYen(
              bestSales
            )}
          </strong>
        `;

      } else {

        monthlyReportBest.textContent =
          "この月の最高売上日はありません。";

      }

    }


    /* =====================================================
       Daily Chart
    ===================================================== */

    function renderDailyChart(
      daily
    ) {

      if (
        !Array.isArray(daily) ||
        daily.length === 0
      ) {

        dailyChart.innerHTML = `
          <div class="chart-empty">
            日別データがありません。
          </div>
        `;

        return;
      }


      const items =
        daily
          .map(item => {

            const sales =
              Number(
                item.sales || 0
              );

            return {
              date:
                String(
                  item.date || ""
                ),
              sales
            };

          })
          .filter(
            item =>
              item.date
          );


      if (!items.length) {

        dailyChart.innerHTML = `
          <div class="chart-empty">
            日別データがありません。
          </div>
        `;

        return;
      }


      const maxSales =
        Math.max(
          ...items.map(
            item => item.sales
          ),
          1
        );


      const width =
        Math.max(
          360,
          items.length * 48
        );

      const height =
        230;

      const chartLeft =
        42;

      const chartRight =
        10;

      const chartTop =
        15;

      const chartBottom =
        38;

      const chartHeight =
        height -
        chartTop -
        chartBottom;

      const chartWidth =
        width -
        chartLeft -
        chartRight;


      const barGap =
        8;

      const barWidth =
        Math.max(
          12,
          (
            chartWidth /
            items.length
          ) - barGap
        );


      const gridLines =
        4;


      let svg = `

        <svg
          class="daily-chart"
          viewBox="0 0 ${width} ${height}"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
        >

      `;


      /* 横線 */

      for (
        let i = 0;
        i <= gridLines;
        i++
      ) {

        const y =
          chartTop +
          (
            chartHeight *
            i /
            gridLines
          );

        const value =
          Math.round(
            maxSales *
            (
              1 -
              i / gridLines
            )
          );


        svg += `

          <line
            x1="${chartLeft}"
            y1="${y}"
            x2="${width - chartRight}"
            y2="${y}"
            stroke="#e5e7eb"
            stroke-width="1"
          />

          <text
            x="${chartLeft - 6}"
            y="${y + 4}"
            text-anchor="end"
            font-size="9"
            fill="#6b7280"
          >
            ${formatNumber(value)}
          </text>

        `;

      }


      /* 棒 */

      items.forEach(
        (item, index) => {

          const x =
            chartLeft +
            (
              index *
              (
                chartWidth /
                items.length
              )
            ) +
            (
              (
                chartWidth /
                items.length
              ) -
              barWidth
            ) / 2
            ;

          const barHeight =
            item.sales > 0
              ? (
                  item.sales /
                  maxSales
                ) *
                chartHeight
              : 0;

          const y =
            chartTop +
            chartHeight -
            barHeight;


          const shortDate =
            item.date.length >= 10
              ? item.date.slice(5)
              : item.date;


          svg += `

            <rect
              x="${x}"
              y="${y}"
              width="${barWidth}"
              height="${Math.max(
                1,
                barHeight
              )}"
              rx="4"
              fill="#111827"
            />

            <text
              x="${x + barWidth / 2}"
              y="${height - 15}"
              text-anchor="middle"
              font-size="9"
              fill="#6b7280"
            >
              ${escapeHtml(
                shortDate
              )}
            </text>

          `;


          if (item.sales > 0) {

            svg += `

              <text
                x="${x + barWidth / 2}"
                y="${Math.max(
                  10,
                  y - 4
                )}"
                text-anchor="middle"
                font-size="8"
                fill="#374151"
              >
                ${formatNumber(
                  item.sales
                )}
              </text>

            `;

          }

        }
      );


      svg += `
        </svg>
      `;


      dailyChart.innerHTML =
        svg;

    }


    /* =====================================================
       Daily List
    ===================================================== */

    function renderDailyList(
      daily
    ) {

      if (
        !Array.isArray(daily) ||
        daily.length === 0
      ) {

        dailyList.innerHTML = `
          <div class="empty">
            日別データがありません。
          </div>
        `;

        return;
      }


      const sorted =
        [...daily].sort(
          (a, b) =>
            String(
              b.date || ""
            ).localeCompare(
              String(
                a.date || ""
              )
            )
        );


      dailyList.innerHTML =
        sorted.map(
          item => {

            const sales =
              Number(
                item.sales || 0
              );

            const deliveries =
              Number(
                item.deliveryCount || 0
              );

            const hours =
              Number(
                item.workHours || 0
              );

            const hourly =
              hours > 0
                ? sales / hours
                : 0;


            return `

              <div class="record">

                <div class="record-main">

                  <div class="record-left">

                    <div class="record-date">
                      ${escapeHtml(
                        item.date || ""
                      )}
                    </div>

                    <div class="record-meta">
                      配達
                      ${formatNumber(
                        deliveries
                      )}件
                      ／
                      稼働
                      ${formatHours(
                        hours
                      )}h
                      ／
                      時給
                      ${formatHourly(
                        hourly
                      )}
                    </div>

                  </div>

                  <div class="record-sales">
                    ${formatYen(
                      sales
                    )}
                  </div>

                </div>

              </div>

            `;

          }
        ).join("");

    }
