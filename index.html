<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>個人テレグラムリザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-title {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
    }

    .user-name {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .refresh-button {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 20px;
    }

    .refresh-button:active {
      transform: scale(0.97);
    }

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      padding: 4px;
      background: #e9edf5;
      border-radius: 12px;
    }

    .period-tab {
      border: 0;
      border-radius: 9px;
      padding: 10px 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .duration-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .duration-input input {
      flex: 1;
      min-width: 0;
    }

    .duration-unit {
      flex: 0 0 auto;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    .details-toggle {
      width: 100%;
      margin-top: 12px;
      padding: 10px 0;
      border: 0;
      background: transparent;
      color: var(--primary);
      text-align: left;
      font-weight: 700;
    }

    .details-content {
      display: none;
      margin-top: 4px;
    }

    .details-content.open {
      display: block;
    }

    .save-button {
      width: 100%;
      min-height: 46px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .save-button:active {
      background: var(--primary-dark);
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #fef2f2;
      color: var(--danger);
    }

    .status.success {
      background: #f0fdf4;
      color: var(--success);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .analysis-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .analysis-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .analysis-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .record-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .record-sale {
      font-size: 18px;
      font-weight: 800;
    }

    .record-date {
      color: var(--muted);
      font-size: 12px;
    }

    .record-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 12px;
      margin-top: 8px;
      color: #4b5563;
      font-size: 13px;
    }

    .empty {
      padding: 20px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .loading {
      padding: 20px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .summary-grid,
      .analysis-grid {
        grid-template-columns: 1fr 1fr;
      }

      .period-tab {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="header-title">
        <h1 class="title">📦 個人テレグラムリザルト</h1>
        <div id="userName" class="user-name"></div>
      </div>

      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
        aria-label="更新"
      >
        ↻
      </button>
    </header>

    <nav class="period-tabs" aria-label="期間">
      <button
        class="period-tab active"
        type="button"
        data-period="today"
      >
        今日
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="week"
      >
        今週
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="month"
      >
        今月
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="all"
      >
        全期間
      </button>
    </nav>

    <section class="card">
      <h2 class="card-title">実績を追加</h2>

      <div class="form-grid">
        <div class="form-group">
          <label for="saleAmountInput">売上（円）</label>
          <input
            id="saleAmountInput"
            type="number"
            inputmode="numeric"
            min="0"
            step="1"
            placeholder="5000"
          />
        </div>

        <div class="form-group">
          <label for="deliveryCountInput">配達件数</label>
          <input
            id="deliveryCountInput"
            type="number"
            inputmode="numeric"
            min="0"
            step="1"
            placeholder="5"
          />
        </div>
      </div>

      <button
        id="detailsToggle"
        class="details-toggle"
        type="button"
      >
        詳細設定（任意）＋
      </button>

      <div id="detailsContent" class="details-content">
        <div class="form-grid">

          <div class="form-group">
            <label for="workStartTimeInput">稼働開始時刻</label>
            <input
              id="workStartTimeInput"
              type="time"
            />
          </div>

          <div class="form-group">
            <label>稼働時間</label>

            <div class="duration-input">
              <input
                id="workHoursHourInput"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="8"
                aria-label="稼働時間の時間"
              />

              <span class="duration-unit">時間</span>

              <input
                id="workHoursMinuteInput"
                type="number"
                inputmode="numeric"
                min="0"
                max="59"
                step="1"
                placeholder="17"
                aria-label="稼働時間の分"
              />

              <span class="duration-unit">分</span>
            </div>
          </div>

          <div class="form-group">
            <label for="distanceInput">走行距離（km）</label>
            <input
              id="distanceInput"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.1"
              placeholder="30"
            />
          </div>

          <div class="form-group">
            <label for="expenseInput">経費（円）</label>
            <input
              id="expenseInput"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              placeholder="500"
            />
          </div>

        </div>
      </div>

      <button
        id="saveButton"
        class="save-button"
        type="button"
      >
        実績を保存
      </button>

      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <h2 class="card-title">集計</h2>

      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">売上</div>
          <div id="summarySales" class="summary-value">¥0</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">配達件数</div>
          <div id="summaryDeliveries" class="summary-value">0件</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">稼働時間</div>
          <div id="summaryHours" class="summary-value">0時間</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">時給</div>
          <div id="summaryHourly" class="summary-value">¥0</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">平均単価</div>
          <div id="summaryUnitPrice" class="summary-value">¥0</div>
        </div>
      </div>
    </section>
    <script>
  const tg = window.Telegram?.WebApp || null;

  const state = {
    period: "today",
    loading: false,
    records: [],
    summary: {
      sales: 0,
      deliveries: 0,
      hours: 0,
      hourly: 0,
      unitPrice: 0
    }
  };

  function formatNumber(value, digits = 0) {
    const number = Number(value);
    if (!Number.isFinite(number)) return "0";

    return number.toLocaleString("ja-JP", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
  }

  function formatDuration(hours) {
    const number = Number(hours);

    if (!Number.isFinite(number) || number <= 0) {
      return "0時間";
    }

    const totalMinutes = Math.round(number * 60);
    const wholeHours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    if (wholeHours === 0) {
      return `${minutes}分`;
    }

    if (minutes === 0) {
      return `${wholeHours}時間`;
    }

    return `${wholeHours}時間${minutes}分`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showStatus(message, type = "") {
    const element = document.getElementById("statusMessage");

    if (!element) return;

    element.textContent = message || "";
    element.className = `status-message${type ? ` ${type}` : ""}`;
  }

  async function readApiResponse(response) {
    const text = await response.text();

    let data = null;

    try {
      data = text ? JSON.parse(text) : null;
    } catch (error) {
      throw new Error(
        `サーバーから不正なレスポンスが返されました (${response.status})`
      );
    }

    if (!response.ok || data?.ok === false) {
      throw new Error(
        data?.error ||
        data?.message ||
        `通信に失敗しました (${response.status})`
      );
    }

    return data;
  }

  async function apiFetch(url, options = {}) {
    const headers = new Headers(options.headers || {});

    if (tg?.initData) {
      headers.set("X-Telegram-Init-Data", tg.initData);
    }

    if (
      options.body &&
      !headers.has("Content-Type") &&
      typeof options.body === "string"
    ) {
      headers.set("Content-Type", "application/json");
    }

    return fetch(url, {
      ...options,
      headers
    });
  }

  function getRecordsFromData(data) {
    if (Array.isArray(data?.recentResults)) {
      return data.recentResults;
    }

    if (Array.isArray(data?.records)) {
      return data.records;
    }

    if (Array.isArray(data?.results)) {
      return data.results;
    }

    if (Array.isArray(data?.data)) {
      return data.data;
    }

    return [];
  }

  function getSummaryValues(data) {
    const stats = data?.stats || {};

    if (Object.keys(stats).length > 0) {
      return {
        sales: Number(stats.saleAmount ?? 0),
        deliveries: Number(stats.deliveryCount ?? 0),
        hours: Number(stats.workHours ?? 0),
        hourly: Number(stats.hourlyRate ?? 0),
        unitPrice: Number(stats.averageUnitPrice ?? 0)
      };
    }

    const records = getRecordsFromData(data);

    let sales = 0;
    let deliveries = 0;
    let hours = 0;

    for (const record of records) {
      sales += Number(
        record.saleAmount ??
        record.sale_amount ??
        0
      );

      deliveries += Number(
        record.deliveryCount ??
        record.delivery_count ??
        0
      );

      hours += Number(
        record.workHours ??
        record.work_hours ??
        0
      );
    }

    return {
      sales,
      deliveries,
      hours,
      hourly: hours > 0 ? sales / hours : 0,
      unitPrice: deliveries > 0 ? sales / deliveries : 0
    };
  }

  function getPeriodQuery(period) {
    switch (period) {
      case "today":
        return "today";
      case "week":
        return "week";
      case "month":
        return "month";
      case "all":
        return "all";
      default:
        return "today";
    }
  }

  function renderSummary() {
    document.getElementById("summarySales").textContent =
      `¥${formatNumber(state.summary.sales)}`;

    document.getElementById("summaryDeliveries").textContent =
      `${formatNumber(state.summary.deliveries)}件`;

    document.getElementById("summaryHours").textContent =
      formatDuration(state.summary.hours);

    document.getElementById("summaryHourly").textContent =
      `¥${formatNumber(state.summary.hourly)}`;

    document.getElementById("summaryUnitPrice").textContent =
      `¥${formatNumber(state.summary.unitPrice)}`;
  }

  function renderEfficiency(data) {
    const records = state.records;

    let totalSales = 0;
    let totalDeliveries = 0;
    let totalDistance = 0;
    let totalExpense = 0;

    for (const record of records) {
      totalSales += Number(
        record.saleAmount ??
        record.sale_amount ??
        0
      );

      totalDeliveries += Number(
        record.deliveryCount ??
        record.delivery_count ??
        0
      );

      totalDistance += Number(
        record.distanceKm ??
        record.distance_km ??
        0
      );

      totalExpense += Number(
        record.expense ??
        record.expenseAmount ??
        0
      );
    }

    const perDelivery =
      totalDeliveries > 0
        ? totalSales / totalDeliveries
        : 0;

    const deliveriesPerHour =
      state.summary.hours > 0
        ? totalDeliveries / state.summary.hours
        : 0;

    const salesPerKm =
      totalDistance > 0
        ? totalSales / totalDistance
        : 0;

    const expense =
      Number(data?.stats?.expense ?? totalExpense ?? 0);

    document.getElementById("analysisPerDelivery").textContent =
      `¥${formatNumber(perDelivery)}`;

    document.getElementById("analysisDeliveriesPerHour").textContent =
      `${formatNumber(deliveriesPerHour, 1)}件/時`;

    document.getElementById("analysisSalesPerKm").textContent =
      `¥${formatNumber(salesPerKm)}`;

    document.getElementById("analysisExpense").textContent =
      `¥${formatNumber(expense)}`;
  }

  function getRecordValue(record, camelKey, snakeKey, fallback = 0) {
    return record?.[camelKey] ??
      record?.[snakeKey] ??
      fallback;
  }

  function formatDateTime(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return date.toLocaleString("ja-JP", {
      month: "numeric",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function renderRecords() {
    const container = document.getElementById("recordList");

    if (!container) return;

    if (!state.records.length) {
      container.innerHTML = `
        <div class="empty-state">
          この期間の記録はありません。
        </div>
      `;
      return;
    }

    container.innerHTML = state.records.map((record) => {
      const saleAmount = Number(
        getRecordValue(record, "saleAmount", "sale_amount", 0)
      );

      const deliveryCount = Number(
        getRecordValue(record, "deliveryCount", "delivery_count", 0)
      );

      const workHours = Number(
        getRecordValue(record, "workHours", "work_hours", 0)
      );

      const distanceKm = Number(
        getRecordValue(record, "distanceKm", "distance_km", 0)
      );

      const expense = Number(
        record.expense ??
        record.expenseAmount ??
        0
      );

      const createdAt =
        record.createdAt ??
        record.created_at ??
        record.workStartedAt ??
        record.work_started_at ??
        "";

      return `
        <div class="record-item">
          <div class="record-main">
            <div class="record-sales">
              ¥${formatNumber(saleAmount)}
            </div>

            <div class="record-deliveries">
              ${formatNumber(deliveryCount)}件
            </div>
          </div>

          <div class="record-details">
            <span>稼働 ${formatDuration(workHours)}</span>

            ${
              distanceKm > 0
                ? `<span>距離 ${formatNumber(distanceKm, 1)}km</span>`
                : ""
            }

            ${
              expense > 0
                ? `<span>経費 ¥${formatNumber(expense)}</span>`
                : ""
            }

            ${
              createdAt
                ? `<span>${escapeHtml(formatDateTime(createdAt))}</span>`
                : ""
            }
          </div>
        </div>
      `;
    }).join("");
  }

  function renderUser(data) {
    const userNameElement = document.getElementById("userName");

    if (!userNameElement) return;

    const user = data?.user;

    if (!user) {
      userNameElement.textContent = "";
      return;
    }

    const name =
      [user.firstName, user.lastName]
        .filter(Boolean)
        .join(" ")
        .trim() ||
      (user.username ? `@${user.username}` : "");

    userNameElement.textContent = name;
  }

  async function loadPersonal(showLoading = true) {
    if (state.loading) return;

    state.loading = true;

    if (showLoading) {
      showStatus("読み込み中…");
    }

    try {
      const query = getPeriodQuery(state.period);

      const response = await apiFetch(
        `/api/result?period=${encodeURIComponent(query)}`,
        {
          method: "GET"
        }
      );

      const data = await readApiResponse(response);

      state.records = getRecordsFromData(data);
      state.summary = getSummaryValues(data);

      renderUser(data);
      renderSummary();
      renderEfficiency(data);
      renderRecords();

      showStatus("");
    } catch (error) {
      console.error(error);
      showStatus(
        error?.message || "データの取得に失敗しました。",
        "error"
      );
    } finally {
      state.loading = false;
    }
  }

  function setupPeriodTabs() {
    const tabs = document.querySelectorAll(".period-tab");

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const period = tab.dataset.period;

        if (!period || period === state.period) {
          return;
        }

        state.period = period;

        tabs.forEach((item) => {
          item.classList.toggle(
            "active",
            item.dataset.period === state.period
          );
        });

        loadPersonal();
      });
    });
  }

  function setupDetailsToggle() {
    const toggle = document.getElementById("detailsToggle");
    const details = document.getElementById("detailsArea");

    if (!toggle || !details) return;

    toggle.addEventListener("click", () => {
      const isOpen = details.classList.toggle("open");

      toggle.textContent = isOpen
        ? "詳細入力を閉じる"
        : "詳細入力を表示";
    });
  }

  function setupRefresh() {
    const button = document.getElementById("refreshButton");

    if (!button) return;

    button.addEventListener("click", () => {
      loadPersonal();
    });
  }

  function buildWorkStartedAt(timeValue) {
    if (!timeValue) return undefined;

    const parts = timeValue.split(":");

    if (parts.length !== 2) {
      return undefined;
    }

    const hours = Number(parts[0]);
    const minutes = Number(parts[1]);

    if (
      !Number.isInteger(hours) ||
      !Number.isInteger(minutes) ||
      hours < 0 ||
      hours > 23 ||
      minutes < 0 ||
      minutes > 59
    ) {
      return undefined;
    }

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    const hour = String(hours).padStart(2, "0");
    const minute = String(minutes).padStart(2, "0");

    return `${year}-${month}-${day}T${hour}:${minute}:00+09:00`;
  }

  function getOptionalNumber(id) {
    const element = document.getElementById(id);

    if (!element) return undefined;

    const value = element.value.trim();

    if (value === "") {
      return undefined;
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
      return undefined;
    }

    return number;
  }

  function getWorkHoursInput() {
    const hourElement =
      document.getElementById("workHoursHourInput");

    const minuteElement =
      document.getElementById("workHoursMinuteInput");

    const hourText =
      hourElement?.value.trim() ?? "";

    const minuteText =
      minuteElement?.value.trim() ?? "";

    if (hourText === "" && minuteText === "") {
      return {
        value: undefined
      };
    }

    const hours =
      hourText === ""
        ? 0
        : Number(hourText);

    const minutes =
      minuteText === ""
        ? 0
        : Number(minuteText);

    if (
      !Number.isFinite(hours) ||
      !Number.isFinite(minutes)
    ) {
      return {
        error: "稼働時間を正しく入力してください。"
      };
    }

    if (!Number.isInteger(hours) || hours < 0) {
      return {
        error: "稼働時間の「時間」を正しく入力してください。"
      };
    }

    if (
      !Number.isInteger(minutes) ||
      minutes < 0 ||
      minutes > 59
    ) {
      return {
        error: "稼働時間の「分」は0〜59で入力してください。"
      };
    }

    return {
      value: hours + minutes / 60
    };
  }

  async function saveResult(event) {
    event.preventDefault();

    if (state.loading) return;

    const saleAmountInput =
      document.getElementById("saleAmountInput");

    const deliveryCountInput =
      document.getElementById("deliveryCountInput");

    const workStartTimeInput =
      document.getElementById("workStartTimeInput");

    const saleAmountText =
      saleAmountInput?.value.trim() ?? "";

    const deliveryCountText =
      deliveryCountInput?.value.trim() ?? "";

    if (saleAmountText === "") {
      showStatus("売上を入力してください。", "error");
      return;
    }

    if (deliveryCountText === "") {
      showStatus("配達件数を入力してください。", "error");
      return;
    }

    const saleAmount = Number(saleAmountText);
    const deliveryCount = Number(deliveryCountText);

    if (
      !Number.isFinite(saleAmount) ||
      saleAmount < 0
    ) {
      showStatus("売上を正しく入力してください。", "error");
      return;
    }

    if (
      !Number.isInteger(deliveryCount) ||
      deliveryCount < 0
    ) {
      showStatus("配達件数を正しく入力してください。", "error");
      return;
    }

    const workHoursResult = getWorkHoursInput();

    if (workHoursResult.error) {
      showStatus(workHoursResult.error, "error");
      return;
    }

    const workHours = workHoursResult.value;

    const distanceKm =
      getOptionalNumber("distanceInput");

    const expense =
      getOptionalNumber("expenseInput");

    const workStartedAt =
      buildWorkStartedAt(
        workStartTimeInput?.value || ""
      );

    const body = {
      saleAmount,
      deliveryCount
    };

    if (workHours !== undefined) {
      body.workHours = workHours;
    }

    if (distanceKm !== undefined) {
      body.distanceKm = distanceKm;
    }

    if (expense !== undefined) {
      body.expense = expense;
    }

    if (workStartedAt !== undefined) {
      body.workStartedAt = workStartedAt;
    }

    state.loading = true;

    showStatus("保存中…");

    try {
      const response = await apiFetch("/api/result", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      await readApiResponse(response);

      saleAmountInput.value = "";
      deliveryCountInput.value = "";

      if (workStartTimeInput) {
        workStartTimeInput.value = "";
      }

      const workHoursHourInput =
        document.getElementById("workHoursHourInput");

      const workHoursMinuteInput =
        document.getElementById("workHoursMinuteInput");

      if (workHoursHourInput) {
        workHoursHourInput.value = "";
      }

      if (workHoursMinuteInput) {
        workHoursMinuteInput.value = "";
      }

      const distanceInput =
        document.getElementById("distanceInput");

      if (distanceInput) {
        distanceInput.value = "";
      }

      const expenseInput =
        document.getElementById("expenseInput");

      if (expenseInput) {
        expenseInput.value = "";
      }

      showStatus("保存しました。", "success");

      await loadPersonal(false);
    } catch (error) {
      console.error(error);

      showStatus(
        error?.message || "保存に失敗しました。",
        "error"
      );
    } finally {
      state.loading = false;
    }
  }

  function setupForm() {
    const form = document.getElementById("resultForm");

    if (!form) return;

    form.addEventListener("submit", saveResult);
  }

  function setupTelegram() {
    if (!tg) return;

    try {
      tg.ready();
      tg.expand();
    } catch (error) {
      console.warn("Telegram WebApp initialization failed.", error);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    setupTelegram();
    setupPeriodTabs();
    setupDetailsToggle();
    setupRefresh();
    setupForm();

    const initialTab =
      document.querySelector(
        `.period-tab[data-period="${state.period}"]`
      );

    if (initialTab) {
      initialTab.classList.add("active");
    }

    loadPersonal();
  });
</script>
</body>
</html>
