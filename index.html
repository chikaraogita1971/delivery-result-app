<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>パフォーマンス分析</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title-area {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .user-name {
      margin-top: 4px;
      color: #6b7280;
      font-size: 13px;
    }

    .refresh-button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
      padding: 9px 12px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .period-tab {
      border: 0;
      border-radius: 10px;
      background: #e5e7eb;
      padding: 10px 4px;
      color: #374151;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      background: #111827;
      color: #ffffff;
    }

    .card {
      margin-bottom: 14px;
      border-radius: 14px;
      background: #ffffff;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    input[type="number"],
    input[type="time"] {
      width: 100%;
      min-height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      padding: 9px 11px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    .save-button {
      width: 100%;
      min-height: 46px;
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      cursor: pointer;
      font-weight: 800;
    }

    .save-button:active {
      transform: translateY(1px);
    }

    .details-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 12px 0;
      text-align: left;
      color: #374151;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .details-area {
      display: none;
      padding-top: 4px;
    }

    .details-area.open {
      display: block;
    }

    .duration-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .duration-input input {
      flex: 1;
      min-width: 0;
    }

    .duration-unit {
      flex: 0 0 auto;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    .status-message {
      min-height: 20px;
      margin: 8px 0;
      color: #6b7280;
      font-size: 13px;
    }

    .status-message.error {
      color: #dc2626;
    }

    .status-message.success {
      color: #059669;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-item {
      border-radius: 10px;
      background: #f9fafb;
      padding: 12px;
    }

    .summary-label {
      margin-bottom: 4px;
      color: #6b7280;
      font-size: 12px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 800;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .analysis-item {
      border-radius: 10px;
      background: #f9fafb;
      padding: 12px;
    }

    .analysis-label {
      margin-bottom: 4px;
      color: #6b7280;
      font-size: 12px;
    }

    .analysis-value {
      font-size: 17px;
      font-weight: 800;
    }

    .record-item {
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .record-item:first-child {
      padding-top: 0;
    }

    .record-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .record-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .record-sales {
      font-size: 18px;
      font-weight: 800;
    }

    .record-deliveries {
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    .record-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      color: #6b7280;
      font-size: 12px;
    }

    .empty-state {
      padding: 18px 0;
      color: #6b7280;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .app {
        padding: 12px;
      }

      .summary-grid,
      .analysis-grid {
        grid-template-columns: 1fr 1fr;
      }

      .period-tab {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <div class="title-area">
        <h1 class="title">パフォーマンス分析</h1>
        <div id="userName" class="user-name"></div>
      </div>

      <button
        type="button"
        id="refreshButton"
        class="refresh-button"
      >
        ↻ 更新
      </button>
    </header>

    <div class="period-tabs">
      <button
        type="button"
        class="period-tab active"
        data-period="today"
      >
        今日
      </button>

      <button
        type="button"
        class="period-tab"
        data-period="week"
      >
        今週
      </button>

      <button
        type="button"
        class="period-tab"
        data-period="month"
      >
        今月
      </button>

      <button
        type="button"
        class="period-tab"
        data-period="all"
      >
        全期間
      </button>
    </div>

    <div
      id="statusMessage"
      class="status-message"
      aria-live="polite"
    ></div>

    <section class="card">
      <h2 class="card-title">結果を記録</h2>

      <form id="resultForm">

        <div class="form-group">
          <label for="saleAmountInput">売上（円）</label>
          <input
            id="saleAmountInput"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="例：15000"
            required
          />
        </div>

        <div class="form-group">
          <label for="deliveryCountInput">配達件数</label>
          <input
            id="deliveryCountInput"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="例：25"
            required
          />
        </div>

        <button
          type="button"
          id="detailsToggle"
          class="details-toggle"
        >
          詳細設定（任意）＋
        </button>

        <div
          id="detailsArea"
          class="details-area"
        >

          <div class="form-group">
            <label for="workStartTimeInput">
              稼働開始時刻
            </label>

            <input
              id="workStartTimeInput"
              type="time"
            />
          </div>

          <div class="form-group">
            <label>稼働時間</label>

            <div class="duration-input">
              <input
                id="workHoursHourInput"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="8"
              />

              <span class="duration-unit">時間</span>

              <input
                id="workHoursMinuteInput"
                type="number"
                min="0"
                max="59"
                step="1"
                inputmode="numeric"
                placeholder="17"
              />

              <span class="duration-unit">分</span>
            </div>
          </div>

          <div class="form-group">
            <label for="distanceInput">
              走行距離（km）
            </label>

            <input
              id="distanceInput"
              type="number"
              min="0"
              step="0.1"
              inputmode="decimal"
              placeholder="例：35.5"
            />
          </div>

          <div class="form-group">
            <label for="expenseInput">
              経費（円）
            </label>

            <input
              id="expenseInput"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              placeholder="例：1200"
            />
          </div>

        </div>

        <button
          type="submit"
          class="save-button"
        >
          記録を保存
        </button>

      </form>
    </section>

    <section class="card">
      <h2 class="card-title">サマリー</h2>

      <div class="summary-grid">

        <div class="summary-item">
          <div class="summary-label">売上</div>
          <div
            id="summarySales"
            class="summary-value"
          >
            ¥0
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">配達件数</div>
          <div
            id="summaryDeliveries"
            class="summary-value"
          >
            0件
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">稼働時間</div>
          <div
            id="summaryHours"
            class="summary-value"
          >
            0時間
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">時給</div>
          <div
            id="summaryHourly"
            class="summary-value"
          >
            ¥0
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">平均単価</div>
          <div
            id="summaryUnitPrice"
            class="summary-value"
          >
            ¥0
          </div>
        </div>

      </div>
    </section>
        <section class="card">
      <h2 class="card-title">効率分析</h2>

      <div class="analysis-grid">

        <div class="analysis-item">
          <div class="analysis-label">1件あたり売上</div>
          <div
            id="analysisPerDelivery"
            class="analysis-value"
          >
            ¥0
          </div>
        </div>

        <div class="analysis-item">
          <div class="analysis-label">1時間あたり配達</div>
          <div
            id="analysisDeliveriesPerHour"
            class="analysis-value"
          >
            0件/時
          </div>
        </div>

        <div class="analysis-item">
          <div class="analysis-label">1kmあたり売上</div>
          <div
            id="analysisSalesPerKm"
            class="analysis-value"
          >
            ¥0
          </div>
        </div>

        <div class="analysis-item">
          <div class="analysis-label">経費</div>
          <div
            id="analysisExpense"
            class="analysis-value"
          >
            ¥0
          </div>
        </div>

      </div>
    </section>

    <section class="card">
      <h2 class="card-title">記録一覧</h2>

      <div id="recordList">
        <div class="empty-state">
          読み込み中…
        </div>
      </div>
    </section>

  </main>

  <script>
    const tg = window.Telegram?.WebApp || null;

    const state = {
      period: "today",
      loading: false,
      records: [],
      summary: {
        sales: 0,
        deliveries: 0,
        hours: 0,
        hourly: 0,
        unitPrice: 0
      }
    };

    function formatNumber(value, digits = 0) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "0";
      }

      return number.toLocaleString("ja-JP", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function formatDuration(hours) {
      const number = Number(hours);

      if (!Number.isFinite(number) || number <= 0) {
        return "0時間";
      }

      const totalMinutes = Math.round(number * 60);
      const wholeHours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      if (wholeHours === 0) {
        return `${minutes}分`;
      }

      if (minutes === 0) {
        return `${wholeHours}時間`;
      }

      return `${wholeHours}時間${minutes}分`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showStatus(message, type = "") {
      const element =
        document.getElementById("statusMessage");

      if (!element) return;

      element.textContent = message || "";
      element.className =
        `status-message${type ? ` ${type}` : ""}`;
    }

    async function readApiResponse(response) {
      const text = await response.text();

      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch (error) {
        throw new Error(
          `サーバーから不正なレスポンスが返されました (${response.status})`
        );
      }

      if (!response.ok || data?.ok === false) {
        throw new Error(
          data?.error ||
          data?.message ||
          `通信に失敗しました (${response.status})`
        );
      }

      return data;
    }

    async function apiFetch(url, options = {}) {
      const headers =
        new Headers(options.headers || {});

      if (tg?.initData) {
        headers.set(
          "X-Telegram-Init-Data",
          tg.initData
        );
      }

      if (
        options.body &&
        !headers.has("Content-Type") &&
        typeof options.body === "string"
      ) {
        headers.set(
          "Content-Type",
          "application/json"
        );
      }

      return fetch(url, {
        ...options,
        headers
      });
    }

    function getRecordsFromData(data) {
      if (Array.isArray(data?.recentResults)) {
        return data.recentResults;
      }

      if (Array.isArray(data?.records)) {
        return data.records;
      }

      if (Array.isArray(data?.results)) {
        return data.results;
      }

      if (Array.isArray(data?.data)) {
        return data.data;
      }

      return [];
    }

    function getSummaryValues(data) {
      const stats = data?.stats || {};

      if (Object.keys(stats).length > 0) {
        return {
          sales: Number(
            stats.saleAmount ?? 0
          ),

          deliveries: Number(
            stats.deliveryCount ?? 0
          ),

          hours: Number(
            stats.workHours ?? 0
          ),

          hourly: Number(
            stats.hourlyRate ?? 0
          ),

          unitPrice: Number(
            stats.averageUnitPrice ?? 0
          )
        };
      }

      const records =
        getRecordsFromData(data);

      let sales = 0;
      let deliveries = 0;
      let hours = 0;

      for (const record of records) {
        sales += Number(
          record.saleAmount ??
          record.sale_amount ??
          0
        );

        deliveries += Number(
          record.deliveryCount ??
          record.delivery_count ??
          0
        );

        hours += Number(
          record.workHours ??
          record.work_hours ??
          0
        );
      }

      return {
        sales,
        deliveries,
        hours,
        hourly:
          hours > 0
            ? sales / hours
            : 0,
        unitPrice:
          deliveries > 0
            ? sales / deliveries
            : 0
      };
    }

    function getPeriodQuery(period) {
      switch (period) {
        case "today":
          return "today";

        case "week":
          return "week";

        case "month":
          return "month";

        case "all":
          return "all";

        default:
          return "today";
      }
    }

    function renderSummary() {
      document.getElementById(
        "summarySales"
      ).textContent =
        `¥${formatNumber(state.summary.sales)}`;

      document.getElementById(
        "summaryDeliveries"
      ).textContent =
        `${formatNumber(state.summary.deliveries)}件`;

      document.getElementById(
        "summaryHours"
      ).textContent =
        formatDuration(state.summary.hours);

      document.getElementById(
        "summaryHourly"
      ).textContent =
        `¥${formatNumber(state.summary.hourly)}`;

      document.getElementById(
        "summaryUnitPrice"
      ).textContent =
        `¥${formatNumber(state.summary.unitPrice)}`;
    }

    function renderEfficiency(data) {
      const records = state.records;

      let totalSales = 0;
      let totalDeliveries = 0;
      let totalDistance = 0;
      let totalExpense = 0;

      for (const record of records) {
        totalSales += Number(
          record.saleAmount ??
          record.sale_amount ??
          0
        );

        totalDeliveries += Number(
          record.deliveryCount ??
          record.delivery_count ??
          0
        );

        totalDistance += Number(
          record.distanceKm ??
          record.distance_km ??
          0
        );

        totalExpense += Number(
          record.expense ??
          record.expenseAmount ??
          0
        );
      }

      const perDelivery =
        totalDeliveries > 0
          ? totalSales / totalDeliveries
          : 0;

      const deliveriesPerHour =
        state.summary.hours > 0
          ? totalDeliveries /
            state.summary.hours
          : 0;

      const salesPerKm =
        totalDistance > 0
          ? totalSales / totalDistance
          : 0;

      const expense =
        Number(
          data?.stats?.expense ??
          totalExpense ??
          0
        );

      document.getElementById(
        "analysisPerDelivery"
      ).textContent =
        `¥${formatNumber(perDelivery)}`;

      document.getElementById(
        "analysisDeliveriesPerHour"
      ).textContent =
        `${formatNumber(
          deliveriesPerHour,
          1
        )}件/時`;

      document.getElementById(
        "analysisSalesPerKm"
      ).textContent =
        `¥${formatNumber(salesPerKm)}`;

      document.getElementById(
        "analysisExpense"
      ).textContent =
        `¥${formatNumber(expense)}`;
    }

    function getRecordValue(
      record,
      camelKey,
      snakeKey,
      fallback = 0
    ) {
      return (
        record?.[camelKey] ??
        record?.[snakeKey] ??
        fallback
      );
    }

    function formatDateTime(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderRecords() {
      const container =
        document.getElementById("recordList");

      if (!container) return;

      if (!state.records.length) {
        container.innerHTML = `
          <div class="empty-state">
            この期間の記録はありません。
          </div>
        `;

        return;
      }

      container.innerHTML =
        state.records.map((record) => {
          const saleAmount =
            Number(
              getRecordValue(
                record,
                "saleAmount",
                "sale_amount",
                0
              )
            );

          const deliveryCount =
            Number(
              getRecordValue(
                record,
                "deliveryCount",
                "delivery_count",
                0
              )
            );

          const workHours =
            Number(
              getRecordValue(
                record,
                "workHours",
                "work_hours",
                0
              )
            );

          const distanceKm =
            Number(
              getRecordValue(
                record,
                "distanceKm",
                "distance_km",
                0
              )
            );

          const expense =
            Number(
              record.expense ??
              record.expenseAmount ??
              0
            );

          const createdAt =
            record.createdAt ??
            record.created_at ??
            record.workStartedAt ??
            record.work_started_at ??
            "";

          return `
            <div class="record-item">

              <div class="record-main">

                <div class="record-sales">
                  ¥${formatNumber(saleAmount)}
                </div>

                <div class="record-deliveries">
                  ${formatNumber(deliveryCount)}件
                </div>

              </div>

              <div class="record-details">

                <span>
                  稼働 ${formatDuration(workHours)}
                </span>

                ${
                  distanceKm > 0
                    ? `
                      <span>
                        距離
                        ${formatNumber(
                          distanceKm,
                          1
                        )}km
                      </span>
                    `
                    : ""
                }

                ${
                  expense > 0
                    ? `
                      <span>
                        経費
                        ¥${formatNumber(expense)}
                      </span>
                    `
                    : ""
                }

                ${
                  createdAt
                    ? `
                      <span>
                        ${escapeHtml(
                          formatDateTime(createdAt)
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

            </div>
          `;
        }).join("");
    }

    function renderUser(data) {
      const userNameElement =
        document.getElementById("userName");

      if (!userNameElement) return;

      const user = data?.user;

      if (!user) {
        userNameElement.textContent = "";
        return;
      }

      const name =
        [
          user.firstName,
          user.lastName
        ]
          .filter(Boolean)
          .join(" ")
          .trim() ||
        (
          user.username
            ? `@${user.username}`
            : ""
        );

      userNameElement.textContent = name;
    }

    async function loadPersonal(
      showLoading = true
    ) {
      if (state.loading) return;

      state.loading = true;

      if (showLoading) {
        showStatus("読み込み中…");
      }

      try {
        const query =
          getPeriodQuery(state.period);

        const response =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(query)}`,
            {
              method: "GET"
            }
          );

        const data =
          await readApiResponse(response);

        state.records =
          getRecordsFromData(data);

        state.summary =
          getSummaryValues(data);

        renderUser(data);
        renderSummary();
        renderEfficiency(data);
        renderRecords();

        showStatus("");
      } catch (error) {
        console.error(error);

        showStatus(
          error?.message ||
          "データの取得に失敗しました。",
          "error"
        );
      } finally {
        state.loading = false;
      }
    }
        function setupPeriodTabs() {
      const tabs =
        document.querySelectorAll(".period-tab");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const period = tab.dataset.period;

          if (
            !period ||
            period === state.period
          ) {
            return;
          }

          state.period = period;

          tabs.forEach((item) => {
            item.classList.toggle(
              "active",
              item.dataset.period ===
                state.period
            );
          });

          loadPersonal();
        });
      });
    }

    function setupDetailsToggle() {
      const toggle =
        document.getElementById(
          "detailsToggle"
        );

      const details =
        document.getElementById(
          "detailsArea"
        );

      if (!toggle || !details) {
        console.warn(
          "詳細設定の開閉要素が見つかりません。"
        );
        return;
      }

      toggle.addEventListener(
        "click",
        (event) => {
          event.preventDefault();

          const isOpen =
            details.classList.toggle(
              "open"
            );

          toggle.textContent =
            isOpen
              ? "詳細設定（任意）−"
              : "詳細設定（任意）＋";
        }
      );
    }

    function setupRefresh() {
      const button =
        document.getElementById(
          "refreshButton"
        );

      if (!button) return;

      button.addEventListener(
        "click",
        () => {
          loadPersonal();
        }
      );
    }

    function buildWorkStartedAt(
      timeValue
    ) {
      if (!timeValue) {
        return undefined;
      }

      const parts =
        timeValue.split(":");

      if (parts.length !== 2) {
        return undefined;
      }

      const hours =
        Number(parts[0]);

      const minutes =
        Number(parts[1]);

      if (
        !Number.isInteger(hours) ||
        !Number.isInteger(minutes) ||
        hours < 0 ||
        hours > 23 ||
        minutes < 0 ||
        minutes > 59
      ) {
        return undefined;
      }

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");

      const hour =
        String(hours).padStart(2, "0");

      const minute =
        String(minutes).padStart(2, "0");

      return (
        `${year}-${month}-${day}` +
        `T${hour}:${minute}:00+09:00`
      );
    }

    function getOptionalNumber(id) {
      const element =
        document.getElementById(id);

      if (!element) {
        return undefined;
      }

      const value =
        element.value.trim();

      if (value === "") {
        return undefined;
      }

      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return undefined;
      }

      return number;
    }

    function getWorkHoursInput() {
      const hourElement =
        document.getElementById(
          "workHoursHourInput"
        );

      const minuteElement =
        document.getElementById(
          "workHoursMinuteInput"
        );

      const hourText =
        hourElement?.value.trim() ?? "";

      const minuteText =
        minuteElement?.value.trim() ?? "";

      if (
        hourText === "" &&
        minuteText === ""
      ) {
        return {
          value: undefined
        };
      }

      const hours =
        hourText === ""
          ? 0
          : Number(hourText);

      const minutes =
        minuteText === ""
          ? 0
          : Number(minuteText);

      if (
        !Number.isFinite(hours) ||
        !Number.isFinite(minutes)
      ) {
        return {
          error:
            "稼働時間を正しく入力してください。"
        };
      }

      if (
        !Number.isInteger(hours) ||
        hours < 0
      ) {
        return {
          error:
            "稼働時間の「時間」を正しく入力してください。"
        };
      }

      if (
        !Number.isInteger(minutes) ||
        minutes < 0 ||
        minutes > 59
      ) {
        return {
          error:
            "稼働時間の「分」は0〜59で入力してください。"
        };
      }

      return {
        value:
          hours + minutes / 60
      };
    }

    async function saveResult(event) {
      event.preventDefault();

      if (state.loading) {
        return;
      }

      const saleAmountInput =
        document.getElementById(
          "saleAmountInput"
        );

      const deliveryCountInput =
        document.getElementById(
          "deliveryCountInput"
        );

      const workStartTimeInput =
        document.getElementById(
          "workStartTimeInput"
        );

      const saleAmountText =
        saleAmountInput?.value.trim() ?? "";

      const deliveryCountText =
        deliveryCountInput?.value.trim() ?? "";

      if (saleAmountText === "") {
        showStatus(
          "売上を入力してください。",
          "error"
        );
        return;
      }

      if (
        deliveryCountText === ""
      ) {
        showStatus(
          "配達件数を入力してください。",
          "error"
        );
        return;
      }

      const saleAmount =
        Number(saleAmountText);

      const deliveryCount =
        Number(deliveryCountText);

      if (
        !Number.isFinite(saleAmount) ||
        saleAmount < 0
      ) {
        showStatus(
          "売上を正しく入力してください。",
          "error"
        );
        return;
      }

      if (
        !Number.isInteger(
          deliveryCount
        ) ||
        deliveryCount < 0
      ) {
        showStatus(
          "配達件数を正しく入力してください。",
          "error"
        );
        return;
      }

      const workHoursResult =
        getWorkHoursInput();

      if (workHoursResult.error) {
        showStatus(
          workHoursResult.error,
          "error"
        );
        return;
      }

      const workHours =
        workHoursResult.value;

      const distanceKm =
        getOptionalNumber(
          "distanceInput"
        );

      const expense =
        getOptionalNumber(
          "expenseInput"
        );

      const workStartedAt =
        buildWorkStartedAt(
          workStartTimeInput?.value || ""
        );

      const body = {
        saleAmount,
        deliveryCount
      };

      if (
        workHours !== undefined
      ) {
        body.workHours =
          workHours;
      }

      if (
        distanceKm !== undefined
      ) {
        body.distanceKm =
          distanceKm;
      }

      if (
        expense !== undefined
      ) {
        body.expense =
          expense;
      }

      if (
        workStartedAt !== undefined
      ) {
        body.workStartedAt =
          workStartedAt;
      }

      state.loading = true;

      showStatus("保存中…");

      try {
        const response =
          await apiFetch(
            "/api/result",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify(body)
            }
          );

        await readApiResponse(
          response
        );

        saleAmountInput.value = "";
        deliveryCountInput.value = "";

        if (workStartTimeInput) {
          workStartTimeInput.value = "";
        }

        const workHoursHourInput =
          document.getElementById(
            "workHoursHourInput"
          );

        const workHoursMinuteInput =
          document.getElementById(
            "workHoursMinuteInput"
          );

        if (workHoursHourInput) {
          workHoursHourInput.value = "";
        }

        if (workHoursMinuteInput) {
          workHoursMinuteInput.value = "";
        }

        const distanceInput =
          document.getElementById(
            "distanceInput"
          );

        if (distanceInput) {
          distanceInput.value = "";
        }

        const expenseInput =
          document.getElementById(
            "expenseInput"
          );

        if (expenseInput) {
          expenseInput.value = "";
        }

        showStatus(
          "保存しました。",
          "success"
        );

        await loadPersonal(false);
      } catch (error) {
        console.error(error);

        showStatus(
          error?.message ||
            "保存に失敗しました。",
          "error"
        );
      } finally {
        state.loading = false;
      }
    }

    function setupForm() {
      const form =
        document.getElementById(
          "resultForm"
        );

      if (!form) {
        return;
      }

      form.addEventListener(
        "submit",
        saveResult
      );
    }

    function setupTelegram() {
      if (!tg) {
        return;
      }

      try {
        tg.ready();
        tg.expand();
      } catch (error) {
        console.warn(
          "Telegram WebApp initialization failed.",
          error
        );
      }
    }

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        setupTelegram();
        setupPeriodTabs();
        setupDetailsToggle();
        setupRefresh();
        setupForm();

        const initialTab =
          document.querySelector(
            `.period-tab[data-period="${state.period}"]`
          );

        if (initialTab) {
          initialTab.classList.add(
            "active"
          );
        }

        loadPersonal();
      }
    );
  </script>
</body>
</html>
