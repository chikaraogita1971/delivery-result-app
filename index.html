<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>配達リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f5f7fb;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      padding-bottom: 32px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }

    /* =========================================
       Header
    ========================================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 16px;
      margin-bottom: 12px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .header-left {
      min-width: 0;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .user-name {
      margin-top: 4px;
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .refresh-btn {
      flex-shrink: 0;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 12px;

      background: #f3f4f6;
      color: #374151;

      font-size: 18px;
    }

    .refresh-btn:active {
      transform: scale(0.96);
    }


    /* =========================================
       Main Navigation
    ========================================= */

    .main-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;

      margin-bottom: 12px;
    }

    .main-tab {
      min-height: 46px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      background: #ffffff;
      color: #6b7280;

      font-size: 14px;
      font-weight: 700;
    }

    .main-tab.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    .main-tab.admin-tab {
      display: none;
    }


    /* =========================================
       Section
    ========================================= */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }


    /* =========================================
       Period Tabs
    ========================================= */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;

      margin-bottom: 12px;
    }

    .period-tab {
      min-height: 42px;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      background: #ffffff;
      color: #6b7280;

      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }


    /* =========================================
       Cards
    ========================================= */

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      padding: 16px;
      margin-bottom: 12px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-bottom: 14px;

      font-size: 15px;
      font-weight: 800;
    }

    .card-subtitle {
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }


    /* =========================================
       Hero Stats
    ========================================= */

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;

      margin-bottom: 12px;
    }

    .hero-card {
      padding: 16px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .hero-label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-value {
      margin-top: 7px;

      font-size: 27px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .hero-unit {
      margin-left: 3px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
    }


    /* =========================================
       Stats Grid
    ========================================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-box {
      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 850;
    }


    /* =========================================
       Goal
    ========================================= */

    .goal-card {
      background: #111827;
      color: #ffffff;
      border: 0;
    }

    .goal-card .card-title {
      color: #ffffff;
    }

    .goal-summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .goal-count {
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
    }

    .goal-count span {
      margin-left: 4px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.7;
    }

    .goal-rate {
      font-size: 22px;
      font-weight: 900;
    }

    .progress-track {
      height: 10px;
      margin-top: 15px;

      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;

      background: #ffffff;
      border-radius: 999px;

      transition: width 0.35s ease;
    }

    .goal-input-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .goal-input {
      flex: 1;
      min-width: 0;

      height: 42px;
      padding: 0 12px;

      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 11px;

      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      outline: none;
    }

    .goal-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .goal-save-btn {
      height: 42px;
      padding: 0 14px;

      border: 0;
      border-radius: 11px;

      background: #ffffff;
      color: #111827;

      font-size: 13px;
      font-weight: 800;
    }


    /* =========================================
       Highlight
    ========================================= */

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .highlight {
      padding: 14px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .highlight-icon {
      font-size: 19px;
    }

    .highlight-label {
      margin-top: 6px;
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .highlight-value {
      margin-top: 3px;
      font-size: 19px;
      font-weight: 900;
    }


    /* =========================================
       Record
    ========================================= */

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 12px;

      background: #f9fafb;
      border-radius: 13px;
    }

    .record-date {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .record-main {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 800;
    }

    .record-side {
      text-align: right;
      flex-shrink: 0;
    }

    .record-sales {
      font-size: 14px;
      font-weight: 850;
    }

    .record-hours {
      margin-top: 2px;
      color: #6b7280;
      font-size: 11px;
    }


    /* =========================================
       Analytics
    ========================================= */

    .analytics-section-title {
      margin: 18px 2px 8px;

      font-size: 13px;
      font-weight: 900;
      color: #374151;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .analytics-item {
      padding: 14px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .analytics-item-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .analytics-item-value {
      margin-top: 5px;

      font-size: 19px;
      font-weight: 900;
    }

    .analytics-item-sub {
      margin-top: 3px;

      color: #9ca3af;
      font-size: 10px;
    }


    /* =========================================
       New Record Banner
    ========================================= */

    .record-banner {
      display: none;

      padding: 14px 16px;
      margin-bottom: 12px;

      border-radius: 16px;

      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .record-banner.show {
      display: block;
    }

    .record-banner-title {
      font-size: 15px;
      font-weight: 900;
      color: #9a3412;
    }

    .record-banner-text {
      margin-top: 4px;

      color: #c2410c;
      font-size: 12px;
      font-weight: 600;
    }


    /* =========================================
       Pace
    ========================================= */

    .pace-card {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .pace-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .pace-value {
      font-size: 28px;
      font-weight: 900;
    }

    .pace-unit {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
    }

    .pace-detail {
      margin-top: 8px;

      color: #475569;
      font-size: 12px;
      line-height: 1.6;
    }


    /* =========================================
       Empty / Loading / Error
    ========================================= */

    .loading,
    .empty,
    .error-box {
      padding: 24px 14px;

      text-align: center;

      color: #6b7280;
      font-size: 13px;
    }

    .error-box {
      color: #b91c1c;

      background: #fef2f2;
      border: 1px solid #fecaca;

      border-radius: 14px;
    }


    /* =========================================
       Admin
    ========================================= */

    .admin-only {
      display: none;
    }

    .admin-only.visible {
      display: block;
    }


    /* =========================================
       Reset
    ========================================= */

    .danger-btn {
      width: 100%;
      min-height: 46px;

      border: 1px solid #fecaca;
      border-radius: 13px;

      background: #fff1f2;
      color: #be123c;

      font-size: 13px;
      font-weight: 800;
    }


    /* =========================================
       Responsive
    ========================================= */

    @media (max-width: 420px) {
      .app {
        padding: 10px;
      }

      .hero-value {
        font-size: 24px;
      }

      .goal-count {
        font-size: 27px;
      }

      .analytics-item-value {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =====================================
         Header
    ====================================== -->

    <header class="header">

      <div class="header-left">
        <h1 class="app-title">
          📦 配達リザルト
        </h1>

        <div
          id="userName"
          class="user-name"
        >
          読み込み中...
        </div>
      </div>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
        aria-label="更新"
      >
        🔄
      </button>

    </header>


    <!-- =====================================
         Main Tabs
    ====================================== -->

    <nav class="main-tabs">

      <button
        class="main-tab active"
        data-section="personal"
        type="button"
      >
        📊 個人実績
      </button>

      <button
        class="main-tab"
        data-section="analytics"
        type="button"
      >
        📈 分析
      </button>

      <button
        id="adminTab"
        class="main-tab admin-tab"
        data-section="admin"
        type="button"
      >
        🛠 管理
      </button>

    </nav>


    <!-- =====================================
         Personal
    ====================================== -->

    <section
      id="personalSection"
      class="section active"
    >

      <!-- Period -->

      <div class="period-tabs">

        <button
          class="period-tab active"
          data-period="today"
          type="button"
        >
          今日
        </button>

        <button
          class="period-tab"
          data-period="week"
          type="button"
        >
          今週
        </button>

        <button
          class="period-tab"
          data-period="month"
          type="button"
        >
          今月
        </button>

        <button
          class="period-tab"
          data-period="year"
          type="button"
        >
          年間
        </button>

      </div>


      <!-- Record update banner -->

      <div
        id="recordBanner"
        class="record-banner"
      >
        <div
          id="recordBannerTitle"
          class="record-banner-title"
        ></div>

        <div
          id="recordBannerText"
          class="record-banner-text"
        ></div>
      </div>


      <!-- Hero -->

      <div
        id="personalHero"
        class="hero-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>


      <!-- Basic stats -->

      <div
        id="personalStats"
        class="card"
      >
        <div class="card-title">
          📊 基本実績
        </div>

        <div
          id="personalStatsGrid"
          class="stats-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>
      </div>


      <!-- Goal -->

      <div
        id="goalCard"
        class="card goal-card"
      >

        <div class="card-title">
          🎯 今月の目標

          <span
            id="goalMonthLabel"
            class="card-subtitle"
            style="color: rgba(255,255,255,.6)"
          >
            今月
          </span>
        </div>

        <div class="goal-summary">

          <div>
            <div
              id="goalCount"
              class="goal-count"
            >
              0
              <span>件</span>
            </div>
          </div>

          <div
            id="goalRate"
            class="goal-rate"
          >
            0%
          </div>

        </div>

        <div class="progress-track">
          <div
            id="goalProgress"
            class="progress-bar"
          ></div>
        </div>

        <div
          id="goalMessage"
          style="
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            opacity: .85;
          "
        >
        </div>

        <div class="goal-input-row">

          <input
            id="goalInput"
            class="goal-input"
            type="number"
            min="0"
            inputmode="numeric"
            placeholder="月間目標件数"
          />

          <button
            id="goalSaveBtn"
            class="goal-save-btn"
            type="button"
          >
            保存
          </button>

        </div>

      </div>


      <!-- Highlights -->

      <div class="card">

        <div class="card-title">
          🔥 今日のハイライト
        </div>

        <div
          id="todayHighlights"
          class="highlight-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Monthly best -->

      <div class="card">

        <div class="card-title">
          🏆 今月最高記録
        </div>

        <div
          id="monthlyBest"
          class="highlight-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Streak -->

      <div class="card">

        <div class="card-title">
          🔥 連続稼働
        </div>

        <div
          id="streakCard"
          class="highlight-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Records -->

      <div class="card">

        <div class="card-title">

          <span>
            📝 実績履歴
          </span>

          <span
            id="recordPeriodLabel"
            class="card-subtitle"
          >
            今日
          </span>

        </div>

        <div
          id="records"
          class="record-list"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Reset -->

      <div class="card">

        <button
          id="resetBtn"
          class="danger-btn"
          type="button"
        >
          🗑 自分の実績をリセット
        </button>

      </div>

    </section>


    <!-- =====================================
         Analytics
    ====================================== -->

    <section
      id="analyticsSection"
      class="section"
    >

      <div class="card">

        <div class="card-title">
          📈 個人分析

          <span
            id="analyticsDateLabel"
            class="card-subtitle"
          ></span>
        </div>

        <div class="analytics-section-title">
          ⚡ 今日のパフォーマンス
        </div>

        <div
          id="todayAnalytics"
          class="analytics-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>


        <div class="analytics-section-title">
          📊 ペース分析
        </div>

        <div
          id="paceAnalytics"
          class="analytics-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>


        <div class="analytics-section-title">
          🎯 目標分析
        </div>

        <div
          id="goalAnalytics"
          class="analytics-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>


        <div class="analytics-section-title">
          🏆 自己ベスト
        </div>

        <div
          id="bestAnalytics"
          class="analytics-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>


        <div class="analytics-section-title">
          🔄 前月・前日比較
        </div>

        <div
          id="comparisonAnalytics"
          class="analytics-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Daily trend -->

      <div class="card">

        <div class="card-title">
          📅 今月の日別推移
        </div>

        <div
          id="dailyAnalytics"
          class="record-list"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>

    </section>


    <!-- =====================================
         Admin
    ====================================== -->

    <section
      id="adminSection"
      class="section admin-only"
    >

      <div class="card">

        <div class="card-title">
          🛠 管理
        </div>

        <div
          id="adminContent"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>

    </section>

  </div>


  <!-- =====================================
       JavaScript
  ====================================== -->

  <script>
  // =========================================================
  // Telegram
  // =========================================================

  const tg =
    window.Telegram?.WebApp || null;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  // =========================================================
  // Constants
  // =========================================================

  const JST = "Asia/Tokyo";

  let activeSection = "personal";
  let activePeriod = "today";

  let currentAnalytics = null;
  let currentPersonal = null;


  // =========================================================
  // Utility
  // =========================================================

  function formatNumber(value) {
    return Number(
      value || 0
    ).toLocaleString("ja-JP");
  }


  function formatHours(value) {
    const hours =
      Number(value || 0);

    return hours.toFixed(2);
  }


  function formatPercent(value) {
    const number =
      Number(value || 0);

    return `${number.toFixed(1)}%`;
  }


  function formatYen(value) {
    return `${formatNumber(value)}円`;
  }


  function formatSignedYen(value) {
    const number =
      Number(value || 0);

    if (number > 0) {
      return `+${formatNumber(number)}円`;
    }

    if (number < 0) {
      return `-${formatNumber(Math.abs(number))}円`;
    }

    return "±0円";
  }


  function formatSignedCount(value) {
    const number =
      Number(value || 0);

    if (number > 0) {
      return `+${formatNumber(number)}件`;
    }

    if (number < 0) {
      return `-${formatNumber(Math.abs(number))}件`;
    }

    return "±0件";
  }


  function formatDateJST(dateString) {
    if (!dateString) {
      return "";
    }

    const date =
      new Date(
        `${dateString}T00:00:00+09:00`
      );

    return new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: JST,
        month: "numeric",
        day: "numeric",
        weekday: "short"
      }
    ).format(date);
  }


  function escapeHtml(value) {
    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function showError(
    elementId,
    message = "データを取得できませんでした"
  ) {
    const element =
      document.getElementById(
        elementId
      );

    if (!element) {
      return;
    }

    element.innerHTML = `
      <div class="error-box">
        ${escapeHtml(message)}
      </div>
    `;
  }


  // =========================================================
  // API
  // =========================================================

  async function apiFetch(
    path,
    options = {}
  ) {
    const headers = {
      ...(options.headers || {})
    };

    if (
      tg?.initData
    ) {
      headers[
        "X-Telegram-Init-Data"
      ] = tg.initData;
    }

    const response =
      await fetch(
        path,
        {
          ...options,
          headers
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      throw new Error(
        "サーバーから不正なレスポンスが返りました"
      );
    }

    if (!response.ok || data?.ok === false) {
      throw new Error(
        data?.error ||
        data?.message ||
        `HTTP ${response.status}`
      );
    }

    return data;
  }

              : element.id ===

    period

      case "year":

  function renderGoal(
    data
  ) {
    const goal =
      Number(
        data.goal || 0
      );

    const month =
      data.month || {};

    const count =
      Number(
        month.count || 0
      );

    const analysis =
      data.analysis || {};

    const remaining =
      Math.max(
        0,
        Number(
          analysis.remainingGoalCount ||
          0
        )
      );

    const rate =
      Number(
        analysis.goalRate || 0
      );

    const goalCount =
      document.getElementById(
        "goalCount"
      );

    const goalRate =
      document.getElementById(
        "goalRate"
      );

    const progress =
      document.getElementById(
        "goalProgress"
      );

    const message =
      document.getElementById(
        "goalMessage"
      );

    const input =
      document.getElementById(
        "goalInput"
      );

    if (goalCount) {
      goalCount.innerHTML = `
        ${formatNumber(count)}
        <span>
          / ${formatNumber(goal)}件
        </span>
      `;
    }

    if (goalRate) {
      goalRate.textContent =
        formatPercent(rate);
    }

    if (progress) {
      progress.style.width =
        `${Math.min(
          100,
          Math.max(
            0,
            rate
          )
        )}%`;
    }

    if (message) {
      if (goal <= 0) {
        message.textContent =
          "月間目標を設定してください";
      } else if (
        remaining <= 0
      ) {
        message.textContent =
          `🎉 目標達成！ ${formatNumber(
            count - goal
          )}件オーバー`;
      } else {
        message.textContent =
          `あと ${formatNumber(
            remaining
          )}件で目標達成`;
      }
    }

    if (
      input &&
      document.activeElement !== input
    ) {
      input.value =
        goal > 0
          ? goal
          : "";
    }
  }


  async function saveGoal() {
    const input =
      document.getElementById(
        "goalInput"
      );

    if (!input) {
      return;
    }

    const goal =
      Number(
        input.value || 0
      );

    if (
      !Number.isFinite(goal) ||
      goal < 0
    ) {
      alert(
        "0以上の目標件数を入力してください"
      );

      return;
    }

    try {
      await apiFetch(
        "/api/goal",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            monthly_goal:
              Math.floor(goal)
          })
        }
      );

      await loadPersonal(
        activePeriod
      );

      alert(
        "月間目標を保存しました"
      );

    } catch (error) {
      console.error(
        "goal save error:",
        error
      );

      alert(
        error.message ||
        "目標の保存に失敗しました"
      );
    }
  }

  // =========================================================
  // 日別推移
  // =========================================================

  function renderDailyAnalytics(
    daily
  ) {
    const element =
      document.getElementById(
        "dailyAnalytics"
      );

    if (!element) {
      return;
    }

    if (
      !Array.isArray(daily) ||
      daily.length === 0
    ) {
      element.innerHTML = `
        <div class="empty">
          今月の実績はまだありません
        </div>
      `;

      return;
    }

    const sorted =
      [...daily].reverse();

    element.innerHTML =
      sorted
        .map(
          (row) => {
            const count =
              Number(
                row.count || 0
              );

            const sales =
              Number(
                row.sales || 0
              );

            const hours =
              Number(
                row.hours || 0
              );

            const countPerHour =
              hours > 0
                ? count / hours
                : 0;

            return `
              <div class="record-item">

                <div>
                  <div class="record-date">
                    ${escapeHtml(
                      formatDateJST(
                        row.date
                      )
                    )}
                  </div>

                  <div class="record-main">
                    📦 ${formatNumber(
                      count
                    )}件
                  </div>
                </div>

                <div class="record-side">

                  <div class="record-sales">
                    ${formatYen(
                      sales
                    )}
                  </div>

                  <div class="record-hours">
                    ${formatHours(
                      hours
                    )}h
                    /
                    ${countPerHour.toFixed(
                      1
                    )}件/h
                  </div>

                </div>

              </div>
            `;
          }
        )
        .join("");
  }
      // =========================================================
  // Admin
  // =========================================================

  async function checkAdminAccess() {
    try {
      const data =
        await apiFetch(
          "/api/admin"
        );

      if (
        data?.isAdmin ||
        data?.admin === true
      ) {
        const tab =
          document.getElementById(
            "adminTab"
          );

        if (tab) {
          tab.classList.add(
            "visible"
          );
          tab.style.display =
            "block";
        }
      }
    } catch (error) {
      // 管理者でない場合は何もしない
      console.log(
        "admin access:",
        error.message
      );
    }
  }


  async function loadAdmin() {
    const element =
      document.getElementById(
        "adminContent"
      );

    if (!element) {
      return;
    }

    element.innerHTML = `
      <div class="loading">
        管理データを読み込み中...
      </div>
    `;

    try {
      const data =
        await apiFetch(
          "/api/admin"
        );

      renderAdmin(
        data
      );

    } catch (error) {
      console.error(
        "admin load error:",
        error
      );

      showError(
        "adminContent",
        error.message
      );
    }
  }

  // =========================================================
  // Reset
  // =========================================================

  async function resetData() {
    const confirmed =
      window.confirm(
        "自分の配達実績をすべて削除します。\n\n月間目標は残ります。\n\n本当にリセットしますか？"
      );

    if (!confirmed) {
      return;
    }

    try {
      await apiFetch(
        "/api/reset",
        {
          method: "POST"
        }
      );

      alert(
        "実績をリセットしました"
      );

      await loadPersonal(
        activePeriod
      );

      if (
        activeSection ===
        "analytics"
      ) {
        await loadAnalytics();
      }

    } catch (error) {
      console.error(
        "reset error:",
        error
      );

      alert(
        error.message ||
        "リセットに失敗しました"
      );
    }
  }


  // =========================================================
  // Event: Main Tabs
  // =========================================================

  document
    .querySelectorAll(
      ".main-tab"
    )
    .forEach((button) => {
      button.addEventListener(
        "click",
        () => {
          const section =
            button.dataset.section;

          if (!section) {
            return;
          }

          showSection(
            section
          );
        }
      );
    });


  // =========================================================
  // Event: Period Tabs
  // =========================================================

  document
    .querySelectorAll(
      ".period-tab"
    )
    .forEach((button) => {
      button.addEventListener(
        "click",
        async () => {
          const period =
            button.dataset.period;

          if (!period) {
            return;
          }

          activePeriod =
            period;

          updatePeriodTabs();

          await loadPersonal(
            period
          );
        }
      );
    });


  // =========================================================
  // Event: Goal
  // =========================================================

  const goalSaveBtn =
    document.getElementById(
      "goalSaveBtn"
    );

  if (goalSaveBtn) {
    goalSaveBtn.addEventListener(
      "click",
      saveGoal
    );
  }


  const goalInput =
    document.getElementById(
      "goalInput"
    );

  if (goalInput) {
    goalInput.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key ===
          "Enter"
        ) {
          saveGoal();
        }
      }
    );
  }


  // =========================================================
  // Event: Reset
  // =========================================================

  const resetBtn =
    document.getElementById(
      "resetBtn"
    );

  if (resetBtn) {
    resetBtn.addEventListener(
      "click",
      resetData
    );
  }


  // =========================================================
  // Event: Refresh
  // =========================================================

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );

  if (refreshBtn) {
    refreshBtn.addEventListener(
      "click",
      async () => {
        refreshBtn.disabled =
          true;

        refreshBtn.style.opacity =
          "0.5";

        try {
          if (
            activeSection ===
            "personal"
          ) {
            await loadPersonal(
              activePeriod
            );
          }

          if (
            activeSection ===
            "analytics"
          ) {
            await loadAnalytics();
          }

          if (
            activeSection ===
            "admin"
          ) {
            await loadAdmin();
          }

        } finally {
          refreshBtn.disabled =
            false;

          refreshBtn.style.opacity =
            "1";
        }
      }
    );
  }


  // =========================================================
  // Telegram Main Button
  // =========================================================

  if (tg) {
    try {
      tg.MainButton.hide();
    } catch {
      // ignore
    }
  }


  // =========================================================
  // Init
  // =========================================================

  async function init() {
    renderUserName();

    updatePeriodTabs();

    await checkAdminAccess();

    await loadPersonal(
      "today"
    );
  }


  init();
</script>
