<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>個人テレグラムリザルト</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg:#f3f4f6;
      --card:#fff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --accent:#111827;
      --danger:#dc2626;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    }

    button,
    select,
    input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      max-width:760px;
      margin:0 auto;
      padding:16px 14px 40px;
    }

    .header{
      margin-bottom:14px;
    }

    .eyebrow{
      font-size:12px;
      color:var(--muted);
    }

    h1{
      font-size:22px;
      margin:4px 0;
    }

    .user{
      font-size:13px;
      color:var(--muted);
    }

    .tabs,
    .periods{
      display:flex;
      gap:8px;
      overflow-x:auto;
      margin:12px 0;
    }

    .tab,
    .period-btn{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:10px;
      padding:9px 13px;
      white-space:nowrap;
    }

    .tab.active,
    .period-btn.active{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }

    .selector-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:10px 0 14px;
    }

    select{
      width:100%;
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px;
    }

    .section{
      margin-top:14px;
    }

    .section-title{
      font-size:15px;
      font-weight:700;
      margin:18px 0 8px;
    }

    .hero,
    .stats,
    .grid{
      display:grid;
      gap:10px;
    }

    .hero{
      grid-template-columns:repeat(2,1fr);
    }

    .stats{
      grid-template-columns:repeat(2,1fr);
    }

    .grid{
      grid-template-columns:repeat(2,1fr);
    }

    .card,
    .stat-box,
    .hero-card,
    .record,
    .report-box,
    .analytics-box{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
    }

    .hero-card{
      padding:16px;
    }

    .hero-label,
    .stat-label,
    .highlight-label,
    .report-label,
    .analytics-label{
      font-size:12px;
      color:var(--muted);
    }

    .hero-value{
      font-size:24px;
      font-weight:800;
      margin-top:5px;
    }

    .stat-box,
    .report-box,
    .analytics-box{
      padding:13px;
    }

    .stat-value,
    .highlight-value,
    .report-value,
    .analytics-value{
      font-size:18px;
      font-weight:750;
      margin-top:4px;
    }

    .record{
      padding:12px;
      margin-bottom:8px;
    }

    .record-main{
      display:flex;
      justify-content:space-between;
      gap:12px;
    }

    .record-date{
      font-size:13px;
      font-weight:650;
    }

    .record-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:5px;
    }

    .record-sales{
      font-size:17px;
      font-weight:800;
      white-space:nowrap;
    }

    .record-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .record-action{
      flex:1;
      border:1px solid var(--line);
      background:#fff;
      border-radius:9px;
      padding:8px;
    }

    .record-delete-btn{
      color:var(--danger);
    }

    .chart-wrap{
      overflow-x:auto;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
    }

    .daily-chart{
      width:100%;
      min-width:360px;
      height:230px;
      display:block;
    }

    .error{
      background:#fef2f2;
      color:#991b1b;
      border:1px solid #fecaca;
      border-radius:12px;
      padding:12px;
      margin:10px 0;
      white-space:pre-wrap;
    }

    .empty,
    .loading{
      padding:20px;
      text-align:center;
      color:var(--muted);
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
    }

    .hidden{
      display:none!important;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:20;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(520px,100%);
      background:#fff;
      border-radius:16px;
      padding:18px;
    }

    .modal-card h2{
      margin:0 0 14px;
      font-size:18px;
    }

    .field{
      margin:10px 0;
    }

    .field label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .field input{
      width:100%;
      padding:11px;
      border:1px solid var(--line);
      border-radius:10px;
    }

    .modal-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .modal-actions button{
      flex:1;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#fff;
    }

    .modal-actions .primary{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }

    .danger-zone{
      margin-top:24px;
      padding:14px;
      border:1px solid #fecaca;
      border-radius:14px;
      background:#fff;
    }

    .danger-zone button{
      width:100%;
      padding:10px;
      border:1px solid #fecaca;
      border-radius:10px;
      background:#fff;
      color:var(--danger);
    }

    @media(min-width:600px){
      .hero{
        grid-template-columns:repeat(4,1fr);
      }

      .stats{
        grid-template-columns:repeat(3,1fr);
      }

      .grid{
        grid-template-columns:repeat(3,1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="eyebrow">個人テレグラムリザルト</div>
    <h1>個人ダッシュボード</h1>
    <div id="userName" class="user">読み込み中...</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="personal">
      個人実績
    </button>

    <button class="tab" data-tab="analytics">
      分析
    </button>
  </nav>

  <main id="personalSection">

    <div class="periods">
      <button class="period-btn active" data-period="today">
        今日
      </button>

      <button class="period-btn" data-period="week">
        今週
      </button>

      <button class="period-btn" data-period="month">
        今月
      </button>

      <button class="period-btn" data-period="year">
        年間
      </button>
    </div>

    <div class="selector-row">

      <select id="monthSelector">
        <option value="">月を選択</option>
      </select>

      <select id="yearSelector">
        <option value="">年を選択</option>
      </select>

    </div>

    <div id="personalError" class="error hidden"></div>

    <div id="personalHero" class="hero"></div>

    <div class="section">

      <div id="periodLabel" class="section-title">
        今日
      </div>

      <div id="personalStats" class="stats"></div>

    </div>

    <div class="section">

      <div class="section-title">
        実績
      </div>

      <div id="highlightGrid" class="grid"></div>

    </div>

    <div class="section">

      <div class="section-title">
        自己ベスト
      </div>

      <div id="bestGrid" class="grid"></div>

    </div>

    <div class="section">

      <div class="section-title">
        継続日数
      </div>

      <div id="streakGrid" class="grid"></div>

    </div>

    <div class="section">

      <div id="recordPeriodLabel" class="section-title">
        今日の実績履歴
      </div>

      <div id="records"></div>

    </div>

    <div class="danger-zone">

      <button id="resetBtn">
        実績をすべて削除
      </button>

    </div>

  </main>

  <main id="analyticsSection" class="hidden">

    <div class="section-title">
      分析
    </div>

    <div id="analyticsDateLabel" class="user"></div>

    <div class="section-title">
      基本分析
    </div>

    <div id="todayAnalytics" class="grid"></div>

    <div class="section-title">
      ペース
    </div>

    <div id="paceAnalytics" class="grid"></div>

    <div class="section-title">
      自己ベスト
    </div>

    <div id="bestAnalytics" class="grid"></div>

    <div class="section-title">
      比較
    </div>

    <div id="comparisonAnalytics" class="grid"></div>

    <div class="section-title">
      月次レポート
    </div>

    <div id="monthlyReport" class="grid"></div>

    <div
      id="monthlyReportBest"
      class="user"
      style="margin-top:8px"
    ></div>

    <div class="section-title">
      日別売上
    </div>

    <div class="chart-wrap">
      <div id="dailyChart"></div>
    </div>

    <div class="section-title">
      日別実績
    </div>

    <div id="dailyList"></div>

  </main>

</div>

<div id="editModal" class="modal">

  <div class="modal-card">

    <h2>
      実績を編集
    </h2>

    <div id="editModalError" class="error hidden"></div>

    <div class="field">

      <label>
        売上
      </label>

      <input
        id="editSaleAmount"
        type="number"
        min="0"
        step="1"
      >

    </div>

    <div class="field">

      <label>
        配達数
      </label>

      <input
        id="editDeliveryCount"
        type="number"
        min="0"
        step="1"
      >

    </div>

    <div class="field">

      <label>
        稼働時間
      </label>

      <input
        id="editWorkHours"
        type="number"
        min="0.01"
        step="0.01"
      >

    </div>

    <div class="modal-actions">

      <button id="editCancelBtn">
        キャンセル
      </button>

      <button id="editSaveBtn" class="primary">
        保存
      </button>

    </div>

  </div>

</div>

<script>
(() => {
  "use strict";

  const tg =
    window.Telegram?.WebApp || null;

  let currentPeriod = "today";

  let currentData = null;

  let editingRecordId = null;

  const $ = id =>
    document.getElementById(id);

  const userNameEl =
    $("userName");

  const personalSection =
    $("personalSection");

  const analyticsSection =
    $("analyticsSection");

  const personalError =
    $("personalError");

  const personalHero =
    $("personalHero");

  const personalStats =
    $("personalStats");

  const highlightGrid =
    $("highlightGrid");

  const bestGrid =
    $("bestGrid");

  const streakGrid =
    $("streakGrid");

  const recordsEl =
    $("records");

  const periodLabel =
    $("periodLabel");

  const recordPeriodLabel =
    $("recordPeriodLabel");

  const monthSelector =
    $("monthSelector");

  const yearSelector =
    $("yearSelector");

  const todayAnalytics =
    $("todayAnalytics");

  const paceAnalytics =
    $("paceAnalytics");

  const bestAnalytics =
    $("bestAnalytics");

  const comparisonAnalytics =
    $("comparisonAnalytics");

  const analyticsDateLabel =
    $("analyticsDateLabel");

  const monthlyReport =
    $("monthlyReport");

  const monthlyReportBest =
    $("monthlyReportBest");

  const dailyChart =
    $("dailyChart");

  const dailyList =
    $("dailyList");

  const editModal =
    $("editModal");

  const editSaleAmount =
    $("editSaleAmount");

  const editDeliveryCount =
    $("editDeliveryCount");

  const editWorkHours =
    $("editWorkHours");

  const editModalError =
    $("editModalError");

  const editCancelBtn =
    $("editCancelBtn");

  const editSaveBtn =
    $("editSaveBtn");

  const resetBtn =
    $("resetBtn");

  function formatNumber(value) {
    return Number(value || 0)
      .toLocaleString("ja-JP");
  }

  function formatYen(value) {
    return `¥${formatNumber(value)}`;
  }

  function formatHours(value) {
    return Number(value || 0)
      .toFixed(2);
  }

  function formatHourly(value) {
    return `${formatYen(
      Math.round(Number(value || 0))
    )}/h`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDateJST(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return String(value);
    }

    return date.toLocaleString(
      "ja-JP",
      {
        timeZone:"Asia/Tokyo",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }

  function getInitData() {
    return tg?.initData || "";
  }

  function getTelegramUser() {
    return tg?.initDataUnsafe?.user || null;
  }

  function getDisplayName() {

    const user =
      getTelegramUser();

    if (!user) {
      return "Telegram Mini App";
    }

    if (user.first_name) {
      return `${user.first_name}さん`;
    }

    if (user.username) {
      return `@${user.username}`;
    }

    return "Telegram Mini App";
  }

  function showError(message) {

    personalError.textContent =
      message;

    personalError.classList
      .remove("hidden");
  }

  function hideError() {

    personalError.textContent =
      "";

    personalError.classList
      .add("hidden");
  }

  function showLoading() {

    personalHero.innerHTML =
      '<div class="loading" style="grid-column:1/-1">読み込み中...</div>';

    personalStats.innerHTML =
      "";

    highlightGrid.innerHTML =
      "";

    bestGrid.innerHTML =
      "";

    streakGrid.innerHTML =
      "";

    recordsEl.innerHTML =
      "";
  }

  async function apiFetch(
    url,
    options = {}
  ) {

    const controller =
      new AbortController();

    const timer =
      setTimeout(
        () => controller.abort(),
        10000
      );

    try {

      const headers = {
        ...(options.headers || {})
      };

      const initData =
        getInitData();

      if (initData) {

        headers[
          "X-Telegram-Init-Data"
        ] = initData;

      }

      const response =
        await fetch(
          url,
          {
            ...options,
            headers,
            signal:
              controller.signal
          }
        );

      let data = null;

      try {
        data =
          await response.json();
      } catch (_) {}

      if (!response.ok) {

        const detail =
          data?.error ||
          `HTTP ${response.status}`;

        throw new Error(detail);
      }

      if (data?.ok === false) {

        throw new Error(
          data.error ||
          "APIエラー"
        );
      }

      return data;

    } catch (error) {

      if (
        error.name ===
        "AbortError"
      ) {

        throw new Error(
          "通信がタイムアウトしました。Vercelのログを確認してください。"
        );

      }

      throw error;

    } finally {

      clearTimeout(timer);

    }
  }

  function buildResultUrl(
    period = currentPeriod
  ) {

    const params =
      new URLSearchParams();

    params.set(
      "period",
      period
    );

    if (
      period === "month" &&
      monthSelector.value
    ) {

      params.set(
        "month",
        monthSelector.value
      );

    }

    if (
      period === "year" &&
      yearSelector.value
    ) {

      params.set(
        "year",
        yearSelector.value
      );

    }

    return `/api/result?${params.toString()}`;
  }

  async function loadResult() {

    hideError();

    showLoading();

    try {

      if (!tg) {

        throw new Error(
          "Telegram Mini Appから開いてください。"
        );

      }

      if (!getInitData()) {

        throw new Error(
          "Telegram認証情報が取得できません。Telegram内からMini Appを開き直してください。"
        );

      }

      const data =
        await apiFetch(
          buildResultUrl()
        );

      currentData =
        data;

      renderPersonal(
        data
      );

    } catch (error) {

      console.error(
        "[APP] loadResult error:",
        error
      );

      showError(
        `読み込みに失敗しました。\n${error.message}`
      );

    }
  }

  function renderPersonal(
    data
  ) {

    const stats =
      data?.stats || {};

    const label =
      data?.label ||
      currentPeriod;

    periodLabel.textContent =
      label;

    recordPeriodLabel.textContent =
      `${label}の実績履歴`;

    renderHero(stats);

    renderStats(stats);

    renderHighlights(stats);

    renderBest(data);

    renderStreak(data);

    renderRecords(
      data?.recentResults || []
    );

    renderAnalytics(data);
  }

  function renderHero(stats) {

    personalHero.innerHTML = `

      <div class="hero-card">

        <div class="hero-label">
          売上
        </div>

        <div class="hero-value">
          ${formatYen(stats.sales)}
        </div>

      </div>

      <div class="hero-card">

        <div class="hero-label">
          配達
        </div>

        <div class="hero-value">
          ${formatNumber(
            stats.deliveryCount
          )}件
        </div>

      </div>

      <div class="hero-card">

        <div class="hero-label">
          稼働時間
        </div>

        <div class="hero-value">
          ${formatHours(
            stats.workHours
          )}h
        </div>

      </div>

      <div class="hero-card">

        <div class="hero-label">
          時給換算
        </div>

        <div class="hero-value">
          ${formatHourly(
            stats.hourlySales
          )}
        </div>

      </div>

    `;
  }

  function renderStats(stats) {

    personalStats.innerHTML = `

      <div class="stat-box">

        <div class="stat-label">
          売上
        </div>

        <div class="stat-value">
          ${formatYen(stats.sales)}
        </div>

      </div>

      <div class="stat-box">

        <div class="stat-label">
          配達数
        </div>

        <div class="stat-value">
          ${formatNumber(
            stats.deliveryCount
          )}件
        </div>

      </div>

      <div class="stat-box">

        <div class="stat-label">
          稼働時間
        </div>

        <div class="stat-value">
          ${formatHours(
            stats.workHours
          )}h
        </div>

      </div>

      <div class="stat-box">

        <div class="stat-label">
          平均単価
        </div>

        <div class="stat-value">
          ${formatYen(
            Math.round(
              stats.unitPrice || 0
            )
          )}
        </div>

      </div>

      <div class="stat-box">

        <div class="stat-label">
          時給換算
        </div>

        <div class="stat-value">
          ${formatHourly(
            stats.hourlySales
          )}
        </div>

      </div>

      <div class="stat-box">

        <div class="stat-label">
          記録件数
        </div>

        <div class="stat-value">
          ${formatNumber(
            stats.records
          )}件
        </div>

      </div>

    `;
  }

  function renderHighlights(stats) {

    highlightGrid.innerHTML = `

      <div class="stat-box">

        <div class="highlight-label">
          売上
        </div>

        <div class="highlight-value">
          ${formatYen(
            stats.sales
          )}
        </div>

      </div>

      <div class="stat-box">

        <div class="highlight-label">
          配達数
        </div>

        <div class="highlight-value">
          ${formatNumber(
            stats.deliveryCount
          )}件
        </div>

      </div>

      <div class="stat-box">

        <div class="highlight-label">
          稼働
        </div>

        <div class="highlight-value">
          ${formatHours(
            stats.workHours
          )}h
        </div>

      </div>

      <div class="stat-box">

        <div class="highlight-label">
          時給
        </div>

        <div class="highlight-value">
          ${formatHourly(
            stats.hourlySales
          )}
        </div>

      </div>

    `;
  }

  function getBestFromDaily(data) {

    const daily =
      Array.isArray(data?.daily)
        ? data.daily
        : [];

    if (!daily.length) {
      return null;
    }

    const bySales =
      [...daily].sort(
        (a,b) =>
          Number(b.sales || 0) -
          Number(a.sales || 0)
      )[0];

    const byDelivery =
      [...daily].sort(
        (a,b) =>
          Number(
            b.deliveryCount || 0
          ) -
          Number(
            a.deliveryCount || 0
          )
      )[0];

    const byHourly =
      [...daily].sort(
        (a,b) =>
          Number(
            b.hourlySales || 0
          ) -
          Number(
            a.hourlySales || 0
          )
      )[0];

    return {
      bySales,
      byDelivery,
      byHourly
    };
  }

  function renderBest(data) {

    const best =
      getBestFromDaily(data);

    bestGrid.innerHTML = `

      <div class="stat-box">

        <div class="highlight-label">
          期間内最高売上
        </div>

        <div class="highlight-value">
          ${formatYen(
            best?.bySales?.sales || 0
          )}
        </div>

      </div>

      <div class="stat-box">

        <div class="highlight-label">
          期間内最高配達
        </div>

        <div class="highlight-value">
          ${formatNumber(
            best?.byDelivery?.deliveryCount || 0
          )}件
        </div>

      </div>

  function calculateStreak(data) {

    const daily =
      Array.isArray(data?.daily)
        ? data.daily
        : [];

    const dates =
      new Set(
        daily
          .filter(
            x =>
              Number(
                x.records || 0
              ) > 0
          )
          .map(
            x =>
              String(x.date)
          )
      );

    if (!dates.size) {
      return {
        current:0,
        best:0
      };
    }

    const sorted =
      [...dates].sort();

    let best = 1;

    let run = 1;

    for (
      let i = 1;
      i < sorted.length;
      i++
    ) {

      const a =
        new Date(
          `${sorted[i-1]}T00:00:00Z`
        );

      const b =
        new Date(
          `${sorted[i]}T00:00:00Z`
        );

      const diff =
        Math.round(
          (b-a)/86400000
        );

      if (diff === 1) {
        run++;
      } else {
        run = 1;
      }

      best =
        Math.max(
          best,
          run
        );
    }

    let current = 1;

    for (
      let i = sorted.length - 1;
      i > 0;
      i--
    ) {

      const a =
        new Date(
          `${sorted[i-1]}T00:00:00Z`
        );

      const b =
        new Date(
          `${sorted[i]}T00:00:00Z`
        );

      if (
        Math.round(
          (b-a)/86400000
        ) === 1
      ) {

        current++;

      } else {

        break;

      }
    }

    return {
      current,
      best
    };
  }

  async function saveEdit() {

    if (!editingRecordId) {
      return;
    }

    const saleAmount =
      Number(
        editSaleAmount.value
      );

    const deliveryCount =
      Number(
        editDeliveryCount.value
      );

    const workHours =
      Number(
        editWorkHours.value
      );

    if (
      !Number.isFinite(
        saleAmount
      ) ||
      saleAmount < 0
    ) {

      editModalError.textContent =
        "売上を正しく入力してください。";

      editModalError
        .classList
        .remove("hidden");

      return;
    }

    if (
      !Number.isInteger(
        deliveryCount
      ) ||
      deliveryCount < 0
    ) {

      editModalError.textContent =
        "配達数を正しく入力してください。";

      editModalError
        .classList
        .remove("hidden");

      return;
    }

    if (
      !Number.isFinite(
        workHours
      ) ||
      workHours <= 0
    ) {

      editModalError.textContent =
        "稼働時間を正しく入力してください。";

      editModalError
        .classList
        .remove("hidden");

      return;
    }

    editSaveBtn.disabled =
      true;

    editSaveBtn.textContent =
      "保存中...";

    try {

      await apiFetch(
        "/api/result",
        {
          method:"PUT",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            id:
              editingRecordId,
            saleAmount,
            deliveryCount,
            workHours
          })
        }
      );

      closeEditModal();

      await loadResult();

    } catch (error) {

      console.error(
        "[APP] saveEdit error:",
        error
      );

      editModalError.textContent =
        `保存に失敗しました。\n${error.message}`;

      editModalError
        .classList
        .remove("hidden");

    } finally {

      editSaveBtn.disabled =
        false;

      editSaveBtn.textContent =
        "保存";

    }
  }

  function renderDailyChart(
    daily
  ) {

    if (!daily.length) {

      dailyChart.innerHTML = `
        <div class="empty">
          日別データがありません。
        </div>
      `;

      return;
    }

    const width = 720;

    const height = 220;

    const padding = 32;

    const chartWidth =
      width - padding * 2;

    const chartHeight =
      height - padding * 2;

    const maxSales =
      Math.max(
        ...daily.map(
          item =>
            Number(
              item.sales || 0
            )
        ),
        1
      );

    const step =
      daily.length > 1
        ? chartWidth /
          (daily.length - 1)
        : 0;

    const points =
      daily.map(
        (item,index) => {

          const sales =
            Number(
              item.sales || 0
            );

          const x =
            padding +
            step * index;

          const y =
            padding +
            chartHeight -
            (
              sales /
              maxSales
            ) *
            chartHeight;

          return {
            x,
            y,
            sales,
            date:
              item.date
          };
        }
      );

    const polyline =
      points
        .map(
          point =>
            `${point.x},${point.y}`
        )
        .join(" ");

    const circles =
      points
        .map(
          point => `
            <circle
              cx="${point.x}"
              cy="${point.y}"
              r="4"
              fill="currentColor"
            >
              <title>
                ${escapeHtml(
                  point.date
                )}：
                ${formatYen(
                  point.sales
                )}
              </title>
            </circle>
          `
        )
        .join("");

    dailyChart.innerHTML = `

      <svg
        class="daily-chart"
        viewBox="0 0 ${width} ${height}"
        preserveAspectRatio="none"
        aria-label="日別売上グラフ"
      >

        <line
          x1="${padding}"
          y1="${padding}"
          x2="${padding}"
          y2="${height-padding}"
          stroke="currentColor"
          opacity=".15"
        />

        <line
          x1="${padding}"
          y1="${height-padding}"
          x2="${width-padding}"
          y2="${height-padding}"
          stroke="currentColor"
          opacity=".15"
        />

        <polyline
          points="${polyline}"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        ${circles}

      </svg>

    `;
  }

              .add("hidden");

            personalSection
              .classList
              .remove("hidden");

          }

        }
      );

    });

  resetBtn.addEventListener(
    "click",
    async () => {

      const confirmed =
        window.confirm(
          "登録した実績をすべて削除します。\n\n本当に削除しますか？"
        );

      if (!confirmed) {
        return;
      }

      const secondConfirmed =
        window.confirm(
          "この操作は元に戻せません。\n\nすべて削除してよろしいですか？"
        );

      if (!secondConfirmed) {
        return;
      }

      resetBtn.disabled =
        true;

      resetBtn.textContent =
        "削除中...";

      try {

        await apiFetch(
          "/api/reset",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({})
          }
        );

        alert(
          "実績を削除しました。"
        );

        await loadResult();

      } catch (error) {

        console.error(
          "[APP] reset error:",
          error
        );

        alert(
          `削除に失敗しました。\n${error.message}`
        );

      } finally {

        resetBtn.disabled =
          false;

        resetBtn.textContent =
          "実績をすべて削除";

      }

    }
  );

  function applyTelegramTheme() {

    if (!tg) {
      return;
    }

    try {

      tg.ready();

      tg.expand();

      const theme =
        tg.themeParams || {};

      if (
        theme.bg_color
      ) {

        document.documentElement
          .style
          .setProperty(
            "--bg",
            theme.bg_color
          );

      }

      if (
        theme.text_color
      ) {

        document.documentElement
          .style
          .setProperty(
            "--text",
            theme.text_color
          );

      }

    } catch (error) {

      console.warn(
        "[APP] Telegram theme error:",
        error
      );

    }
  }

  function renderUserName() {

    userNameEl.textContent =
      getDisplayName();

  }

  async function initialize() {

    applyTelegramTheme();

    renderUserName();

    populateMonthSelector();

    populateYearSelector();

    currentPeriod =
      "today";

    document
      .querySelectorAll(
        ".period-btn"
      )
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.period ===
            "today"
        );

      });

    await loadResult();

  }

  initialize()
    .catch(error => {

      console.error(
        "[APP] initialize error:",
        error
      );

      showError(
        `初期化に失敗しました。\n${error.message}`
      );

    });

})();
</script>

</body>
</html>
