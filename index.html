<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>個人テレグラムリザルト</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #7b8495;
      --border: #e5e9f0;
      --primary: #229ed9;
      --primary-dark: #1686bd;
      --success: #18a66a;
      --danger: #e05252;
      --shadow: 0 4px 18px rgba(23, 32, 51, .07);
      --radius: 16px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
    }

    .user-name {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .refresh-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 18px;
    }

    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 14px 16px 0;
      padding: 4px;
      background: #e9edf3;
      border-radius: 14px;
    }

    .main-tab {
      border: 0;
      border-radius: 11px;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .main-tab.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .section {
      display: none;
      padding: 16px;
    }

    .section.active {
      display: block;
    }

    .period-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 14px;
    }

    .period-tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .add-result-card {
      margin-bottom: 16px;
      padding: 18px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #596273;
    }

    .result-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .result-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34,158,217,.12);
    }

    .details-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 3px 0 10px;
      padding: 11px 0;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--primary-dark);
      font-weight: 700;
      text-align: left;
    }

    .optional-details {
      display: none;
    }

    .optional-details.open {
      display: block;
    }

    .add-result-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .add-result-submit:disabled {
      opacity: .6;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 850;
    }

    .summary-value.small {
      font-size: 16px;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .analysis-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    .analysis-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .analysis-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: 850;
    }

    .best-list,
    .record-list,
    .daily-list {
      display: grid;
      gap: 9px;
    }

    .best-item,
    .record-item,
    .daily-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .record-main {
      min-width: 0;
    }

    .record-date {
      color: var(--muted);
      font-size: 11px;
    }

    .record-title {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 800;
    }

    .record-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .record-amount {
      white-space: nowrap;
      font-size: 16px;
      font-weight: 850;
    }

    .streak-box {
      padding: 16px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid var(--border);
      text-align: center;
    }

    .streak-number {
      font-size: 34px;
      font-weight: 900;
    }

    .streak-label {
      color: var(--muted);
      font-size: 12px;
    }

    .chart {
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 12px 4px 4px;
      overflow-x: auto;
    }

    .chart-bar-wrap {
      min-width: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .chart-bar-area {
      height: 90px;
      width: 24px;
      display: flex;
      align-items: flex-end;
    }

    .chart-bar {
      width: 100%;
      min-height: 2px;
      border-radius: 5px 5px 2px 2px;
      background: var(--primary);
    }

    .chart-label {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
    }

    .empty {
      padding: 24px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 18px;
      z-index: 100;
      display: none;
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(23,32,51,.94);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      background: rgba(180,45,45,.95);
    }

    @media (min-width: 700px) {
      .section {
        max-width: 760px;
        margin: 0 auto;
      }

      .header {
        padding-left: calc((100% - 760px) / 2 + 16px);
        padding-right: calc((100% - 760px) / 2 + 16px);
      }

      .main-tabs {
        max-width: 728px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div>
        <div class="header-title">
          📦 個人テレグラムリザルト
        </div>

        <div id="userName" class="user-name">
          読み込み中…
        </div>
      </div>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
        aria-label="更新"
      >
        ↻
      </button>
    </header>

    <nav class="main-tabs">
      <button
        class="main-tab active"
        type="button"
        data-section="personal"
      >
        個人実績
      </button>

      <button
        class="main-tab"
        type="button"
        data-section="analytics"
      >
        分析
      </button>
    </nav>

    <section
      id="personalSection"
      class="section active"
    >

      <div class="period-tabs">
        <button
          class="period-tab active"
          type="button"
          data-period="today"
        >
          今日
        </button>

        <button
          class="period-tab"
          type="button"
          data-period="week"
        >
          今週
        </button>

        <button
          class="period-tab"
          type="button"
          data-period="month"
        >
          今月
        </button>

        <button
          class="period-tab"
          type="button"
          data-period="all"
        >
          全期間
        </button>
      </div>

      <div class="add-result-card">
        <h2 class="card-title">実績を追加</h2>

        <form id="addResultForm">

          <div class="form-row">

            <div class="field">
              <label for="saleAmountInput">
                売上（円）
              </label>

              <input
                id="saleAmountInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="5000"
                required
              >
            </div>

            <div class="field">
              <label for="deliveryCountInput">
                配達件数
              </label>

              <input
                id="deliveryCountInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="1"
                step="1"
                placeholder="5"
                required
              >
            </div>

          </div>

          <button
            id="detailsToggle"
            class="details-toggle"
            type="button"
            aria-expanded="false"
          >
            <span>詳細設定（任意）</span>
            <span id="detailsToggleIcon">＋</span>
          </button>

          <div
            id="optionalDetails"
            class="optional-details"
          >

            <div class="field">
              <label for="workStartTimeInput">
                稼働開始時刻
              </label>

              <input
                id="workStartTimeInput"
                class="result-input"
                type="time"
              >
            </div>

            <div class="field">
              <label for="workHoursInput">
                稼働時間（時間）
              </label>

              <input
                id="workHoursInput"
                class="result-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="5.5"
              >
            </div>

            <div class="field">
              <label for="distanceInput">
                走行距離（km）
              </label>

              <input
                id="distanceInput"
                class="result-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="30"
              >
            </div>

            <div class="field">
              <label for="expenseInput">
                経費（円）
              </label>

              <input
                id="expenseInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="500"
              >
            </div>

          </div>

          <button
            class="add-result-submit"
            type="submit"
          >
            実績を保存
          </button>

        </form>
      </div>

      <div class="summary-grid">

        <div class="summary-item">
          <div class="summary-label">売上</div>
          <div
            id="summarySales"
            class="summary-value"
          >
            ¥0
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">配達件数</div>
          <div
            id="summaryDeliveries"
            class="summary-value"
          >
            0件
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">稼働時間</div>
          <div
            id="summaryHours"
            class="summary-value small"
          >
            0時間
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">時給</div>
          <div
            id="summaryHourly"
            class="summary-value small"
          >
            ¥0
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">平均単価</div>
          <div
            id="summaryUnitPrice"
            class="summary-value small"
          >
            ¥0
          </div>
        </div>

      </div>

      <div class="card">
        <h2 class="card-title">効率分析</h2>

        <div class="analysis-grid">

          <div class="analysis-card">
            <div class="analysis-label">
              1件あたり売上
            </div>

            <div
              id="analysisPerDelivery"
              class="analysis-value"
            >
              ¥0
            </div>
          </div>

          <div class="analysis-card">
            <div class="analysis-label">
              1時間あたり件数
            </div>

            <div
              id="analysisDeliveriesPerHour"
              class="analysis-value"
            >
              0件
            </div>
          </div>

          <div class="analysis-card">
            <div class="analysis-label">
              1kmあたり売上
            </div>

            <div
              id="analysisSalesPerKm"
              class="analysis-value"
            >
              —
            </div>
          </div>

          <div class="analysis-card">
            <div class="analysis-label">
              経費
            </div>

            <div
              id="analysisExpense"
              class="analysis-value"
            >
              ¥0
            </div>
          </div>

        </div>
      </div>

      <div class="card">
        <h2 class="card-title">継続状況</h2>

        <div class="streak-box">
          <div
            id="streakNumber"
            class="streak-number"
          >
            0
          </div>

          <div class="streak-label">
            連続稼働日
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">実績履歴</h2>

        <div
          id="recordList"
          class="record-list"
        >
          <div class="empty">
            読み込み中…
          </div>
        </div>
      </div>

    </section>

    <section
      id="analyticsSection"
      class="section"
    >

      <div class="period-tabs">

        <button
          class="period-tab active"
          type="button"
          data-analytics-period="week"
        >
          週間
        </button>

        <button
          class="period-tab"
          type="button"
          data-analytics-period="month"
        >
          月間
        </button>

        <button
          class="period-tab"
          type="button"
          data-analytics-period="all"
        >
          全期間
        </button>

      </div>

      <div class="card">
        <h2 class="card-title">売上推移</h2>

        <div
          id="salesChart"
          class="chart"
        >
          <div class="empty">
            データがありません
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">日別実績</h2>

        <div
          id="dailyList"
          class="daily-list"
        >
          <div class="empty">
            データがありません
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">曜日別</h2>

        <div
          id="weekdayList"
          class="best-list"
        >
          <div class="empty">
            データがありません
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">時間帯別</h2>

        <div
          id="hourList"
          class="best-list"
        >
          <div class="empty">
            データがありません
          </div>
        </div>
      </div>

    </section>

  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>
    <script>
    const tg = window.Telegram?.WebApp || null;

    let currentPeriod = 'today';
    let currentAnalyticsPeriod = 'week';
    let currentData = null;

    function formatYen(value) {
      const number = Number(value || 0);
      return `¥${Math.round(number).toLocaleString('ja-JP')}`;
    }

    function formatHours(value) {
      const number = Number(value || 0);

      if (!Number.isFinite(number) || number <= 0) {
        return '0時間';
      }

      return `${number.toFixed(1)}時間`;
    }

    function formatNumber(value, digits = 1) {
      const number = Number(value || 0);

      if (!Number.isFinite(number)) {
        return '0';
      }

      return number.toLocaleString('ja-JP', {
        maximumFractionDigits: digits
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'normal') {
      const toast = document.getElementById('toast');

      if (!toast) {
        return;
      }

      toast.textContent = message;
      toast.className = `toast show ${type === 'error' ? 'error' : ''}`;

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.className = 'toast';
      }, 3000);
    }

    function getTelegramUser() {
      return tg?.initDataUnsafe?.user || null;
    }

    function updateUserName() {
      const element = document.getElementById('userName');

      if (!element) {
        return;
      }

      const user = getTelegramUser();

      if (!user) {
        element.textContent =
          'Telegram Mini Appとして起動してください';
        return;
      }

      const name =
        user.first_name ||
        user.username ||
        'ユーザー';

      element.textContent = `${name}さん`;
    }

    function apiFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});

      headers.set('Accept', 'application/json');

      if (tg?.initData) {
        headers.set(
          'X-Telegram-Init-Data',
          tg.initData
        );
      }

      return fetch(url, {
        ...options,
        headers
      });
    }

    async function readApiResponse(response) {
      const text = await response.text();

      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = null;
      }

      if (!response.ok) {
        const message =
          data?.error ||
          data?.message ||
          `通信エラー (${response.status})`;

        throw new Error(message);
      }

      if (data?.ok === false) {
        throw new Error(
          data.error ||
          data.message ||
          '処理に失敗しました'
        );
      }

      return data;
    }

    function getRecordsFromData(data) {
      if (!data) {
        return [];
      }

      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data.records)) {
        return data.records;
      }

      if (Array.isArray(data.results)) {
        return data.results;
      }

      if (Array.isArray(data.data)) {
        return data.data;
      }

      return [];
    }

    function getRecordValue(record, ...keys) {
      for (const key of keys) {
        if (
          record &&
          record[key] !== undefined &&
          record[key] !== null
        ) {
          return record[key];
        }
      }

      return null;
    }

    function getSaleAmount(record) {
      return Number(
        getRecordValue(
          record,
          'saleAmount',
          'sale_amount',
          'sales',
          'sale'
        ) || 0
      );
    }

    function getDeliveryCount(record) {
      return Number(
        getRecordValue(
          record,
          'deliveryCount',
          'delivery_count',
          'deliveries'
        ) || 0
      );
    }

    function getWorkHours(record) {
      const value = getRecordValue(
        record,
        'workHours',
        'work_hours',
        'hours'
      );

      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return 0;
      }

      return Number(value) || 0;
    }

    function getDistance(record) {
      return Number(
        getRecordValue(
          record,
          'distanceKm',
          'distance_km',
          'distance'
        ) || 0
      );
    }

    function getExpense(record) {
      return Number(
        getRecordValue(
          record,
          'expenseAmount',
          'expense_amount',
          'expense'
        ) || 0
      );
    }

    function getCreatedAt(record) {
      return getRecordValue(
        record,
        'created_at',
        'createdAt'
      );
    }

    function getWorkStartedAt(record) {
      return getRecordValue(
        record,
        'work_started_at',
        'workStartedAt'
      );
    }

    function getDateValue(record) {
      return (
        getWorkStartedAt(record) ||
        getCreatedAt(record)
      );
    }

    function formatDate(value) {
      if (!value) {
        return '日付不明';
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return '日付不明';
      }

      return date.toLocaleDateString('ja-JP', {
        month: 'numeric',
        day: 'numeric'
      });
    }

    function formatDateTime(value) {
      if (!value) {
        return '日時不明';
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return '日時不明';
      }

      return date.toLocaleString('ja-JP', {
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getSummaryFromRecords(records) {
      let sales = 0;
      let deliveries = 0;
      let hours = 0;
      let distance = 0;
      let expense = 0;

      for (const record of records) {
        sales += getSaleAmount(record);
        deliveries += getDeliveryCount(record);
        hours += getWorkHours(record);
        distance += getDistance(record);
        expense += getExpense(record);
      }

      return {
        sales,
        deliveries,
        hours,
        distance,
        expense
      };
    }

    function getSummaryValues(data) {
      const records = getRecordsFromData(data);
      const summary = data?.summary || {};

      const fallback =
        getSummaryFromRecords(records);

      const sales = Number(
        summary.saleAmount ??
        summary.sales ??
        summary.sale_amount ??
        fallback.sales ??
        0
      );

      const deliveries = Number(
        summary.deliveryCount ??
        summary.deliveries ??
        summary.delivery_count ??
        fallback.deliveries ??
        0
      );

      const hours = Number(
        summary.workHours ??
        summary.hours ??
        summary.work_hours ??
        fallback.hours ??
        0
      );

      const distance = Number(
        summary.distanceKm ??
        summary.distance ??
        summary.distance_km ??
        fallback.distance ??
        0
      );

      const expense = Number(
        summary.expenseAmount ??
        summary.expense ??
        summary.expense_amount ??
        fallback.expense ??
        0
      );

      return {
        sales: Number.isFinite(sales) ? sales : 0,
        deliveries: Number.isFinite(deliveries)
          ? deliveries
          : 0,
        hours: Number.isFinite(hours)
          ? hours
          : 0,
        distance: Number.isFinite(distance)
          ? distance
          : 0,
        expense: Number.isFinite(expense)
          ? expense
          : 0
      };
    }

    function renderSummary(data) {
      const summary = getSummaryValues(data);

      const hourly =
        summary.hours > 0
          ? summary.sales / summary.hours
          : 0;

      const unitPrice =
        summary.deliveries > 0
          ? summary.sales / summary.deliveries
          : 0;

      document.getElementById(
        'summarySales'
      ).textContent = formatYen(summary.sales);

      document.getElementById(
        'summaryDeliveries'
      ).textContent =
        `${summary.deliveries.toLocaleString('ja-JP')}件`;

      document.getElementById(
        'summaryHours'
      ).textContent =
        formatHours(summary.hours);

      document.getElementById(
        'summaryHourly'
      ).textContent =
        formatYen(hourly);

      document.getElementById(
        'summaryUnitPrice'
      ).textContent =
        formatYen(unitPrice);

      renderEfficiency(summary);
    }

    function renderEfficiency(summary) {
      const perDelivery =
        summary.deliveries > 0
          ? summary.sales / summary.deliveries
          : 0;

      const deliveriesPerHour =
        summary.hours > 0
          ? summary.deliveries / summary.hours
          : 0;

      const salesPerKm =
        summary.distance > 0
          ? summary.sales / summary.distance
          : 0;

      document.getElementById(

      document.getElementById(

    function getLocalDateKey(date) {
      const year = date.getFullYear();
      const month =
        String(date.getMonth() + 1).padStart(2, '0');
      const day =
        String(date.getDate()).padStart(2, '0');

      return `${year}-${month}-${day}`;
    }

    function getWeekdayName(date) {
      return [
        '日',
        '月',
        '火',
        '水',
        '木',

    }

    function getAnalyticsRecords() {
      const records =
        getRecordsFromData(currentData);

      const now = new Date();

      if (currentAnalyticsPeriod === 'all') {
        return records;
      }

      let start;

      if (currentAnalyticsPeriod === 'month') {
        start = new Date(
          now.getFullYear(),
          now.getMonth(),
          1
        );
      } else {
        start = new Date(now);
        start.setDate(
          now.getDate() - 6
        );
        start.setHours(0, 0, 0, 0);
      }

      return records.filter(record => {
        const value = getDateValue(record);

        if (!value) {
          return false;
        }

        const date = new Date(value);

        return (
          !Number.isNaN(date.getTime()) &&
          date >= start
        );
      });
    }

    function renderAnalytics() {
      const records =
        getAnalyticsRecords();

      renderSalesChart(records);
      renderDailyList(records);
      renderWeekdayList(records);
      renderHourList(records);
    }

    function renderSalesChart(records) {
      const container =
        document.getElementById('salesChart');

      if (!container) {
        return;
      }

      const daily = {};

      for (const record of records) {
        const value = getDateValue(record);

        if (!value) {
          continue;
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          continue;
        }

        const key =
          getLocalDateKey(date);

        daily[key] =
          (daily[key] || 0) +
          getSaleAmount(record);
      }

      const entries =
        Object.entries(daily)
          .sort((a, b) =>
            a[0].localeCompare(b[0])
          );

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="empty">
            データがありません
          </div>
        `;
        return;
      }

      const max =
        Math.max(
          ...entries.map(item => item[1]),
          1
        );

      container.innerHTML =
        entries
          .map(([key, value]) => {
            const date =
              new Date(`${key}T00:00:00`);

            const height =
              Math.max(
                3,
                Math.round(
                  (value / max) * 90
                )
              );

            return `
              <div class="chart-bar-wrap">
                <div
                  class="chart-bar-area"
                  title="${escapeHtml(
                    formatYen(value)
                  )}"
                >
                  <div
                    class="chart-bar"
                    style="height:${height}px"
                  ></div>
                </div>

                <div class="chart-label">
                  ${date.getMonth() + 1}/
                  ${date.getDate()}
                </div>
              </div>
            `;
          })
          .join('');
    }

    async function loadPersonal() {
      if (!tg?.initData) {
        updateUserName();

        showToast(
          'Telegram Mini Appとして起動してください',
          'error'
        );

        return;
      }

      try {
        const query =
          getPeriodQuery(currentPeriod);

        const response =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(query)}`
          );

        const data =
          await readApiResponse(response);

        currentData = data;

        updateUserName();

        const records =
          getRecordsFromData(data);

        renderSummary(data);
        renderRecords(records);
        renderStreak(records);
        renderAnalytics();

      } catch (error) {
        console.error(
          'loadPersonal error:',
          error
        );

        showToast(
          error.message ||
          'データの取得に失敗しました',
          'error'
        );

        document.getElementById(
          'recordList'
        ).innerHTML = `
          <div class="empty">
            データを取得できませんでした
          </div>
        `;
      }
    }

    function renderStreak(records) {
      const element =
        document.getElementById(
          'streakNumber'
        );

      if (!element) {
        return;
      }

      const dateSet = new Set();

      for (const record of records) {
        const value =
          getDateValue(record);

        if (!value) {
          continue;
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          continue;
        }

        dateSet.add(
          getLocalDateKey(date)
        );
      }

      if (dateSet.size === 0) {
        element.textContent = '0';
        return;
      }

      const today = new Date();

      today.setHours(
        0,
        0,
        0,
        0
      );

      let streak = 0;
      let cursor = new Date(today);

      while (
        dateSet.has(
          getLocalDateKey(cursor)
        )
      ) {
        streak += 1;

        cursor.setDate(
          cursor.getDate() - 1
        );
      }

      element.textContent =
        String(streak);
    }

    function buildWorkStartedAt(
      timeValue
    ) {
      if (!timeValue) {
        return undefined;
      }

      const parts =
        String(timeValue).split(':');

      if (parts.length < 2) {
        return undefined;
      }

      const hour =
        Number(parts[0]);

      const minute =
        Number(parts[1]);

      if (
        !Number.isInteger(hour) ||
        !Number.isInteger(minute) ||
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
      ) {
        return undefined;
      }

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          now.getDate()
        ).padStart(2, '0');

      const hh =
        String(hour).padStart(2, '0');

      const mm =
        String(minute).padStart(2, '0');

      return (
        `${year}-${month}-${day}` +
        `T${hh}:${mm}:00+09:00`
      );
    }

    function getOptionalNumber(
      elementId
    ) {
      const element =
        document.getElementById(
          elementId
        );

      if (!element) {
        return undefined;
      }

      const value =
        element.value.trim();

      if (value === '') {
        return undefined;
      }

      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return undefined;
      }

      return number;
    }

    async function setupAddResultForm() {
      const form =
        document.getElementById(
          'addResultForm'
        );

      if (!form) {
        return;
      }

      form.addEventListener(
        'submit',
        async event => {
          event.preventDefault();

          if (!tg?.initData) {
            showToast(
              'Telegram Mini Appとして起動してください',
              'error'
            );

            return;
          }

          const submitButton =
            form.querySelector(
              '.add-result-submit'
            );

          const saleAmount =
            getOptionalNumber(
              'saleAmountInput'
            );

          const deliveryCount =
            getOptionalNumber(
              'deliveryCountInput'
            );

          const workHours =
            getOptionalNumber(
              'workHoursInput'
            );

          const distanceKm =
            getOptionalNumber(
              'distanceInput'
            );

          const expenseAmount =
            getOptionalNumber(
              'expenseInput'
            );

          const workStartTime =
            document
              .getElementById(
                'workStartTimeInput'
              )
              ?.value
              ?.trim() || '';

          if (
            saleAmount === undefined ||
            saleAmount < 0
          ) {
            showToast(
              '売上を入力してください',
              'error'
            );

            return;
          }

          if (
            deliveryCount === undefined ||
            deliveryCount < 1
          ) {
            showToast(
              '配達件数を入力してください',
              'error'
            );

            return;
          }

          if (
            workHours !== undefined &&
            workHours < 0
          ) {
            showToast(
              '稼働時間を確認してください',
              'error'
            );

            return;
          }

          if (
            distanceKm !== undefined &&
            distanceKm < 0
          ) {
            showToast(
              '走行距離を確認してください',
              'error'
            );

            return;
          }

          if (
            expenseAmount !== undefined &&
            expenseAmount < 0
          ) {
            showToast(
              '経費を確認してください',
              'error'
            );

            return;
          }

          const body = {
            saleAmount:
              Math.round(saleAmount),

            deliveryCount:
              Math.round(deliveryCount)
          };

          if (
            workHours !== undefined
          ) {
            body.workHours =
              workHours;
          }

          if (
            distanceKm !== undefined
          ) {
            body.distanceKm =
              distanceKm;
          }

          if (
            expenseAmount !== undefined
          ) {
            body.expenseAmount =
              Math.round(
                expenseAmount
              );
          }

          const workStartedAt =
            buildWorkStartedAt(
              workStartTime
            );

          if (workStartedAt) {
            body.workStartedAt =
              workStartedAt;
          }

          submitButton.disabled = true;

          const originalText =
            submitButton.textContent;

          submitButton.textContent =
            '保存中…';

          try {
            const response =
              await apiFetch(
                '/api/result',
                {
                  method: 'POST',
                  headers: {
                    'Content-Type':
                      'application/json'
                  },
                  body:
                    JSON.stringify(body)
                }
              );

            await readApiResponse(
              response
            );

            resetAddResultForm();

            showToast(
              '実績を保存しました'
            );

            await loadPersonal();

          } catch (error) {
            console.error(
              'add result error:',
              error
            );

            showToast(
              error.message ||
              '実績の保存に失敗しました',
              'error'
            );

          } finally {
            submitButton.disabled =
              false;

            submitButton.textContent =
              originalText;
          }
        }
      );
    }

    async function initializeApp() {
      /*
       * UIイベントはTelegram認証の有無に関係なく
       * 最初に登録する。
       *
       * これにより、SDK未読み込み等で認証できない場合でも
       * 画面全体が固まった状態にならない。
       */
      setupNavigation();
      setupPeriodTabs();
      setupDetailsToggle();
      setupRefresh();
      setupAddResultForm();

      updateUserName();

      if (!tg?.initData) {
        document.getElementById(
          'userName'
        ).textContent =
          'Telegram Mini Appとして起動してください';

        showToast(
          'Telegram Mini Appとして起動してください',
          'error'
        );

        return;
      }

      /*
       * Telegram側へMini Appの準備完了を通知。
       * SDKが対応している場合のみ実行。
       */
      try {
        tg.ready();
        tg.expand();
      } catch (error) {
        console.warn(
          'Telegram WebApp initialization warning:',
          error
        );
      }

      await loadPersonal();
    }

    /*
     * DOM構築完了後にアプリを開始。
     */
    if (
      document.readyState === 'loading'
    ) {
      document.addEventListener(
        'DOMContentLoaded',
        initializeApp,
        { once: true }
      );
    } else {
      initializeApp();
    }
  </script>
</body>
</html>
