<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>個人リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      padding-bottom: 30px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    /* =====================================================
       Header
    ===================================================== */

    .header {
      margin-bottom: 14px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    /* =====================================================
       Tabs
    ===================================================== */

    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .main-tab {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #e5e7eb;
      color: #374151;
      font-weight: 800;
    }

    .main-tab.active {
      background: #111827;
      color: #ffffff;
    }

    /* =====================================================
       Period tabs
    ===================================================== */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .period-tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 4px;
      background: #ffffff;
      color: #4b5563;
      font-weight: 800;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .period-tab.active {
      background: #111827;
      color: #ffffff;
    }

    /* =====================================================
       Historical selectors
    ===================================================== */

    .history-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .history-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .history-label {
      font-size: 11px;
      font-weight: 800;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .history-box select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px;
      color: #111827;
    }

    /* =====================================================
       Section
    ===================================================== */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* =====================================================
       Card
    ===================================================== */

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .card-subtitle {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
    }

    /* =====================================================
       Hero
    ===================================================== */

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .hero-card {
      background: #111827;
      color: #ffffff;
      border-radius: 16px;
      padding: 16px;
    }

    .hero-label {
      font-size: 12px;
      opacity: .75;
      margin-bottom: 5px;
    }

    .hero-value {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
    }

    /* =====================================================
       Stats
    ===================================================== */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 900;
    }

    .stat-unit {
      font-size: 11px;
      color: #6b7280;
      margin-left: 2px;
    }

    /* =====================================================
       Highlight
    ===================================================== */

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .highlight-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px;
    }

    .highlight-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
    }

    .highlight-value {
      font-size: 18px;
      font-weight: 900;
      margin-top: 4px;
    }

    /* =====================================================
       Records
    ===================================================== */

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #f9fafb;
    }

    .record-left {
      min-width: 0;
    }

    .record-date {
      font-size: 12px;
      font-weight: 800;
      color: #374151;
    }

    .record-meta {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }

    .record-sales {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =====================================================
       Analytics
    ===================================================== */

    .analytics-section-title {
      font-size: 13px;
      font-weight: 900;
      margin: 18px 0 8px;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .analytics-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px;
    }

    .analytics-label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 700;
    }

    .analytics-value {
      font-size: 17px;
      font-weight: 900;
      margin-top: 4px;
    }

    .analytics-note {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* =====================================================
       Banner
    ===================================================== */

    .record-banner {
      display: none;
      background: #111827;
      color: #ffffff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .record-banner.show {
      display: block;
    }

    .record-banner-title {
      font-weight: 900;
      margin-bottom: 4px;
    }

    .record-banner-text {
      font-size: 12px;
      opacity: .8;
    }

    /* =====================================================
       Buttons
    ===================================================== */

    .danger-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #dc2626;
      color: #ffffff;
      font-weight: 900;
    }

    .secondary-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #e5e7eb;
      color: #111827;
      font-weight: 800;
    }

    /* =====================================================
       Loading / Error
    ===================================================== */

    .loading {
      padding: 24px 10px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .error {
      padding: 14px;
      border-radius: 12px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
    }

    .empty {
      padding: 20px 10px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {

      .app {
        padding: 12px;
      }

      .hero-value {
        font-size: 21px;
      }

      .stat-value,
      .highlight-value {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>

  <div class="app">

    <!-- ===================================================
         Header
    ==================================================== -->

    <header class="header">

      <div
        id="userName"
        class="header-title"
      >
        個人ダッシュボード
      </div>

      <div class="header-subtitle">
        配達実績・分析・履歴
      </div>

    </header>


    <!-- ===================================================
         Main Tabs
    ==================================================== -->

    <div class="main-tabs">

      <button
        id="personalTab"
        class="main-tab active"
        data-section="personal"
        type="button"
      >
        📊 個人実績
      </button>

      <button
        id="analyticsTab"
        class="main-tab"
        data-section="analytics"
        type="button"
      >
        📈 分析
      </button>

    </div>


    <!-- ===================================================
         Personal
    ==================================================== -->

    <section
      id="personalSection"
      class="section active"
    >

      <!-- Period -->

      <div class="period-tabs">

        <button
          class="period-tab active"
          data-period="today"
          type="button"
        >
          今日
        </button>

        <button
          class="period-tab"
          data-period="week"
          type="button"
        >
          今週
        </button>

        <button
          class="period-tab"
          data-period="month"
          type="button"
        >
          今月
        </button>

        <button
          class="period-tab"
          data-period="year"
          type="button"
        >
          年間
        </button>

      </div>


      <!-- 過去の月・年 -->

      <div class="history-selector">

        <div class="history-box">

          <div class="history-label">
            📅 過去の月
          </div>

          <select id="monthSelector">

            <option value="">
              月を選択
            </option>

          </select>

        </div>


        <div class="history-box">

          <div class="history-label">
            📅 過去の年
          </div>

          <select id="yearSelector">

            <option value="">
              年を選択
            </option>

          </select>

        </div>

      <!-- Error -->

      <div

      <!-- Record banner -->

      <div
        id="recordBanner"
        class="record-banner"

        <div
          id="recordBannerTitle"

        ></div>

        <div
          id="recordBannerText"
          class="record-banner-text"
        ></div>

      </div>


      <!-- Hero -->

      <div
        id="personalHero"
        class="hero-grid"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>


      <!-- Basic stats -->

      <div class="card">

        <div class="card-title">

          <span>
            📊 基本実績
          </span>

          <span
            id="periodLabel"
            class="card-subtitle"
          >
            今日
          </span>

        </div>

        <div
          id="personalStatsGrid"

          <div class="loading">
            読み込み中...

        </div>

      <!-- Today -->

        <div class="card-title">
          🔥 今日のハイライト
        </div>

        <div
          id="todayHighlights"

            読み込み中...
          </div>

        </div>

      </div>


      <!-- Monthly best -->

      <div class="card">

        <div class="card-title">
          🏆 自己ベスト
        </div>

        <div
          id="monthlyBest"
          class="highlight-grid"
        >

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </div>


      <!-- Streak -->

      <div class="card">

        <div class="card-title">
          🔥 継続日数
        </div>

        <div
          id="streakCard"
          class="highlight-grid"
        >

          <div class="loading">
            読み込み中...
          </div>

        </div>

      </div>


      <!-- Records -->

      <div class="card">

        <div class="card-title">

          <span>
            📝 実績履歴
          </span>

          <span
            id="recordPeriodLabel"
            class="card-subtitle"
          >
            今日
          </span>

        </div>

        <div

            読み込み中...

      <!-- Reset -->

      <div class="card">

    <!-- ===================================================
         Analytics
    ==================================================== -->

    <section

      <div class="card">

        <div class="card-title">

          <span>
            📈 個人分析
          </span>

          <span

          ></span>

        </div>


        <div class="analytics-section-title">
          ⚡ 今日のパフォーマンス
        </div>

        <div

            読み込み中...
          </div>

        </div>


        <div class="analytics-section-title">
          📊 ペース分析
        </div>

        <div

          🏆 自己ベスト
        </div>

        <div
          id="bestAnalytics"

            読み込み中...

        <div
          id="comparisonAnalytics"

            読み込み中...

      <!-- Daily -->

      <div class="card">

        <div class="card-title">
          📅 日別推移
        </div>

        <div
          id="dailyAnalytics"
          class="record-list"
        >

          <div class="loading">
            読み込み中...

      </div>

  </div>


  <!-- =====================================================
       JavaScript
  ====================================================== -->

  <script>

    // =====================================================
    // Telegram
    // =====================================================

    const tg =
      window.Telegram?.WebApp || null;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    // =====================================================
    // State
    // =====================================================

    let activeSection =
      "personal";

    let activePeriod =
      "today";

    let currentPersonal =
      null;

    let currentAnalytics =
      null;


    // =====================================================
    // Telegram Auth
    // =====================================================

    function getInitData() {
      return tg?.initData || "";
    }


    async function apiFetch(
      url,
      options = {}
    ) {

      const headers = {
        ...(options.headers || {}),
        "X-Telegram-Init-Data":
          getInitData(),
      };

      const response =
        await fetch(
          url,
          {
            ...options,
            headers,
          }
        );

      let data;

      try {
        data =
          await response.json();
      } catch {
        throw new Error(
          "APIレスポンスを読み込めませんでした。"
        );
      }

      if (!response.ok) {
        throw new Error(
          data?.error ||
          `APIエラー: ${response.status}`
        );
      }

      return data;
    }


    // =====================================================
    // Format
    // =====================================================

    function formatNumber(
      value
    ) {

      return Number(
        value || 0
      ).toLocaleString(
        "ja-JP"
      );

    }


    function formatYen(
      value
    ) {

      return `¥${formatNumber(
        Math.round(
          Number(value || 0)
        )
      )}`;

    }


    function formatHours(
      value
    ) {

      return Number(
        value || 0
      ).toFixed(1);

    }


    function formatPercent(
      value
    ) {

      return `${Math.round(
        Number(value || 0)
      )}%`;

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function formatDateJST(
      value
    ) {

      if (!value) {
        return "-";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "-";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone:
            "Asia/Tokyo",
          year:
            "numeric",
          month:
            "2-digit",
          day:
            "2-digit",
          hour:
            "2-digit",
          minute:
            "2-digit",
        }
      ).format(date);

    }


    // =====================================================
    // User
    // =====================================================

    function renderUserName() {

      const element =
        document.getElementById(
          "userName"
        );

      const user =
        tg?.initDataUnsafe?.user;

      if (!user) {
        element.textContent =
          "個人ダッシュボード";

        return;
      }

      const name =
        [
          user.first_name,
          user.last_name,
        ]
          .filter(Boolean)
          .join(" ");

      if (name) {

        element.textContent =
          `${name} さん`;

        return;
      }

      if (user.username) {

        element.textContent =
          `@${user.username}`;

        return;
      }

      element.textContent =
        "個人ダッシュボード";

    }


    // =====================================================
    // Section
    // =====================================================

    function showSection(
      section
    ) {

      activeSection =
        section;

      document
        .querySelectorAll(
          ".main-tab"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.section ===
                section
            );

          }
        );

      document
        .querySelectorAll(
          ".section"
        )
        .forEach(
          element => {

            const target =
              element.id ===
              "personalSection"
                ? "personal"
                : element.id ===
                    "analyticsSection"
                  ? "analytics"
                  : "";

            element.classList.toggle(
              "active",
              target === section
            );

          }
        );

      if (
        section ===
        "personal"
      ) {

        loadPersonal(
          activePeriod
        );

      }

      if (
        section ===
        "analytics"
      ) {

        loadAnalytics();

      }

    }


    // =====================================================
    // Period
    // =====================================================

    function updatePeriodTabs() {

      document
        .querySelectorAll(
          ".period-tab"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.period ===
                activePeriod
            );

          }
        );

    }


    function getPeriodLabel(
      period
    ) {

      const labels = {
        today:
          "今日",

        week:
          "今週",

        month:
          "今月",

        year:
          "年間",
      };

      return (
        labels[period] ||
        "今日"
      );

    }


    // =====================================================
    // Personal
    // =====================================================

    async function loadPersonal(
      period = activePeriod
    ) {

      activePeriod =
        period;

      updatePeriodTabs();

      const errorElement =
        document.getElementById(
          "personalError"
        );

      errorElement.classList.add(
        "hidden"
      );

      try {

        const data =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(
              period
            )}`
          );

        currentPersonal =
          data;

        renderPersonal(
          data,
          period
        );

        await loadAnalytics();

      } catch (error) {

        console.error(
          "personal load error:",
          error
        );

        showPersonalError(
          error.message ||
          "個人実績の取得に失敗しました。"
        );

      }

    }


    function showPersonalError(
      message
    ) {

      const element =
        document.getElementById(
          "personalError"
        );

      element.textContent =
        message;

      element.classList.remove(
        "hidden"
      );

    }


    function renderPersonal(
      data,
      period
    ) {

      const stats =
        data?.stats || {};

      const sales =
        Number(
          stats.sales || 0
        );

      const count =
        Number(
          stats.deliveryCount || 0
        );

      const hours =
        Number(
          stats.workHours || 0
        );

      const unitPrice =
        Number(
          stats.unitPrice || 0
        );

      const hourlySales =
        Number(
          stats.hourlySales || 0
        );

      document.getElementById(
        "periodLabel"
      ).textContent =
        getPeriodLabel(
          period
        );

      document.getElementById(
        "recordPeriodLabel"
      ).textContent =
        getPeriodLabel(
          period
        );


      // Hero

      document.getElementById(
        "personalHero"
      ).innerHTML = `

        <div class="hero-card">

          <div class="hero-label">
            💰 売上
          </div>

          <div class="hero-value">
            ${formatYen(sales)}
          </div>

        </div>


        <div class="hero-card">

          <div class="hero-label">
            📦 配達数
          </div>

          <div class="hero-value">
            ${formatNumber(count)}件
          </div>

        </div>

      `;


      // Stats

      document.getElementById(
        "personalStatsGrid"
      ).innerHTML = `

        <div class="stat-box">

          <div class="stat-label">
            稼働時間
          </div>

          <div class="stat-value">
            ${formatHours(hours)}
            <span class="stat-unit">
              h
            </span>
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            時給換算
          </div>

          <div class="stat-value">

        records.length === 0

        container.innerHTML =
          `<div class="empty">

        return;

      container.innerHTML =
        records

            record => {

              const sale =
                Number(
                  record?.saleAmount ||
                  0
                );

              const count =
                Number(
                  record?.deliveryCount ||
                  0
                );

                  record?.workHours ||
                  0
                );

              return `

        document.getElementById(
          "recordBannerTitle"
        );

      const text =
        document.getElementById(
          "recordBannerText"
        );

      const analysis =
        data?.analysis || {};

      const isBestCount =
        Boolean(
          analysis.isBestCount
        );

      const isBestSales =
        Boolean(
          analysis.isBestSales
        );

      if (
        !isBestCount &&
        !isBestSales
      ) {

        element.classList.remove(
          "show"
        );

        return;
      }

      const messages = [];

      if (isBestCount) {
        messages.push(
          "配達数の自己ベスト更新"
        );
      }

      if (isBestSales) {
        messages.push(
          "売上の自己ベスト更新"
        );
      }

      title.textContent =
        "🎉 自己ベスト！";

      text.textContent =
        messages.join(
          " / "
        );

      element.classList.add(
        "show"
      );

    }

    function renderAnalytics(

      const analysis =

          today.deliveryCount || 0

        todayHours > 0

    function renderDailyAnalytics(

    // =====================================================
    // History selectors
    // =====================================================

    function buildHistorySelectors() {

      const monthSelector =
        document.getElementById(
          "monthSelector"
        );

      const yearSelector =
        document.getElementById(
          "yearSelector"
        );


      // 過去24か月

      const now =
        new Date();

      const monthOptions = [];

      for (
        let i = 0;
        i < 24;
        i++
      ) {

        const date =
          new Date(
            now.getFullYear(),
            now.getMonth() - i,
            1
          );

        const year =
          date.getFullYear();

        const month =
          String(
            date.getMonth() + 1
          ).padStart(
            2,
            "0"
          );

        const value =
          `${year}-${month}`;

        monthOptions.push(
          `<option value="${value}">
            ${year}年${Number(month)}月
          </option>`
        );

      }

      monthSelector.innerHTML =
        `
          <option value="">
            月を選択
          </option>
        ` +
        monthOptions.join("");


      // 過去5年

      const currentYear =
        now.getFullYear();

      const yearOptions = [];

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        const year =
          currentYear - i;

        yearOptions.push(
          `<option value="${year}">
            ${year}年
          </option>`
        );

      }

      yearSelector.innerHTML =
        `
          <option value="">
            年を選択
          </option>
        ` +
        yearOptions.join("");

    }


    // =====================================================
    // Historical selection
    // =====================================================

    async function loadHistoricalMonth(
      month
    ) {

      if (!month) {
        return;
      }

      activePeriod =
        "month";

      updatePeriodTabs();

      try {

        /*
         * api/result.js 側で
         *
         * ?period=month&month=YYYY-MM
         *
         * を受け取る想定。
         */

        const data =
          await apiFetch(
            `/api/result?period=month&month=${encodeURIComponent(
              month
            )}`
          );

        currentPersonal =
          data;

        renderPersonal(
          data,
          "month"
        );

        const label =
          document.getElementById(
            "periodLabel"
          );

        label.textContent =
          `${month} の実績`;

        document.getElementById(
          "recordPeriodLabel"
        ).textContent =
          `${month}`;

      } catch (error) {

        console.error(
          "historical month error:",
          error
        );

        showPersonalError(
          error.message ||
          "指定月の実績を取得できませんでした。"
        );

      }

    }


    async function loadHistoricalYear(
      year
    ) {

      if (!year) {
        return;
      }

      activePeriod =

      updatePeriodTabs();

      try {

        /*

    // =====================================================
    // Reset
    // =====================================================

    async function resetData() {

      const first =
        confirm(
          "自分の配達実績をすべて削除します。\n\n本当に実行しますか？"
        );

      if (!first) {
        return;
      }

      const second =
        confirm(
          "この操作は元に戻せません。\n\n本当に全削除しますか？"
        );

      if (!second) {
        return;
      }

      try {

        const data =
          await apiFetch(
            "/api/reset",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body:
                JSON.stringify({}),
            }
          );

        if (!data?.ok) {

          throw new Error(
            data?.error ||
            "リセットに失敗しました。"
          );

        }

        alert(
          "自分の実績を削除しました。"
        );

        await loadPersonal(
          "today"
        );

      } catch (error) {

        console.error(
          error
        );

        alert(
          error.message ||
          "リセットに失敗しました。"
        );

      }

    }


    // =====================================================
    // Events
    // =====================================================

    document
      .querySelectorAll(
        ".main-tab"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              showSection(
                button.dataset.section
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".period-tab"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              loadPersonal(
                button.dataset.period
              );

            }
          );

        }
      );


    document
      .getElementById(
        "monthSelector"
      )
      .addEventListener(
        "change",
        event => {

          const value =
            event.target.value;

          if (value) {

            document.getElementById(
              "yearSelector"
            ).value = "";

            loadHistoricalMonth(
              value
            );

          }

        }
      );


    document
      .getElementById(
        "yearSelector"
      )
      .addEventListener(
        "change",
        event => {

          const value =
            event.target.value;

          if (value) {

            document.getElementById(
              "monthSelector"
            ).value = "";

            loadHistoricalYear(
              value
            );

          }

        }
      );


    document
      .getElementById(
        "resetBtn"
