<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>個人テレグラムリザルト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #7b8495;
      --border: #e5e9f0;
      --primary: #229ed9;
      --primary-dark: #1686bd;
      --success: #18a66a;
      --danger: #e05252;
      --shadow: 0 4px 18px rgba(23, 32, 51, .07);
      --radius: 16px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
    }

    .user-name {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .refresh-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 18px;
    }

    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 14px 16px 0;
      padding: 4px;
      background: #e9edf3;
      border-radius: 14px;
    }

    .main-tab {
      border: 0;
      border-radius: 11px;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .main-tab.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .section {
      display: none;
      padding: 16px;
    }

    .section.active {
      display: block;
    }

    .period-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 14px;
    }

    .period-tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .add-result-card {
      margin-bottom: 16px;
      padding: 18px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #596273;
    }

    .result-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .result-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34,158,217,.12);
    }

    .details-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 3px 0 10px;
      padding: 11px 0;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--primary-dark);
      font-weight: 700;
      text-align: left;
    }

    .optional-details {
      display: none;
    }

    .optional-details.open {
      display: block;
    }

    .add-result-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .add-result-submit:disabled {
      opacity: .6;
      cursor: default;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 850;
    }

    .summary-value.small {
      font-size: 16px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hero-card {
      padding: 15px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid var(--border);
    }

    .hero-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .hero-value {
      margin-top: 5px;
      font-size: 23px;
      font-weight: 850;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .analysis-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    .analysis-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .analysis-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: 850;
    }

    .best-list,
    .record-list,
    .daily-list {
      display: grid;
      gap: 9px;
    }

    .best-item,
    .record-item,
    .daily-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .record-main {
      min-width: 0;
    }

    .record-date {
      color: var(--muted);
      font-size: 11px;
    }

    .record-title {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 800;
    }

    .record-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .record-amount {
      white-space: nowrap;
      font-size: 16px;
      font-weight: 850;
    }

    .streak-box {
      padding: 16px;
      border-radius: 15px;
      background: #fff;
      border: 1px solid var(--border);
      text-align: center;
    }

    .streak-number {
      font-size: 34px;
      font-weight: 900;
    }

    .streak-label {
      color: var(--muted);
      font-size: 12px;
    }

    .chart {
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 12px 4px 4px;
      overflow-x: auto;
    }

    .chart-bar-wrap {
      min-width: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .chart-bar-area {
      height: 90px;
      width: 24px;
      display: flex;
      align-items: flex-end;
    }

    .chart-bar {
      width: 100%;
      min-height: 2px;
      border-radius: 5px 5px 2px 2px;
      background: var(--primary);
    }

    .chart-label {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
    }

    .report-grid {
      display: grid;
      gap: 10px;
    }

    .empty {
      padding: 24px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .danger-btn {
      width: 100%;
      min-height: 44px;
      border: 1px solid #f0b6b6;
      border-radius: 11px;
      background: #fff;
      color: var(--danger);
      font-weight: 700;
    }

    .section-heading {
      margin: 4px 0 10px;
      font-size: 16px;
      font-weight: 850;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 18px;
      z-index: 100;
      display: none;
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(23,32,51,.94);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      background: rgba(180,45,45,.95);
    }

    @media (min-width: 700px) {
      .section {
        max-width: 760px;
        margin: 0 auto;
      }

      .header {
        padding-left: calc((100% - 760px) / 2 + 16px);
        padding-right: calc((100% - 760px) / 2 + 16px);
      }

      .main-tabs {
        max-width: 728px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div>
        <div class="header-title">📦 個人テレグラムリザルト</div>
        <div id="userName" class="user-name">読み込み中…</div>
      </div>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
        aria-label="更新"
      >
        ↻
      </button>
    </header>

    <nav class="main-tabs">
      <button
        class="main-tab active"
        type="button"
        data-section="personal"
      >
        個人実績
      </button>

      <button
        class="main-tab"
        type="button"
        data-section="analytics"
      >
        分析
      </button>
    </nav>

    <!-- =========================
         個人実績
    ========================== -->
    <section
      id="personalSection"
      class="section active"
    >

      <div class="period-tabs">
        <button
          class="period-tab active"
          type="button"
          data-period="today"
        >
          今日
        </button>

        <button
          class="period-tab"
          type="button"
          data-period="week"
        >
          今週
        </button>

        <button
          class="period-tab"
          type="button"
          data-period="month"
        >
          今月
        </button>

        <button
          class="period-tab"
          type="button"
          data-period="all"
        >
          全期間
        </button>
      </div>

      <!-- 実績追加 -->
      <div class="add-result-card">
        <h2 class="card-title">実績を追加</h2>

        <form id="addResultForm">

          <div class="form-row">
            <div class="field">
              <label for="saleAmountInput">売上（円）</label>
              <input
                id="saleAmountInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="5000"
                required
              >
            </div>

            <div class="field">
              <label for="deliveryCountInput">配達件数</label>
              <input
                id="deliveryCountInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="5"
                required
              >
            </div>
          </div>

          <button
            id="detailsToggle"
            class="details-toggle"
            type="button"
            aria-expanded="false"
          >
            <span>詳細設定（任意）</span>
            <span id="detailsToggleIcon">＋</span>
          </button>

          <div
            id="optionalDetails"
            class="optional-details"
          >
            <div class="field">
              <label for="workStartTimeInput">
                稼働開始時刻
              </label>

              <input
                id="workStartTimeInput"
                class="result-input"
                type="time"
              >
            </div>

            <div class="field">
              <label for="workHoursInput">
                稼働時間（時間）
              </label>

              <input
                id="workHoursInput"
                class="result-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="5.5"
              >
            </div>

            <div class="field">
              <label for="distanceInput">
                走行距離（km）
              </label>

              <input
                id="distanceInput"
                class="result-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="30"
              >
            </div>

            <div class="field">
              <label for="expenseInput">
                経費（円）
              </label>

              <input
                id="expenseInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="500"
              >
            </div>
          </div>

          <button
            class="add-result-submit"
            type="submit"
          >
            実績を保存
          </button>
        </form>
      </div>

      <!-- 期間サマリー -->
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">売上</div>
          <div id="summarySales" class="summary-value">¥0</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">配達件数</div>
          <div id="summaryDeliveries" class="summary-value">0件</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">稼働時間</div>
          <div id="summaryHours" class="summary-value small">0時間</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">時給</div>
          <div id="summaryHourly" class="summary-value small">¥0</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">平均単価</div>
          <div id="summaryUnitPrice" class="summary-value small">¥0</div>
        </div>
      </div>

      <!-- 効率分析 -->
      <div class="card">
        <h2 class="card-title">効率分析</h2>

        <div class="analysis-grid">
          <div class="analysis-card">
            <div class="analysis-label">1件あたり売上</div>
            <div id="analysisPerDelivery" class="analysis-value">¥0</div>
          </div>

          <div class="analysis-card">
            <div class="analysis-label">1時間あたり件数</div>
            <div id="analysisDeliveriesPerHour" class="analysis-value">0件</div>
          </div>

          <div class="analysis-card">
            <div class="analysis-label">1kmあたり売上</div>
            <div id="analysisSalesPerKm" class="analysis-value">¥0</div>
          </div>

          <div class="analysis-card">
            <div class="analysis-label">経費</div>
            <div id="analysisExpense" class="analysis-value">¥0</div>
          </div>
        </div>
      </div>

      <!-- 継続状況 -->
      <div class="card">
        <h2 class="card-title">継続状況</h2>

        <div class="streak-box">
          <div id="streakNumber" class="streak-number">0</div>
          <div class="streak-label">連続稼働日</div>
        </div>
      </div>

      <!-- 履歴 -->
      <div class="card">
        <h2 class="card-title">実績履歴</h2>

        <div id="recordList" class="record-list">
          <div class="empty">読み込み中…</div>
        </div>
      </div>

    </section>

    <!-- =========================
         分析
    ========================== -->
    <section
      id="analyticsSection"
      class="section"
    >

      <div class="period-tabs">
        <button
          class="period-tab active"
          type="button"
          data-analytics-period="week"
        >
          週間
        </button>

        <button
          class="period-tab"
          type="button"
          data-analytics-period="month"
        >
          月間
        </button>

        <button
          class="period-tab"
          type="button"
          data-analytics-period="all"
        >
          全期間
        </button>
      </div>

      <div class="card">
        <h2 class="card-title">売上推移</h2>
        <div id="salesChart" class="chart">
          <div class="empty">データがありません</div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">日別実績</h2>

        <div id="dailyList" class="daily-list">
          <div class="empty">データがありません</div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">曜日別</h2>

        <div id="weekdayList" class="best-list">
          <div class="empty">データがありません</div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">時間帯別</h2>

        <div id="hourList" class="best-list">
          <div class="empty">データがありません</div>
        </div>
      </div>

    </section>

  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    'use strict';

    const tg = window.Telegram?.WebApp || null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const JST = 'Asia/Tokyo';

    let activeSection = 'personal';
    let activePeriod = 'today';
    let activeAnalyticsPeriod = 'week';
    let currentData = null;

    /* =========================
       共通
    ========================== */

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatYen(value) {
      const n = Number(value || 0);
      return '¥' + Math.round(n).toLocaleString('ja-JP');
    }

    function formatHours(value) {
      const n = Number(value || 0);

      if (!Number.isFinite(n) || n <= 0) {
        return '0時間';
      }

      return `${n.toFixed(1).replace(/\.0$/, '')}時間`;
    }

    function formatDate(value) {
      if (!value) return '-';

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return '-';
      }

      return new Intl.DateTimeFormat('ja-JP', {
        timeZone: JST,
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    }

    function showToast(message, type = 'normal') {
      const toast = document.getElementById('toast');

      if (!toast) return;

      toast.textContent = message;
      toast.className = 'toast show';

      if (type === 'error') {
        toast.classList.add('error');
      }

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.className = 'toast';
      }, 3000);
    }

    async function apiFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});

      if (tg?.initData) {
        headers.set(
          'X-Telegram-Init-Data',
          tg.initData
        );
      }

      const response = await fetch(url, {
        ...options,
        headers
      });

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        throw new Error(
          data?.error ||
          data?.message ||
          `HTTP ${response.status}`
        );
      }

      return data;
    }

    function setUserName(user) {
      const el = document.getElementById('userName');

      if (!el) return;

      if (!user) {
        el.textContent = 'Telegramユーザー';
        return;
      }

      const name =
        user.first_name ||
        user.username ||
        user.id ||
        'Telegramユーザー';

      el.textContent = name;
    }

    /* =========================
       セクション
    ========================== */

    function activateSection(sectionName) {
      activeSection = sectionName;

      document.querySelectorAll('.main-tab').forEach(tab => {
        tab.classList.toggle(
          'active',
          tab.dataset.section === sectionName
        );
      });

      document
        .getElementById('personalSection')
        ?.classList.toggle(
          'active',
          sectionName === 'personal'
        );

      document
        .getElementById('analyticsSection')
        ?.classList.toggle(
          'active',
          sectionName === 'analytics'
        );

      if (sectionName === 'analytics') {
        loadAnalytics();
      }
    }

    function setupNavigation() {
      document.querySelectorAll('.main-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          activateSection(tab.dataset.section);
        });
      });
    }

    /* =========================
       期間
    ========================== */

    function activatePeriod(period) {
      activePeriod = period;

      document.querySelectorAll(
        '[data-period]'
      ).forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.period === period
        );
      });

      loadPersonal();
    }

    function setupPeriodTabs() {
      document.querySelectorAll(
        '[data-period]'
      ).forEach(button => {
        button.addEventListener('click', () => {
          activatePeriod(button.dataset.period);
        });
      });

      document.querySelectorAll(
        '[data-analytics-period]'
      ).forEach(button => {
        button.addEventListener('click', () => {
          activeAnalyticsPeriod =
            button.dataset.analyticsPeriod;

          document.querySelectorAll(
            '[data-analytics-period]'
          ).forEach(item => {
            item.classList.toggle(
              'active',
              item.dataset.analyticsPeriod ===
                activeAnalyticsPeriod
            );
          });

          loadAnalytics();
        });
      });
    }

    /* =========================
       詳細設定
    ========================== */

    function setupDetailsToggle() {
      const toggle =
        document.getElementById('detailsToggle');

      const details =
        document.getElementById('optionalDetails');

      const icon =
        document.getElementById('detailsToggleIcon');

      if (!toggle || !details) return;

      toggle.addEventListener('click', () => {
        const open =
          details.classList.toggle('open');

        toggle.setAttribute(
          'aria-expanded',
          String(open)
        );

        if (icon) {
          icon.textContent = open ? '−' : '＋';
        }
      });
    }

    /* =========================
       実績追加
    ========================== */

    function parseOptionalNumber(id) {
      const element = document.getElementById(id);

      if (!element) return null;

      const value = element.value.trim();

      if (value === '') {
        return null;
      }

      const number = Number(value);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function buildWorkStartedAt(timeValue) {
      if (!timeValue) return null;

      const [hour, minute] =
        timeValue.split(':').map(Number);

      if (
        !Number.isInteger(hour) ||
        !Number.isInteger(minute) ||
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
      ) {
        return null;
      }

      const now = new Date();

      const formatter = new Intl.DateTimeFormat(
        'en-CA',
        {
          timeZone: JST,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }
      );

      const parts =
        Object.fromEntries(
          formatter
            .formatToParts(now)
            .filter(part => part.type !== 'literal')
            .map(part => [
              part.type,
              part.value
            ])
        );

      const localDate =
        `${parts.year}-${parts.month}-${parts.day}`;

      return `${localDate}T${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:00+09:00`;
    }

    async function setupAddResultForm() {
      const form =
        document.getElementById('addResultForm');

      if (!form) return;

      form.addEventListener('submit', async event => {
        event.preventDefault();

        const submit =
          form.querySelector('.add-result-submit');

        const saleAmount =
          Number(
            document
              .getElementById('saleAmountInput')
              .value
          );

        const deliveryCount =
          Number(
            document
              .getElementById('deliveryCountInput')
              .value
          );

        const workHours =
          parseOptionalNumber('workHoursInput');

        const distanceKm =
          parseOptionalNumber('distanceInput');

        const expenseAmount =
          parseOptionalNumber('expenseInput');

        const workStartTime =
          document
            .getElementById('workStartTimeInput')
            ?.value || '';

        if (
          !Number.isFinite(saleAmount) ||
          saleAmount < 0
        ) {
          showToast(
            '売上を正しく入力してください',
            'error'
          );
          return;
        }

        if (
          !Number.isInteger(deliveryCount) ||
          deliveryCount < 0
        ) {
          showToast(
            '配達件数を正しく入力してください',
            'error'
          );
          return;
        }

        if (
          workHours !== null &&
          workHours < 0
        ) {
          showToast(
            '稼働時間を正しく入力してください',
            'error'
          );
          return;
        }

        if (
          distanceKm !== null &&
          distanceKm < 0
        ) {
          showToast(
            '走行距離を正しく入力してください',
            'error'
          );
          return;
        }

        if (
          expenseAmount !== null &&
          expenseAmount < 0
        ) {
          showToast(
            '経費を正しく入力してください',
            'error'
          );
          return;
        }

        if (!tg?.initData) {
          showToast(
            'Telegramアプリ内から開いてください',
            'error'
          );
          return;
        }

        const payload = {
          saleAmount,
          deliveryCount,
          workHours,
          distanceKm,
          workStartedAt:
            buildWorkStartedAt(workStartTime)
        };

        if (submit) {
          submit.disabled = true;
          submit.textContent = '保存中…';
        }

        try {
          const result =
            await apiFetch('/api/result', {
              method: 'POST',
              headers: {
                'Content-Type':
                  'application/json'
              },
              body: JSON.stringify({
                ...payload,
                expenseAmount
              })
            });

          if (result?.error) {
            throw new Error(result.error);
          }

          form.reset();

          const details =
            document.getElementById(
              'optionalDetails'
            );

          const toggle =
            document.getElementById(
              'detailsToggle'
            );

          const icon =
            document.getElementById(
              'detailsToggleIcon'
            );

          details?.classList.remove('open');
          toggle?.setAttribute(
            'aria-expanded',
            'false'
          );

          if (icon) {
            icon.textContent = '＋';
          }

          showToast('実績を保存しました');

          await loadPersonal();

        } catch (error) {
          console.error(error);

          showToast(
            error.message ||
              '保存に失敗しました',
            'error'
          );

        } finally {
          if (submit) {
            submit.disabled = false;
            submit.textContent = '実績を保存';
          }
        }
      });
    }

    /* =========================
       サマリー
    ========================== */

    function getRecordsFromData(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data?.results)) {
        return data.results;
      }

      if (Array.isArray(data?.records)) {
        return data.records;
      }

      return [];
    }

    function getSummaryFromRecords(records) {
      let sales = 0;
      let deliveries = 0;
      let hours = 0;
      let distance = 0;
      let expense = 0;

      records.forEach(record => {
        sales += Number(record.sale_amount ?? 0);
        deliveries += Number(
          record.delivery_count ?? 0
        );
        hours += Number(
          record.work_hours ?? 0
        );
        distance += Number(
          record.distance_km ?? 0
        );

        if (record.expense_amount != null) {
          expense += Number(
            record.expense_amount
          );
        }
      });

      return {
        sales,
        deliveries,
        hours,
        distance,
        expense
      };
    }

    function renderSummary(data) {
      const records =
        getRecordsFromData(data);

      const summary =
        data?.summary ||
        getSummaryFromRecords(records);

      const sales =
        Number(summary.sales ?? 0);

      const deliveries =
        Number(summary.deliveries ?? 0);

      const hours =
        Number(summary.hours ?? 0);

      const hourly =
        hours > 0
          ? sales / hours
          : 0;

      const unitPrice =
        deliveries > 0
          ? sales / deliveries
          : 0;

      document.getElementById(
        'summarySales'
      ).textContent = formatYen(sales);

      document.getElementById(
        'summaryDeliveries'
      ).textContent =
        `${Math.round(deliveries).toLocaleString('ja-JP')}件`;

      document.getElementById(
        'summaryHours'
      ).textContent =
        formatHours(hours);

      document.getElementById(
        'summaryHourly'
      ).textContent =
        formatYen(hourly);

      document.getElementById(
        'summaryUnitPrice'
      ).textContent =
        formatYen(unitPrice);

      renderEfficiency({
        sales,
        deliveries,
        hours,
        distance:
          Number(summary.distance ?? 0),
        expense:
          Number(summary.expense ?? 0)
      });
    }

    /* =========================
       効率分析
    ========================== */

    function renderEfficiency(summary) {
      const {
        sales,
        deliveries,
        hours,
        distance,
        expense
      } = summary;

      const perDelivery =
        deliveries > 0
          ? sales / deliveries
          : 0;

      const deliveriesPerHour =
        hours > 0
          ? deliveries / hours
          : 0;

      const salesPerKm =
        distance > 0
          ? sales / distance
          : 0;

      document.getElementById(
        'analysisPerDelivery'
      ).textContent =
        formatYen(perDelivery);

      document.getElementById(
        'analysisDeliveriesPerHour'
      ).textContent =
        `${deliveriesPerHour.toFixed(1)}件`;

      document.getElementById(
        'analysisSalesPerKm'
      ).textContent =
        distance > 0
          ? formatYen(salesPerKm)
          : '—';

      document.getElementById(
        'analysisExpense'
      ).textContent =
        formatYen(expense);
    }

    /* =========================
       履歴
    ========================== */

    function renderRecords(data) {
      const container =
        document.getElementById('recordList');

      if (!container) return;

      const records =
        getRecordsFromData(data);

      if (!records.length) {
        container.innerHTML =
          '<div class="empty">まだ実績がありません</div>';
        return;
      }

      container.innerHTML =
        records
          .slice()
          .sort((a, b) =>
            new Date(
              b.created_at
            ) -
            new Date(
              a.created_at
            )
          )
          .map(record => {
            const sale =
              Number(
                record.sale_amount ?? 0
              );

            const count =
              Number(
                record.delivery_count ?? 0
              );

            const hours =
              Number(
                record.work_hours ?? 0
              );

            const hourly =
              hours > 0
                ? sale / hours
                : 0;

            return `
              <div class="record-item">
                <div class="record-main">
                  <div class="record-date">
                    ${escapeHtml(
                      formatDate(
                        record.created_at
                      )
                    )}
                  </div>

                  <div class="record-title">
                    ${count}件
                    ${hours > 0
                      ? ` / ${formatHours(hours)}`
                      : ''}
                  </div>

                  <div class="record-sub">
                    平均単価 ${formatYen(
                      count > 0
                        ? sale / count
                        : 0
                    )}
                    ${
                      hours > 0
                        ? ` / 時給 ${formatYen(hourly)}`
                        : ''
                    }
                  </div>
                </div>

                <div class="record-amount">
                  ${formatYen(sale)}
                </div>
              </div>
            `;
          })
          .join('');
    }

    /* =========================
       継続状況
    ========================== */

    function renderStreak(data) {
      const records =
        getRecordsFromData(data);

      const days = new Set();

      records.forEach(record => {
        if (!record.created_at) return;

        const date =
          new Date(record.created_at);

        if (Number.isNaN(date.getTime())) {
          return;
        }

        const parts =
          new Intl.DateTimeFormat(
            'en-CA',
            {
              timeZone: JST,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            }
          ).formatToParts(date);

        const values =
          Object.fromEntries(
            parts
              .filter(
                part =>
                  part.type !== 'literal'
              )
              .map(part => [
                part.type,
                part.value
              ])
          );

        days.add(
          `${values.year}-${values.month}-${values.day}`
        );
      });

      if (!days.size) {
        document.getElementById(
          'streakNumber'
        ).textContent = '0';
        return;
      }

      const sorted =
        [...days].sort().reverse();

      let streak = 0;

      let current =
        new Date(
          `${sorted[0]}T00:00:00+09:00`
        );

      for (const day of sorted) {
        const currentKey =
          current
            .toLocaleDateString(
              'en-CA',
              {
                timeZone: JST
              }
            );

        if (day !== currentKey) {
          break;
        }

        streak++;

        current.setDate(
          current.getDate() - 1
        );
      }

      document.getElementById(
        'streakNumber'
      ).textContent = String(streak);
    }

    /* =========================
       個人データ
    ========================== */

    async function loadPersonal() {
      try {
        const data =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(
              activePeriod
            )}`
          );

        currentData = data;

        setUserName(
          data?.user ||
          data?.telegramUser ||
          null
        );

        renderSummary(data);
        renderRecords(data);
        renderStreak(data);

      } catch (error) {
        console.error(error);

        showToast(
          error.message ||
            'データの取得に失敗しました',
          'error'
        );
      }
    }

    /* =========================
       分析
    ========================== */

    function renderSalesChart(records) {
      const chart =
        document.getElementById(
          'salesChart'
        );

      if (!chart) return;

      if (!records.length) {
        chart.innerHTML =
          '<div class="empty">データがありません</div>';
        return;
      }

      const grouped = {};

      records.forEach(record => {
        if (!record.created_at) return;

        const date =
          new Date(record.created_at);

        if (Number.isNaN(date.getTime())) {
          return;
        }

        const key =
          new Intl.DateTimeFormat(
            'en-CA',
            {
              timeZone: JST
            }
          ).format(date);

        grouped[key] =
          (grouped[key] || 0) +
          Number(record.sale_amount || 0);
      });

      const entries =
        Object.entries(grouped)
          .sort((a, b) =>
            a[0].localeCompare(b[0])
          )
          .slice(-14);

      if (!entries.length) {
        chart.innerHTML =
          '<div class="empty">データがありません</div>';
        return;
      }

      const max =
        Math.max(
          ...entries.map(
            ([, value]) => value
          ),
          1
        );

      chart.innerHTML =
        entries
          .map(([date, value]) => {
            const height =
              Math.max(
                3,
                Math.round(
                  (value / max) * 100
                )
              );

            const label =
              date.slice(5);

            return `
              <div class="chart-bar-wrap">
                <div
                  class="chart-bar-area"
                  title="${escapeHtml(
                    formatYen(value)
                  )}"
                >
                  <div
                    class="chart-bar"
                    style="height:${height}%"
                  ></div>
                </div>
                <div class="chart-label">
                  ${escapeHtml(label)}
                </div>
              </div>
            `;
          })
          .join('');
    }

    function renderDailyList(records) {
      const container =
        document.getElementById(
          'dailyList'
        );

      if (!container) return;

      const grouped = {};

      records.forEach(record => {
        if (!record.created_at) return;

        const date =
          new Date(record.created_at);

        if (Number.isNaN(date.getTime())) {
          return;
        }

        const key =
          new Intl.DateTimeFormat(
            'en-CA',
            {
              timeZone: JST
            }
          ).format(date);

        if (!grouped[key]) {
          grouped[key] = {
            sales: 0,
            deliveries: 0,
            hours: 0
          };
        }

        grouped[key].sales +=
          Number(record.sale_amount || 0);

        grouped[key].deliveries +=
          Number(record.delivery_count || 0);

        grouped[key].hours +=
          Number(record.work_hours || 0);
      });

      const entries =
        Object.entries(grouped)
          .sort((a, b) =>
            b[0].localeCompare(a[0])
          )
          .slice(0, 14);

      if (!entries.length) {
        container.innerHTML =
          '<div class="empty">データがありません</div>';
        return;
      }

      container.innerHTML =
        entries
          .map(([date, value]) => {
            const hourly =
              value.hours > 0
                ? value.sales / value.hours
                : 0;

            return `
              <div class="daily-item">
                <strong>
                  ${escapeHtml(date)}
                </strong>

                <div class="muted">
                  ${formatYen(value.sales)}
                  ・
                  ${value.deliveries}件
                  ・
                  ${formatHours(value.hours)}
                  ${
                    value.hours > 0
                      ? `・時給 ${formatYen(hourly)}`
                      : ''
                  }
                </div>
              </div>
            `;
          })
          .join('');
    }

    function renderGroupedAnalysis(
      records,
      mode
    ) {
      const result = {};

      records.forEach(record => {
        if (!record.created_at) return;

        const date =
          new Date(record.created_at);

        if (Number.isNaN(date.getTime())) {
          return;
        }

        let key;

        if (mode === 'weekday') {
          key =
            new Intl.DateTimeFormat(
              'ja-JP',
              {
                timeZone: JST,
                weekday: 'short'
              }
            ).format(date);
        } else {
          key =
            new Intl.DateTimeFormat(
              'ja-JP',
              {
                timeZone: JST,
                hour: 'numeric'
              }
            ).format(date);
        }

        if (!result[key]) {
          result[key] = {
            sales: 0,
            deliveries: 0,
            hours: 0
          };
        }

        result[key].sales +=
          Number(record.sale_amount || 0);

        result[key].deliveries +=
          Number(record.delivery_count || 0);

        result[key].hours +=
          Number(record.work_hours || 0);
      });

      return result;
    }

    function renderWeekdayList(records) {
      const container =
        document.getElementById(
          'weekdayList'
        );

      if (!container) return;

      const grouped =
        renderGroupedAnalysis(
          records,
          'weekday'
        );

      const entries =
        Object.entries(grouped)
          .sort((a, b) =>
            b[1].sales - a[1].sales
          );

      if (!entries.length) {
        container.innerHTML =
          '<div class="empty">データがありません</div>';
        return;
      }

      container.innerHTML =
        entries
          .map(([key, value]) => `
            <div class="best-item">
              <strong>${escapeHtml(key)}</strong>
              <div class="muted">
                ${formatYen(value.sales)}
                ・${value.deliveries}件
                ・${formatHours(value.hours)}
              </div>
            </div>
          `)
          .join('');
    }

    function renderHourList(records) {
      const container =
        document.getElementById(
          'hourList'
        );

      if (!container) return;

      const grouped =
        renderGroupedAnalysis(
          records,
          'hour'
        );

      const entries =
        Object.entries(grouped)
          .sort((a, b) => {
            const ah =
              parseInt(a[0], 10) || 0;

            const bh =
              parseInt(b[0], 10) || 0;

            return ah - bh;
          });

      if (!entries.length) {
        container.innerHTML =
          '<div class="empty">開始時刻データがありません</div>';
        return;
      }

      container.innerHTML =
        entries
          .map(([key, value]) => `
            <div class="best-item">
              <strong>${escapeHtml(key)}</strong>
              <div class="muted">
                ${formatYen(value.sales)}
                ・${value.deliveries}件
              </div>
            </div>
          `)
          .join('');
    }

    async function loadAnalytics() {
      try {
        const data =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(
              activeAnalyticsPeriod
            )}`
          );

        const records =
          getRecordsFromData(data);

        renderSalesChart(records);
        renderDailyList(records);
        renderWeekdayList(records);
        renderHourList(records);

      } catch (error) {
        console.error(error);

        showToast(
          error.message ||
            '分析データの取得に失敗しました',
          'error'
        );
      }
    }

    /* =========================
       更新
    ========================== */

    function setupRefresh() {
      const button =
        document.getElementById(
          'refreshBtn'
        );

      if (!button) return;

      button.addEventListener(
        'click',
        async () => {
          button.disabled = true;

          try {
            if (
              activeSection ===
              'analytics'
            ) {
              await loadAnalytics();
            } else {
              await loadPersonal();
            }

            showToast('更新しました');

          } finally {
            button.disabled = false;
          }
        }
      );
    }

    /* =========================
       起動
    ========================== */

    async function initializeApp() {
      if (!tg?.initData) {
        document.getElementById(
          'userName'
        ).textContent =
          'Telegramアプリ内から開いてください';

        showToast(
          'Telegramアプリ内から開いてください',
          'error'
        );

        return;
      }

      setupNavigation();
      setupPeriodTabs();
      setupDetailsToggle();
      setupRefresh();

      await setupAddResultForm();
      await loadPersonal();
    }

    initializeApp();
  </script>
</body>
