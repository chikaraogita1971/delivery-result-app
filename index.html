<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配達リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      margin: 4px 0 16px;
      font-size: 24px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab {
      border: none;
      border-radius: 10px;
      padding: 10px 4px;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #222;
      color: white;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .main-value {
      font-size: 32px;
      font-weight: bold;
      margin: 6px 0;
    }

    .label {
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .item {
      background: #fafafa;
      border-radius: 10px;
      padding: 12px;
    }

    .value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .record {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record-left {
      flex: 1;
    }

    .record-date {
      font-size: 12px;
      color: #777;
      margin-bottom: 3px;
    }

    .record-main {
      font-weight: bold;
    }

    .record-sub {
      font-size: 12px;
      color: #777;
      margin-top: 3px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 12px 0;
    }

    .error {
      color: #c00;
      text-align: center;
      padding: 20px;
    }

    .loading {
      color: #777;
    }
  </style>
</head>

<body>
  <div class="app">

    <h1>🚶🚴 配達リザルト🏍️🛵</h1>

    <div class="tabs">
      <button class="tab" data-period="day">日</button>
      <button class="tab" data-period="week">週</button>
      <button class="tab active" data-period="month">月</button>
      <button class="tab" data-period="year">年</button>
    </div>

    <div class="card">
      <div class="label" id="period">今月の売上</div>
      <div class="main-value" id="sales">読み込み中...</div>
      <div class="label">
        配達件数 <span id="count">-</span>件
      </div>
    </div>

    <div class="grid">

      <div class="item">
        <div class="label">平均単価</div>
        <div class="value" id="average">¥0</div>
      </div>

      <div class="item">
        <div class="label">稼働時間</div>
        <div class="value" id="hours">0時間</div>
      </div>

      <div class="item">
        <div class="label">目標金額</div>
        <div class="value" id="goal">¥0</div>
      </div>

      <div class="item">
        <div class="label">達成率</div>
        <div class="value" id="rate">0%</div>
      </div>

    </div>

    <div class="card">
      <div class="section-title">📊 詳細分析</div>

      <div class="grid">

        <div class="item">
          <div class="label">稼働日数</div>
          <div class="value" id="workDays">0日</div>
        </div>

        <div class="item">
          <div class="label">1日平均売上</div>
          <div class="value" id="dailyAverage">¥0</div>
        </div>

        <div class="item">
          <div class="label">期間最高売上</div>
          <div class="value" id="maxSales">¥0</div>
        </div>

        <div class="item">
          <div class="label">期間最高件数</div>
          <div class="value" id="maxCount">0件</div>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="section-title">🚚 累計配達</div>
      <div class="main-value" id="totalCount">0件</div>
    </div>

    <div class="card">
      <div class="section-title">📋 配達記録</div>
      <div id="records">
        <div class="loading">データを読み込んでいます...</div>
      </div>
    </div>

    <div id="status" class="label" style="text-align:center; margin:12px 0;">
      読み込み中...
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    let currentPeriod = "month";

    function yen(value) {
      return "¥" + Number(value || 0).toLocaleString();
    }

    function periodText(period) {
      if (period === "day") return "今日の売上";
      if (period === "week") return "今週の売上";
      if (period === "year") return "今年の売上";
      return "今月の売上";
    }

    function formatDate(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderRecords(records) {
      const container = document.getElementById("records");

      if (!records || records.length === 0) {
        container.innerHTML =
          '<div class="empty">この期間の配達記録はありません。</div>';
        return;
      }

      container.innerHTML = records.map(record => `
        <div class="record">
          <div class="record-left">
            <div class="record-date">
              ${formatDate(record.createdAt)}
            </div>

            <div class="record-main">
              ${yen(record.sale)}
            </div>

            <div class="record-sub">
              ${record.count}件 / ${record.hours}時間
            </div>
          </div>
        </div>
      `).join("");
    }

    async function loadData(period) {
      try {
        const user = tg.initDataUnsafe?.user;

        if (!user?.id) {
          document.getElementById("status").textContent =
            "Telegramから開いてください。";
          return;
        }

        document.getElementById("sales").textContent = "読み込み中...";
        document.getElementById("count").textContent = "-";
        document.getElementById("hours").textContent = "0時間";
        document.getElementById("records").innerHTML =
          '<div class="loading">読み込み中...</div>';

        const response = await fetch(
          `/api/result?user_id=${encodeURIComponent(user.id)}&period=${encodeURIComponent(period)}`
        );

        if (!response.ok) {
          throw new Error("API error");
        }

        const data = await response.json();

        const sales = Number(data.sales || 0);
        const count = Number(data.count || 0);
        const hours = Number(data.hours || 0);
        const goal = Number(data.goal || 0);
        const workDays = Number(data.workDays || 0);
        const maxSales = Number(data.maxSales || 0);
        const maxCount = Number(data.maxCount || 0);
        const totalCount = Number(data.totalCount || 0);

        const average = Number(
          data.average !== undefined
            ? data.average
            : count > 0
              ? Math.round(sales / count)
              : 0
        );

        const rate = Number(data.rate || 0);

        const dailyAverage = workDays > 0
          ? Math.round(sales / workDays)
          : 0;

        document.getElementById("period").textContent =
          periodText(period);

        document.getElementById("sales").textContent =
          yen(sales);

        document.getElementById("count").textContent =
          count.toLocaleString();

        document.getElementById("average").textContent =
          yen(average);

        document.getElementById("hours").textContent =
          hours + "時間";

        document.getElementById("goal").textContent =
          yen(goal);

        document.getElementById("rate").textContent =
          rate + "%";

        document.getElementById("workDays").textContent =
          workDays + "日";

        document.getElementById("dailyAverage").textContent =
          yen(dailyAverage);

        document.getElementById("maxSales").textContent =
          yen(maxSales);

        document.getElementById("maxCount").textContent =
          maxCount.toLocaleString() + "件";

        document.getElementById("totalCount").textContent =
          totalCount.toLocaleString() + "件";

        renderRecords(data.records);

        document.getElementById("status").textContent =
          "データを読み込みました。";

      } catch (error) {
        console.error(error);

        document.getElementById("status").textContent =
          "データの読み込みに失敗しました。";

        document.getElementById("records").innerHTML =
          '<div class="error">データを取得できませんでした。</div>';
      }
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {

        document.querySelectorAll(".tab").forEach(tab => {
          tab.classList.remove("active");
        });

        button.classList.add("active");

        currentPeriod = button.dataset.period;

        loadData(currentPeriod);
      });
    });

    loadData(currentPeriod);
  </script>

</body>
</html>
