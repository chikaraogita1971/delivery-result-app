<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>配達リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      padding-bottom: 40px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      margin-bottom: 16px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      margin-top: 5px;
      color: #6b7280;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      padding: 10px 15px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .tab.active {
      background: #111827;
      color: #fff;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(17, 24, 39, 0.06);
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .period-btn {
      padding: 9px 5px;
      border-radius: 10px;
      background: #eef0f4;
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }

    .period-btn.active {
      background: #111827;
      color: #fff;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 14px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }

    .main-stat {
      background: #111827;
      color: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .main-stat-label {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 5px;
    }

    .main-stat-value {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .main-stat-sub {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.8;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .goal-info {
      font-size: 13px;
      color: #4b5563;
    }

    .goal-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .goal-input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    .goal-input:focus {
      border-color: #111827;
    }

    .primary-btn {
      padding: 12px 16px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 800;
    }

    .secondary-btn {
      padding: 11px 14px;
      border-radius: 10px;
      background: #eef0f4;
      color: #111827;
      font-weight: 700;
    }

    .danger-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: 800;
    }

    .progress-wrap {
      margin-top: 13px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: #111827;
      transition: width 0.35s ease;
    }

    .progress-text {
      margin-top: 7px;
      font-size: 12px;
      color: #6b7280;
      text-align: right;
    }

    .record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eef0f4;
    }

    .record:last-child {
      border-bottom: 0;
    }

    .record-left {
      min-width: 0;
    }

    .record-date {
      font-size: 13px;
      font-weight: 700;
    }

    .record-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #6b7280;
    }

    .record-sales {
      flex: 0 0 auto;
      font-size: 16px;
      font-weight: 800;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .analysis-box {
      background: #f8fafc;
      border-radius: 13px;
      padding: 12px;
    }

    .analysis-label {
      color: #6b7280;
      font-size: 11px;
      line-height: 1.4;
    }

    .analysis-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
    }

    .analysis-note {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 11px;
      background: #f8fafc;
      color: #4b5563;
      font-size: 12px;
      line-height: 1.6;
    }

    .loading {
      padding: 30px 10px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .empty {
      padding: 24px 10px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    .error {
      padding: 13px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-size: 10px;
      font-weight: 800;
      margin-left: 6px;
      vertical-align: middle;
    }

    @media (max-width: 420px) {
      .app {
        padding: 12px;
      }

      .main-stat-value {
        font-size: 30px;
      }

      .stat-value {
        font-size: 19px;
      }

      .analysis-value {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- =====================================================
         ヘッダー
    ====================================================== -->

    <header class="header">
      <div class="header-title">
        配達リザルト
        <span id="adminBadge" class="admin-badge hidden">
          ADMIN
        </span>
      </div>

      <div class="header-subtitle" id="userName">
        読み込み中…
      </div>
    </header>

    <!-- =====================================================
         タブ
         ※ グループ・ランキングは完全削除
    ====================================================== -->

    <div class="tabs">
      <button
        class="tab active"
        id="personalTab"
        type="button"
        onclick="showSection('personal')"
      >
        📊 個人実績
      </button>

      <button
        class="tab"
        id="analyticsTab"
        type="button"
        onclick="showSection('analytics')"
      >
        📈 分析
      </button>

      <button
        class="tab hidden"
        id="adminTab"
        type="button"
        onclick="showSection('admin')"
      >
        🔐 管理
      </button>
    </div>

    <!-- エラー -->
    <div
      id="error"
      class="error hidden"
    ></div>

    <!-- =====================================================
         個人実績
    ====================================================== -->

    <section id="personalSection">

      <div class="card">

        <div class="card-title">
          個人実績
        </div>

        <!-- 期間 -->
        <div class="period-tabs">

          <button
            class="period-btn active"
            data-period="today"
            type="button"
            onclick="changePeriod('today')"
          >
            今日
          </button>

          <button
            class="period-btn"
            data-period="week"
            type="button"
            onclick="changePeriod('week')"
          >
            今週
          </button>

          <button
            class="period-btn"
            data-period="month"
            type="button"
            onclick="changePeriod('month')"
          >
            今月
          </button>

          <button
            class="period-btn"
            data-period="year"
            type="button"
            onclick="changePeriod('year')"
          >
            年間
          </button>

        </div>

        <!-- 売上 -->
        <div class="main-stat">

          <div class="main-stat-label">
            売上
          </div>

          <div
            class="main-stat-value"
            id="salesValue"
          >
            0円
          </div>

          <div
            class="main-stat-sub"
            id="salesSub"
          >
            -
          </div>

        </div>

        <!-- 基本統計 -->
        <div class="stats-grid">

          <div class="stat-box">
            <div class="stat-label">
              配達
            </div>

            <div
              class="stat-value"
              id="countValue"
            >
              0件
            </div>
          </div>

          <div class="stat-box">
            <div class="stat-label">
              稼働
            </div>

            <div
              class="stat-value"
              id="hoursValue"
            >
              0h
            </div>
          </div>

          <div class="stat-box">
            <div class="stat-label">
              稼働日数
            </div>

            <div
              class="stat-value"
              id="workDaysValue"
            >
              0日
            </div>
          </div>

          <div class="stat-box">
            <div class="stat-label">
              時給
            </div>

            <div
              class="stat-value"
              id="hourlyValue"
            >
              0円
            </div>
          </div>

        </div>

      </div>

      <!-- =================================================
           月間目標
      ================================================== -->

      <div class="card">

        <div class="goal-header">

          <div class="card-title" style="margin:0;">
            🎯 月間目標
          </div>

          <div
            id="goalInfo"
            class="goal-info"
          >
            未設定
          </div>

        </div>

        <div
          id="goalProgressWrap"
          class="progress-wrap hidden"
        >

          <div class="progress-track">

            <div
              id="goalProgressBar"
              class="progress-bar"
            ></div>

          </div>

          <div
            id="goalProgressText"
            class="progress-text"
          >
            0 / 0件
          </div>

        </div>

        <div class="goal-form">

          <input
            id="goalInput"
            class="goal-input"
            type="number"
            min="1"
            max="1000000"
            inputmode="numeric"
            placeholder="例：300件"
          />

          <button
            class="primary-btn"
            type="button"
            onclick="saveGoal()"
          >
            設定
          </button>

        </div>

      </div>

      <!-- =================================================
           実績履歴
      ================================================== -->

      <div class="card">

        <div class="card-title">
          📝 実績履歴
        </div>

        <div
          id="records"
        >
          <div class="loading">
            読み込み中…
          </div>
        </div>

      </div>

      <!-- =================================================
           リセット
      ================================================== -->

      <div class="card">

        <div class="card-title">
          ⚙️ データ管理
        </div>

        <button
          class="danger-btn"
          type="button"
          onclick="resetData()"
        >
          自分の実績を全削除
        </button>

      </div>

    </section>

    <!-- =====================================================
         分析
    ====================================================== -->

    <section
      id="analyticsSection"
      class="hidden"
    >

      <div class="card">

        <div class="card-title">
          📈 個人分析
        </div>

        <div
          id="analyticsLoading"
          class="loading"
        >
          分析データを読み込み中…
        </div>

        <div
          id="analyticsContent"
          class="hidden"
        >

          <div class="analysis-grid">

            <div class="analysis-box">
              <div class="analysis-label">
                1日平均配達
              </div>

              <div
                class="analysis-value"
                id="analyticsAverageDailyCount"
              >
                0件
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                1日平均売上
              </div>

              <div
                class="analysis-value"
                id="analyticsAverageDailySales"
              >
                0円
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                現在の1日ペース
              </div>

              <div
                class="analysis-value"
                id="analyticsCurrentDailyPace"
              >
                0件
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                月末予測配達
              </div>

              <div
                class="analysis-value"
                id="analyticsProjectedMonthCount"
              >
                0件
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                月末予測売上
              </div>

              <div
                class="analysis-value"
                id="analyticsProjectedMonthSales"
              >
                0円
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                残り日数
              </div>

              <div
                class="analysis-value"
                id="analyticsRemainingDays"
              >
                0日
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                目標まで残り
              </div>

              <div
                class="analysis-value"
                id="analyticsRemainingGoalCount"
              >
                0件
              </div>
            </div>

            <div class="analysis-box">
              <div class="analysis-label">
                必要な1日配達
              </div>

              <div
                class="analysis-value"
                id="analyticsRequiredDailyCount"
              >
                0件
              </div>
            </div>

          </div>

          <div
            class="analysis-note"
            id="analyticsGoalRate"
          >
            目標達成率：0%
          </div>

          <div
            class="analysis-note"
            id="analyticsYesterdayCompare"
          >
            昨日比：-
          </div>

          <div
            class="analysis-note"
            id="analyticsUnitPrice"
          >
            平均単価：0円/件
          </div>

        </div>

      </div>

    </section>

    <!-- =====================================================
         管理者
    ====================================================== -->

    <section
      id="adminSection"
      class="hidden"
    >

      <div class="card">

        <div class="card-title">
          🔐 管理者統計
        </div>

        <div
          id="adminLoading"
          class="loading"
        >
          読み込み中…
        </div>

        <div
          id="adminContent"
          class="hidden"
        >

          <div class="stats-grid">

            <div class="stat-box">
              <div class="stat-label">
                登録実績
              </div>

              <div
                class="stat-value"
                id="adminRecords"
              >
                0
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                ユーザー
              </div>

              <div
                class="stat-value"
                id="adminUsers"
              >
                0
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                売上
              </div>

              <div
                class="stat-value"
                id="adminSales"
              >
                0円
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                配達
              </div>

              <div
                class="stat-value"
                id="adminCount"
              >
                0件
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                稼働
              </div>

              <div
                class="stat-value"
                id="adminHours"
              >
                0h
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                グループ
              </div>

              <div
                class="stat-value"
                id="adminGroups"
              >
                0
              </div>
            </div>

          </div>

          <div
            id="adminDetails"
            style="margin-top:14px;"
          ></div>

        </div>

      </div>

    </section>

  </div>
    <script>
    // =========================================================
    // Telegram
    // =========================================================

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // =========================================================
    // 状態
    // =========================================================

    let activeSection = "personal";
    let activePeriod = "today";

    const JST = "Asia/Tokyo";

    // =========================================================
    // 共通
    // =========================================================

    function formatNumber(value) {
      const number = Number(value || 0);

      return number.toLocaleString("ja-JP");
    }

    function formatHours(value) {
      const number = Number(value || 0);

      return Number.isInteger(number)
        ? String(number)
        : number.toFixed(2).replace(/\.?0+$/, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showError(message) {
      const box = document.getElementById("errorBox");

      box.textContent =
        message || "エラーが発生しました。";

      box.classList.remove("hidden");
    }

    function hideError() {
      document
        .getElementById("errorBox")
        .classList.add("hidden");
    }

    function getInitData() {
      return tg?.initData || "";
    }

    async function apiFetch(url, options = {}) {
      const headers = {
        ...(options.headers || {}),
        "X-Telegram-Init-Data": getInitData(),
      };

      const response = await fetch(url, {
        ...options,
        headers,
      });

      let data = null;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "APIレスポンスを読み込めませんでした"
        );
      }

      if (!response.ok) {
        throw new Error(
          data?.error ||
          `APIエラー: ${response.status}`
        );
      }

      return data;
    }

    function formatDateJST(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone: JST,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }
      ).format(date);
    }

    // =========================================================
    // ユーザー名
    // =========================================================

    function renderUserName() {
      const element =
        document.getElementById("userName");

      const user =
        tg?.initDataUnsafe?.user;

      if (!user) {
        element.textContent =
          "Telegramユーザー";
        return;
      }

      let name = "";

      if (user.first_name) {
        name += user.first_name;
      }

      if (user.last_name) {
        name += ` ${user.last_name}`;
      }

      if (!name && user.username) {
        name = `@${user.username}`;
      }

      element.textContent = name
        ? `${name} さん`
        : "Telegramユーザー";
    }

    // =========================================================
    // セクション切替
    // =========================================================

    function showSection(section) {
      activeSection = section;

      document
        .getElementById("personalSection")
        .classList.toggle(
          "hidden",
          section !== "personal"
        );

      document
        .getElementById("analyticsSection")
        .classList.toggle(
          "hidden",
          section !== "analytics"
        );

      document
        .getElementById("adminSection")
        .classList.toggle(
          "hidden",
          section !== "admin"
        );

      document
        .getElementById("personalTab")
        .classList.toggle(
          "active",
          section === "personal"
        );

      document
        .getElementById("analyticsTab")
        .classList.toggle(
          "active",
          section === "analytics"
        );

      document
        .getElementById("adminTab")
        .classList.toggle(
          "active",
          section === "admin"
        );

      hideError();

      if (section === "personal") {
        loadPersonal(activePeriod);
      }

      if (section === "analytics") {
        loadAnalytics();
      }

      if (section === "admin") {
        loadAdmin();
      }
    }

    // =========================================================
    // 期間
    // =========================================================

    function getBackendPeriod(period) {
      if (period === "today") {
        return "day";
      }

      return period;
    }

    function updatePeriodTabs(period) {
      document
        .getElementById("periodToday")
        .classList.toggle(
          "active",
          period === "today"
        );

      document
        .getElementById("periodWeek")
        .classList.toggle(
          "active",
          period === "week"
        );

      document
        .getElementById("periodMonth")
        .classList.toggle(
          "active",
          period === "month"
        );

      document
        .getElementById("periodYear")
        .classList.toggle(
          "active",
          period === "year"
        );
    }

    function getActivePeriod() {
      return activePeriod;
    }

    // =========================================================
    // 個人実績
    // =========================================================

    async function loadPersonal(
      period = "today"
    ) {
      activePeriod = period;

      updatePeriodTabs(period);

      const loading =
        document.getElementById(
          "personalLoading"
        );

      const content =
        document.getElementById(
          "personalContent"
        );

      loading.classList.remove("hidden");
      content.classList.add("hidden");

      hideError();

      try {
        const backendPeriod =
          getBackendPeriod(period);

        const data = await apiFetch(
          `/api/result?period=${encodeURIComponent(
            backendPeriod
          )}`
        );

        renderPersonal(data);

        loading.classList.add("hidden");
        content.classList.remove("hidden");

        await loadAnalytics();

      } catch (error) {
        console.error(error);

        loading.classList.add("hidden");
        content.classList.remove("hidden");

        showError(
          error.message ||
          "個人実績の取得に失敗しました。"
        );
      }
    }

    function renderPersonal(data) {
      const sales =
        Number(data?.sales || 0);

      const count =
        Number(data?.count || 0);

      const hours =
        Number(data?.hours || 0);

      const workDays =
        Number(data?.workDays || 0);

      const goal =
        Number(data?.goal || 0);

      document
        .getElementById("salesValue")
        .textContent =
        formatNumber(sales);

      document
        .getElementById("countValue")
        .textContent =
        formatNumber(count);

      document
        .getElementById("hoursValue")
        .textContent =
        formatHours(hours);

      document
        .getElementById("workDaysValue")
        .textContent =
        formatNumber(workDays);

      renderGoal(goal, count);

      renderRecords(
        data?.records || []
      );
    }

    // =========================================================
    // 月間目標
    // =========================================================

    function renderGoal(goal, count) {
      const info =
        document.getElementById(
          "goalInfo"
        );

      const wrap =
        document.getElementById(
          "goalProgressWrap"
        );

      if (!goal || goal <= 0) {
        info.textContent =
          "月間目標：未設定";

        wrap.classList.add("hidden");

        return;
      }

      info.textContent =
        `月間目標：${formatNumber(goal)}件`;

      if (activePeriod === "month") {
        updateGoalProgress(
          count,
          goal
        );
      } else {
        loadMonthlyGoalProgress(goal);
      }
    }

    async function loadMonthlyGoalProgress(
      goal
    ) {
      try {
        const data =
          await apiFetch(
            "/api/result?period=month"
          );

        const monthlyCount =
          Number(
            data?.count || 0
          );

        updateGoalProgress(
          monthlyCount,
          goal
        );

      } catch (error) {
        console.error(
          "monthly goal progress error:",
          error
        );

        document
          .getElementById(
            "goalProgressWrap"
          )
          .classList.add("hidden");
      }
    }

    function updateGoalProgress(
      count,
      goal
    ) {
      const wrap =
        document.getElementById(
          "goalProgressWrap"
        );

      const bar =
        document.getElementById(
          "goalProgressBar"
        );

      const text =
        document.getElementById(
          "goalProgressText"
        );

      if (!goal || goal <= 0) {
        wrap.classList.add("hidden");
        return;
      }

      const percentage =
        Math.min(
          100,
          Math.round(
            (count / goal) * 100
          )
        );

      bar.style.width =
        `${percentage}%`;

      text.textContent =
        `${formatNumber(count)} / ${formatNumber(goal)}件（${percentage}%）`;

      wrap.classList.remove("hidden");
    }

    async function saveGoal() {
      const input =
        document.getElementById(
          "goalInput"
        );

      const value =
        Number(input.value);

      if (
        !Number.isInteger(value) ||
        value <= 0
      ) {
        alert(
          "1以上の整数を入力してください。"
        );
        return;
      }

      if (value > 1000000) {
        alert(
          "月間目標は1,000,000件以下で入力してください。"
        );
        return;
      }

      try {
        const data =
          await apiFetch(
            "/api/goal",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body: JSON.stringify({
                monthlyGoal: value,
              }),
            }
          );

        if (!data?.ok) {
          throw new Error(
            data?.error ||
            "目標の保存に失敗しました"
          );
        }

        alert(
          `月間目標を ${formatNumber(
            data.monthlyGoal
          )} 件に設定しました。`
        );

        input.value = "";

        await loadPersonal(
          getActivePeriod()
        );

      } catch (error) {
        console.error(error);

        alert(
          error.message ||
          "月間目標の保存に失敗しました。"
        );
      }
    }

    // =========================================================
    // 実績履歴
    // =========================================================

    function renderRecords(records) {
      const container =
        document.getElementById(
          "records"
        );

      if (
        !Array.isArray(records) ||
        records.length === 0
      ) {
        container.innerHTML =
          `<div class="empty">実績はありません</div>`;

        return;
      }

      container.innerHTML =
        records
          .map((record) => {
            const sale =
              Number(
                record?.sale || 0
              );

            const count =
              Number(
                record?.count || 0
              );

            const hours =
              Number(
                record?.hours || 0
              );

            return `
              <div class="record">
                <div class="record-left">

                  <div class="record-date">
                    ${escapeHtml(
                      formatDateJST(
                        record?.createdAt
                      )
                    )}
                  </div>

                  <div class="record-meta">
                    ${formatNumber(count)}件
                    /
                    ${formatHours(hours)}時間
                  </div>

                </div>

                <div class="record-sales">
                  ${formatNumber(sale)}円
                </div>
              </div>
            `;
          })
          .join("");
    }

    // =========================================================
    // 分析ダッシュボード
    // =========================================================

    async function loadAnalytics() {
      const loading =
        document.getElementById(
          "analyticsLoading"
        );

      const content =
        document.getElementById(
          "analyticsContent"
        );

      if (!loading || !content) {
        return;
      }

      loading.classList.remove("hidden");
      content.classList.add("hidden");

      try {
        const data =
          await apiFetch(
            "/api/analytics"
          );

        renderAnalytics(data);

        loading.classList.add("hidden");
        content.classList.remove("hidden");

      } catch (error) {
        console.error(
          "analytics error:",
          error
        );

        loading.classList.add("hidden");
        content.classList.remove("hidden");

        const note =
          document.getElementById(
            "analyticsGoalRate"
          );

        if (note) {
          note.textContent =
            "分析データを取得できませんでした。";
        }
      }
    }

    function renderAnalytics(data) {
      const analysis =
        data?.analysis || {};

      const today =
        data?.today || {};

      const yesterday =
        data?.yesterday || {};

      const month =
        data?.month || {};

      document
        .getElementById(
          "analyticsAverageDailyCount"
        )
        .textContent =
        formatNumber(
          analysis.averageDailyCount
        );

      document
        .getElementById(
          "analyticsAverageDailySales"
        )
        .textContent =
        formatNumber(
          analysis.averageDailySales
        );

      document
        .getElementById(
          "analyticsCurrentDailyPace"
        )
        .textContent =
        formatNumber(
          analysis.currentDailyPace
        );

      document
        .getElementById(
          "analyticsProjectedMonthCount"
        )
        .textContent =
        formatNumber(
          analysis.projectedMonthCount
        );

      document
        .getElementById(
          "analyticsProjectedMonthSales"
        )
        .textContent =
        formatNumber(
          analysis.projectedMonthSales
        );

      document
        .getElementById(
          "analyticsRemainingDays"
        )
        .textContent =
        formatNumber(
          analysis.remainingDays
        );

      document
        .getElementById(
          "analyticsRemainingGoalCount"
        )
        .textContent =
        formatNumber(
          analysis.remainingGoalCount
        );

      document
        .getElementById(
          "analyticsRequiredDailyCount"
        )
        .textContent =
        formatNumber(
          analysis.requiredDailyCount
        );

      document
        .getElementById(
          "analyticsGoalRate"
        )
        .textContent =
        `目標達成率：${formatNumber(
          analysis.goalRate
        )}%`;

      const salesChange =
        Number(
          analysis.salesChangeFromYesterday ||
          0
        );

      const countChange =
        Number(
          analysis.countChangeFromYesterday ||
          0
        );

      const salesSign =
        salesChange > 0
          ? "+"
          : "";

      const countSign =
        countChange > 0
          ? "+"
          : "";

      document
        .getElementById(
          "analyticsYesterdayCompare"
        )
        .textContent =
        `昨日比：売上 ${salesSign}${formatNumber(
          salesChange
        )}円 / 配達 ${countSign}${formatNumber(
          countChange
        )}件`;

      document
        .getElementById(
          "analyticsUnitPrice"
        )
        .textContent =
        `平均単価：${formatNumber(
          analysis.averageUnitPrice
        )}円/件`;

      if (
        !analysis.averageDailyCount &&
        month.count
      ) {
        const fallbackDays =
          Math.max(
            1,
            Number(
              analysis.elapsedDays || 1
            )
          );

        document
          .getElementById(
            "analyticsAverageDailyCount"
          )
          .textContent =
          formatNumber(
            Number(month.count) /
            fallbackDays
          );
      }

      if (
        Number(today.count || 0) === 0 &&
        Number(yesterday.count || 0) === 0
      ) {
        document
          .getElementById(
            "analyticsYesterdayCompare"
          )
          .textContent =
          "昨日比：まだ比較できる実績がありません";
      }
    }
          // =========================================================
    // 管理者
    // =========================================================

    async function loadAdmin() {
      const loading =
        document.getElementById(
          "adminLoading"
        );

      const content =
        document.getElementById(
          "adminContent"
        );

      if (!loading || !content) {
        return;
      }

      loading.classList.remove("hidden");
      content.classList.add("hidden");

      try {
        const data =
          await apiFetch(
            "/api/admin"
          );

        renderAdmin(data);

        loading.classList.add("hidden");
        content.classList.remove("hidden");

      } catch (error) {
        console.error(
          "admin error:",
          error
        );

        loading.classList.add("hidden");
        content.classList.remove("hidden");

        document.getElementById(
          "adminDetails"
        ).innerHTML = `
          <div class="empty">
            管理者データを取得できませんでした。
          </div>
        `;
      }
    }

    function renderAdmin(data) {
      const total =
        data?.total || {};

      const month =
        data?.month || {};

      document.getElementById(
        "adminRecords"
      ).textContent =
        formatNumber(
          total.records
        );

      document.getElementById(
        "adminUsers"
      ).textContent =
        formatNumber(
          total.users
        );

      document.getElementById(
        "adminSales"
      ).textContent =
        `${formatNumber(
          total.sales
        )}円`;

      document.getElementById(
        "adminCount"
      ).textContent =
        `${formatNumber(
          total.count
        )}件`;

      document.getElementById(
        "adminHours"
      ).textContent =
        `${formatHours(
          total.hours
        )}時間`;

      document.getElementById(
        "adminDetails"
      ).innerHTML = `
        <div class="admin-detail">
          <div class="admin-detail-title">
            今月
          </div>

          <div class="admin-detail-row">
            <span>実績登録</span>
            <strong>
              ${formatNumber(
                month.records
              )}件
            </strong>
          </div>

          <div class="admin-detail-row">
            <span>アクティブユーザー</span>
            <strong>
              ${formatNumber(
                month.users
              )}人
            </strong>
          </div>

          <div class="admin-detail-row">
            <span>売上</span>
            <strong>
              ${formatNumber(
                month.sales
              )}円
            </strong>
          </div>

          <div class="admin-detail-row">
            <span>配達</span>
            <strong>
              ${formatNumber(
                month.count
              )}件
            </strong>
          </div>

          <div class="admin-detail-row">
            <span>稼働</span>
            <strong>
              ${formatHours(
                month.hours
              )}時間
            </strong>
          </div>
        </div>
      `;
    }

    // =========================================================
    // 自分のデータをリセット
    // =========================================================

    async function resetOwnData() {
      const confirmed =
        confirm(
          "自分の実績をすべて削除します。\n\nこの操作は元に戻せません。\n\n本当に削除しますか？"
        );

      if (!confirmed) {
        return;
      }

      const second =
        prompt(
          "削除を実行するには「削除」と入力してください。"
        );

      if (second !== "削除") {
        alert(
          "削除をキャンセルしました。"
        );

        return;
      }

      try {
        const data =
          await apiFetch(
            "/api/reset",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",
              },

              body: JSON.stringify({
                confirm: true,
              }),
            }
          );

        if (!data?.ok) {
          throw new Error(
            data?.error ||
            "データ削除に失敗しました"
          );
        }

        alert(
          "自分の実績を削除しました。"
        );

        await loadPersonal(
          "today"
        );

      } catch (error) {
        console.error(error);

        alert(
          error.message ||
          "データ削除に失敗しました。"
        );
      }
    }

    // =========================================================
    // 初期表示
    // =========================================================

    function bindEvents() {
      const personalTab =
        document.getElementById(
          "personalTab"
        );

      const analyticsTab =
        document.getElementById(
          "analyticsTab"
        );

      const adminTab =
        document.getElementById(
          "adminTab"
        );

      if (personalTab) {
        personalTab.addEventListener(
          "click",
          () => {
            showSection(
              "personal"
            );
          }
        );
      }

      if (analyticsTab) {
        analyticsTab.addEventListener(
          "click",
          () => {
            showSection(
              "analytics"
            );
          }
        );
      }

      if (adminTab) {
        adminTab.addEventListener(
          "click",
          () => {
            showSection(
              "admin"
            );
          }
        );
      }

      const periodButtons = [
        [
          "periodToday",
          "today",
        ],
        [
          "periodWeek",
          "week",
        ],
        [
          "periodMonth",
          "month",
        ],
        [
          "periodYear",
          "year",
        ],
      ];

      periodButtons.forEach(
        ([id, period]) => {
          const button =
            document.getElementById(id);

          if (!button) {
            return;
          }

          button.addEventListener(
            "click",
            () => {
              loadPersonal(
                period
              );
            }
          );
        }
      );

      const goalButton =
        document.getElementById(
          "saveGoalButton"
        );

      if (goalButton) {
        goalButton.addEventListener(
          "click",
          saveGoal
        );
      }

      const resetButton =
        document.getElementById(
          "resetOwnButton"
        );

      if (resetButton) {
        resetButton.addEventListener(
          "click",
          resetOwnData
        );
      }
    }

    async function initialize() {
      try {
        renderUserName();

        bindEvents();

        showSection(
          "personal"
        );

      } catch (error) {
        console.error(
          "initialize error:",
          error
        );

        showError(
          "アプリの初期化に失敗しました。"
        );
      }
    }

    // =========================================================
    // 起動
    // =========================================================

    document.addEventListener(
      "DOMContentLoaded",
      initialize
    );
  </script>

</body>
