<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>個人テレグラムリザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-title {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
    }

    .user-name {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .refresh-button {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 20px;
    }

    .refresh-button:active {
      transform: scale(0.97);
    }

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      padding: 4px;
      background: #e9edf5;
      border-radius: 12px;
    }

    .period-tab {
      border: 0;
      border-radius: 9px;
      padding: 10px 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .details-toggle {
      width: 100%;
      margin-top: 12px;
      padding: 10px 0;
      border: 0;
      background: transparent;
      color: var(--primary);
      text-align: left;
      font-weight: 700;
    }

    .details-content {
      display: none;
      margin-top: 4px;
    }

    .details-content.open {
      display: block;
    }

    .save-button {
      width: 100%;
      min-height: 46px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .save-button:active {
      background: var(--primary-dark);
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #fef2f2;
      color: var(--danger);
    }

    .status.success {
      background: #f0fdf4;
      color: var(--success);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .analysis-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .analysis-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .analysis-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
    }

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .record-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .record-sale {
      font-size: 18px;
      font-weight: 800;
    }

    .record-date {
      color: var(--muted);
      font-size: 12px;
    }

    .record-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 12px;
      margin-top: 8px;
      color: #4b5563;
      font-size: 13px;
    }

    .empty {
      padding: 20px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .loading {
      padding: 20px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .summary-grid,
      .analysis-grid {
        grid-template-columns: 1fr 1fr;
      }

      .period-tab {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="header-title">
        <h1 class="title">📦 個人テレグラムリザルト</h1>
        <div id="userName" class="user-name"></div>
      </div>

      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
        aria-label="更新"
      >
        ↻
      </button>
    </header>

    <nav class="period-tabs" aria-label="期間">
      <button
        class="period-tab active"
        type="button"
        data-period="today"
      >
        今日
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="week"
      >
        今週
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="month"
      >
        今月
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="all"
      >
        全期間
      </button>
    </nav>

    <section class="card">
      <h2 class="card-title">実績を追加</h2>

      <div class="form-grid">
        <div class="form-group">
          <label for="saleAmountInput">売上（円）</label>
          <input
            id="saleAmountInput"
            type="number"
            inputmode="numeric"
            min="0"
            step="1"
            placeholder="5000"
          />
        </div>

        <div class="form-group">
          <label for="deliveryCountInput">配達件数</label>
          <input
            id="deliveryCountInput"
            type="number"
            inputmode="numeric"
            min="0"
            step="1"
            placeholder="5"
          />
        </div>
      </div>

      <button
        id="detailsToggle"
        class="details-toggle"
        type="button"
      >
        詳細設定（任意）＋
      </button>

      <div id="detailsContent" class="details-content">
        <div class="form-grid">

          <div class="form-group">
            <label for="workStartTimeInput">稼働開始時刻</label>
            <input
              id="workStartTimeInput"
              type="time"
            />
          </div>

          <div class="form-group">
            <label for="workHoursInput">稼働時間（時間）</label>
            <input
              id="workHoursInput"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.1"
              placeholder="5.5"
            />
          </div>

          <div class="form-group">
            <label for="distanceInput">走行距離（km）</label>
            <input
              id="distanceInput"
              type="number"
              inputmode="decimal"
              min="0"
              step="0.1"
              placeholder="30"
            />
          </div>

          <div class="form-group">
            <label for="expenseInput">経費（円）</label>
            <input
              id="expenseInput"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              placeholder="500"
            />
          </div>

        </div>
      </div>

      <button
        id="saveButton"
        class="save-button"
        type="button"
      >
        実績を保存
      </button>

      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <h2 class="card-title">集計</h2>

      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">売上</div>
          <div id="summarySales" class="summary-value">¥0</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">配達件数</div>
          <div id="summaryDeliveries" class="summary-value">0件</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">稼働時間</div>
          <div id="summaryHours" class="summary-value">0時間</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">時給</div>
          <div id="summaryHourly" class="summary-value">¥0</div>
        </div>

        <div class="summary-item">
          <div class="summary-label">平均単価</div>
          <div id="summaryUnitPrice" class="summary-value">¥0</div>
        </div>
      </div>
    </section>
        <section class="card">
      <h2 class="card-title">📊 効率分析</h2>

      <div class="analysis-grid">
        <div class="analysis-item">
          <div class="analysis-label">1件あたり売上</div>
          <div id="analysisPerDelivery" class="analysis-value">¥0</div>
        </div>

        <div class="analysis-item">
          <div class="analysis-label">1時間あたり件数</div>
          <div id="analysisDeliveriesPerHour" class="analysis-value">0件</div>
        </div>

        <div class="analysis-item">
          <div class="analysis-label">1kmあたり売上</div>
          <div id="analysisSalesPerKm" class="analysis-value">—</div>
        </div>

        <div class="analysis-item">
          <div class="analysis-label">経費</div>
          <div id="analysisExpense" class="analysis-value">¥0</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">実績一覧</h2>

      <div id="recordList" class="record-list">
        <div class="loading">読み込み中...</div>
      </div>
    </section>

  </div>

  <script>
    const tg = window.Telegram?.WebApp || null;

    let currentPeriod = "today";
    let currentData = null;

    function formatYen(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "¥0";
      }

      return `¥${Math.round(number).toLocaleString("ja-JP")}`;
    }

    function formatNumber(value, digits = 1) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "0";
      }

      return number.toLocaleString("ja-JP", {
        maximumFractionDigits: digits
      });
    }

    function showStatus(message, type = "error") {
      const status = document.getElementById("status");

      if (!status) {
        return;
      }

      status.textContent = message;
      status.className = `status show ${type}`;
    }

    function clearStatus() {
      const status = document.getElementById("status");

      if (!status) {
        return;
      }

      status.textContent = "";
      status.className = "status";
    }

    async function readApiResponse(response) {
      const text = await response.text();

      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch (error) {
        throw new Error(
          `APIの応答を読み取れませんでした（HTTP ${response.status}）`
        );
      }

      if (!response.ok || data?.ok === false) {
        throw new Error(
          data?.error ||
          data?.message ||
          `APIエラー（HTTP ${response.status}）`
        );
      }

      return data;
    }

    async function apiFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});

      if (tg?.initData) {
        headers.set("X-Telegram-Init-Data", tg.initData);
      }

      if (
        options.body &&
        typeof options.body === "string" &&
        !headers.has("Content-Type")
      ) {
        headers.set("Content-Type", "application/json");
      }

      return fetch(url, {
        ...options,
        headers
      });
    }

    function getRecordsFromData(data) {
      if (!data) {
        return [];
      }

      if (Array.isArray(data)) {
        return data;
      }

      // API /api/result の正式な実績一覧
      if (Array.isArray(data.recentResults)) {
        return data.recentResults;
      }

      if (Array.isArray(data.records)) {
        return data.records;
      }

      if (Array.isArray(data.results)) {
        return data.results;
      }

      if (Array.isArray(data.data)) {
        return data.data;
      }

      return [];
    }

    function getSummaryFromRecords(records) {
      let sales = 0;
      let deliveries = 0;
      let hours = 0;
      let distance = 0;
      let expense = 0;

      for (const record of records) {
        sales += Number(
          record.saleAmount ??
          record.sales ??
          record.sale_amount ??
          0
        );

        deliveries += Number(
          record.deliveryCount ??
          record.deliveries ??
          record.delivery_count ??
          0
        );

        hours += Number(
          record.workHours ??
          record.hours ??
          record.work_hours ??
          0
        );

        distance += Number(
          record.distanceKm ??
          record.distance ??
          record.distance_km ??
          0
        );

        expense += Number(
          record.expense ??
          record.expenseAmount ??
          record.expense_amount ??
          0
        );
      }

      return {
        sales: Number.isFinite(sales) ? sales : 0,
        deliveries: Number.isFinite(deliveries) ? deliveries : 0,
        hours: Number.isFinite(hours) ? hours : 0,
        distance: Number.isFinite(distance) ? distance : 0,
        expense: Number.isFinite(expense) ? expense : 0
      };
    }

    function getSummaryValues(data) {
      const records =
        getRecordsFromData(data);

      // API /api/result が返す正式な集計
      const stats =
        data?.stats || {};

      const fallback =
        getSummaryFromRecords(records);

      const sales =
        Number(
          stats.saleAmount ??
          stats.sales ??
          stats.sale_amount ??
          fallback.sales ??
          0
        );

      const deliveries =
        Number(
          stats.deliveryCount ??
          stats.deliveries ??
          stats.delivery_count ??
          fallback.deliveries ??
          0
        );

      const hours =
        Number(
          stats.workHours ??
          stats.hours ??
          stats.work_hours ??
          fallback.hours ??
          0
        );

      const distance =
        Number(
          stats.distanceKm ??
          stats.distance ??
          stats.distance_km ??
          fallback.distance ??
          0
        );

      const expense =
        Number(
          stats.expense ??
          stats.expenseAmount ??
          stats.expense_amount ??
          fallback.expense ??
          0
        );

      return {
        sales: Number.isFinite(sales) ? sales : 0,
        deliveries: Number.isFinite(deliveries) ? deliveries : 0,
        hours: Number.isFinite(hours) ? hours : 0,
        distance: Number.isFinite(distance) ? distance : 0,
        expense: Number.isFinite(expense) ? expense : 0
      };
    }

    function renderSummary(data) {
      const summary =
        getSummaryValues(data);

      const hourly =
        summary.hours > 0
          ? summary.sales / summary.hours
          : 0;

      const unitPrice =
        summary.deliveries > 0
          ? summary.sales / summary.deliveries
          : 0;

      document.getElementById("summarySales").textContent =
        formatYen(summary.sales);

      document.getElementById("summaryDeliveries").textContent =
        `${formatNumber(summary.deliveries, 0)}件`;

      document.getElementById("summaryHours").textContent =
        `${formatNumber(summary.hours, 1)}時間`;

      document.getElementById("summaryHourly").textContent =
        formatYen(hourly);

      document.getElementById("summaryUnitPrice").textContent =
        formatYen(unitPrice);

      renderEfficiency(summary);
    }

    function renderEfficiency(summary) {
      const perDelivery =
        summary.deliveries > 0
          ? summary.sales / summary.deliveries
          : 0;

      const deliveriesPerHour =
        summary.hours > 0
          ? summary.deliveries / summary.hours
          : 0;

      const salesPerKm =
        summary.distance > 0
          ? summary.sales / summary.distance
          : null;

      document.getElementById(
        "analysisPerDelivery"
      ).textContent = formatYen(perDelivery);

      document.getElementById(
        "analysisDeliveriesPerHour"
      ).textContent =
        `${formatNumber(deliveriesPerHour, 1)}件`;

      document.getElementById(
        "analysisSalesPerKm"
      ).textContent =
        salesPerKm === null
          ? "—"
          : formatYen(salesPerKm);

      document.getElementById(
        "analysisExpense"
      ).textContent =
        formatYen(summary.expense);
    }

    function getRecordValue(record, keys, fallback = 0) {
      for (const key of keys) {
        if (
          record &&
          record[key] !== undefined &&
          record[key] !== null
        ) {
          return record[key];
        }
      }

      return fallback;
    }

    function formatRecordDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString("ja-JP", {
        timeZone: "Asia/Tokyo",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderRecords(records) {
      const container =
        document.getElementById("recordList");

      if (!container) {
        return;
      }

      if (!records.length) {
        container.innerHTML =
          '<div class="empty">まだ実績がありません</div>';
        return;
      }

      container.innerHTML =
        records.map((record) => {
          const saleAmount =
            Number(
              getRecordValue(
                record,
                [
                  "saleAmount",
                  "sales",
                  "sale_amount"
                ],
                0
              )
            );

          const deliveryCount =
            Number(
              getRecordValue(
                record,
                [
                  "deliveryCount",
                  "deliveries",
                  "delivery_count"
                ],
                0
              )
            );

          const workHours =
            Number(
              getRecordValue(
                record,
                [
                  "workHours",
                  "hours",
                  "work_hours"
                ],
                0
              )
            );

          const distanceKm =
            Number(
              getRecordValue(
                record,
                [
                  "distanceKm",
                  "distance",
                  "distance_km"
                ],
                0
              )
            );

          const expense =
            Number(
              getRecordValue(
                record,
                [
                  "expense",
                  "expenseAmount",
                  "expense_amount"
                ],
                0
              )
            );

          const createdAt =
            getRecordValue(
              record,
              [
                "createdAt",
                "created_at"
              ],
              ""
            );

          const workStartedAt =
            getRecordValue(
              record,
              [
                "workStartedAt",
                "work_started_at"
              ],
              ""
            );

          const details = [];

          details.push(
            `配達 ${formatNumber(deliveryCount, 0)}件`
          );

          if (workHours > 0) {
            details.push(
              `稼働 ${formatNumber(workHours, 1)}時間`
            );
          }

          if (distanceKm > 0) {
            details.push(
              `距離 ${formatNumber(distanceKm, 1)}km`
            );
          }

          if (expense > 0) {
            details.push(
              `経費 ${formatYen(expense)}`
            );
          }

          if (workStartedAt) {
            details.push(
              `開始 ${formatRecordDate(workStartedAt)}`
            );
          }

          return `
            <div class="record-item">
              <div class="record-main">
                <div class="record-sale">
                  ${formatYen(saleAmount)}
                </div>

                <div class="record-date">
                  ${formatRecordDate(createdAt)}
                </div>
              </div>

              <div class="record-details">
                ${details
                  .map((detail) => `<div>${detail}</div>`)
                  .join("")}
              </div>
            </div>
          `;
        }).join("");
    }
        function getPeriodQuery(period) {
      if (period === "today") {
        return "today";
      }

      if (period === "week") {
        return "week";
      }

      if (period === "month") {
        return "month";
      }

      if (period === "all") {
        return "all";
      }

      return "today";
    }

    async function loadPersonal() {
      const recordList =
        document.getElementById("recordList");

      if (recordList) {
        recordList.innerHTML =
          '<div class="loading">読み込み中...</div>';
      }

      try {
        const query =
          getPeriodQuery(currentPeriod);

        const response =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(query)}`
          );

        const data =
          await readApiResponse(response);

        currentData = data;

        renderSummary(data);

        const records =
          getRecordsFromData(data);

        renderRecords(records);

        if (data.user) {
          const firstName =
            data.user.firstName || "";

          const lastName =
            data.user.lastName || "";

          const username =
            data.user.username
              ? `@${data.user.username}`
              : "";

          const displayName =
            `${lastName}${firstName}`.trim() ||
            username ||
            "ユーザー";

          document.getElementById(
            "userName"
          ).textContent =
            `${displayName}さん`;
        }

        clearStatus();
      } catch (error) {
        console.error(error);

        if (recordList) {
          recordList.innerHTML =
            `<div class="empty">${escapeHtml(
              error.message ||
              "読み込みに失敗しました"
            )}</div>`;
        }

        showStatus(
          error.message ||
          "データの読み込みに失敗しました",
          "error"
        );
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setupPeriodTabs() {
      const tabs =
        document.querySelectorAll(
          ".period-tab"
        );

      tabs.forEach((tab) => {
        tab.addEventListener(
          "click",
          async () => {
            const period =
              tab.dataset.period;

            if (!period) {
              return;
            }

            currentPeriod = period;

            tabs.forEach((item) => {
              item.classList.toggle(
                "active",
                item === tab
              );
            });

            await loadPersonal();
          }
        );
      });
    }

    function setupDetailsToggle() {
      const toggle =
        document.getElementById(
          "detailsToggle"
        );

      const content =
        document.getElementById(
          "detailsContent"
        );

      if (!toggle || !content) {
        return;
      }

      toggle.addEventListener(
        "click",
        () => {
          const open =
            content.classList.toggle(
              "open"
            );

          toggle.textContent =
            open
              ? "詳細設定（任意）−"
              : "詳細設定（任意）＋";
        }
      );
    }

    function setupRefresh() {
      const button =
        document.getElementById(
          "refreshButton"
        );

      if (!button) {
        return;
      }

      button.addEventListener(
        "click",
        async () => {
          button.disabled = true;

          try {
            await loadPersonal();
          } finally {
            button.disabled = false;
          }
        }
      );
    }

    function buildWorkStartedAt(
      timeValue
    ) {
      if (!timeValue) {
        return null;
      }

      const parts =
        timeValue.split(":");

      if (parts.length < 2) {
        return null;
      }

      const hours =
        Number(parts[0]);

      const minutes =
        Number(parts[1]);

      if (
        !Number.isInteger(hours) ||
        !Number.isInteger(minutes) ||
        hours < 0 ||
        hours > 23 ||
        minutes < 0 ||
        minutes > 59
      ) {
        return null;
      }

      const now =
        new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");

      const hh =
        String(hours).padStart(2, "0");

      const mm =
        String(minutes).padStart(2, "0");

      return (
        `${year}-${month}-${day}` +
        `T${hh}:${mm}:00+09:00`
      );
    }

    function getOptionalNumber(
      elementId
    ) {
      const element =
        document.getElementById(
          elementId
        );

      if (!element) {
        return undefined;
      }

      const value =
        element.value.trim();

      if (value === "") {
        return undefined;
      }

      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return undefined;
      }

      return number;
    }

    async function saveResult() {
      clearStatus();

      const saleAmountInput =
        document.getElementById(
          "saleAmountInput"
        );

      const deliveryCountInput =
        document.getElementById(
          "deliveryCountInput"
        );

      const saveButton =
        document.getElementById(
          "saveButton"
        );

      const saleAmount =
        Number(
          saleAmountInput.value
        );

      const deliveryCount =
        Number(
          deliveryCountInput.value
        );

      if (
        !Number.isFinite(saleAmount) ||
        saleAmount < 0
      ) {
        showStatus(
          "売上を正しく入力してください",
          "error"
        );
        return;
      }

      if (
        !Number.isFinite(deliveryCount) ||
        deliveryCount < 0
      ) {
        showStatus(
          "配達件数を正しく入力してください",
          "error"
        );
        return;
      }

      const workHours =
        getOptionalNumber(
          "workHoursInput"
        );

      const distanceKm =
        getOptionalNumber(
          "distanceInput"
        );

      const expenseAmount =
        getOptionalNumber(
          "expenseInput"
        );

      const workStartedAt =
        buildWorkStartedAt(
          document.getElementById(
            "workStartTimeInput"
          )?.value || ""
        );

      if (
        workHours !== undefined &&
        workHours < 0
      ) {
        showStatus(
          "稼働時間を正しく入力してください",
          "error"
        );
        return;
      }

      if (
        distanceKm !== undefined &&
        distanceKm < 0
      ) {
        showStatus(
          "走行距離を正しく入力してください",
          "error"
        );
        return;
      }

      if (
        expenseAmount !== undefined &&
        expenseAmount < 0
      ) {
        showStatus(
          "経費を正しく入力してください",
          "error"
        );
        return;
      }

      const body = {
        saleAmount:
          Math.round(saleAmount),

        deliveryCount:
          Math.round(deliveryCount)
      };

      if (
        workHours !== undefined
      ) {
        body.workHours =
          workHours;
      }

      if (
        distanceKm !== undefined
      ) {
        body.distanceKm =
          distanceKm;
      }

      // API は expense を受け取る
      if (
        expenseAmount !== undefined
      ) {
        body.expense =
          Math.round(expenseAmount);
      }

      if (workStartedAt) {
        body.workStartedAt =
          workStartedAt;
      }

      saveButton.disabled = true;
      saveButton.textContent =
        "保存中...";

      try {
        const response =
          await apiFetch(
            "/api/result",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify(body)
            }
          );

        await readApiResponse(
          response
        );

        saleAmountInput.value = "";
        deliveryCountInput.value = "";

        document.getElementById(
          "workStartTimeInput"
        ).value = "";

        document.getElementById(
          "workHoursInput"
        ).value = "";

        document.getElementById(
          "distanceInput"
        ).value = "";

        document.getElementById(
          "expenseInput"
        ).value = "";

        showStatus(
          "実績を保存しました",
          "success"
        );

        await loadPersonal();
      } catch (error) {
        console.error(error);

        showStatus(
          error.message ||
          "実績の保存に失敗しました",
          "error"
        );
      } finally {
        saveButton.disabled = false;
        saveButton.textContent =
          "実績を保存";
      }
    }

    function setupSave() {
      const button =
        document.getElementById(
          "saveButton"
        );

      if (!button) {
        return;
      }

      button.addEventListener(
        "click",
        saveResult
      );
    }

    function initializeTelegram() {
      if (!tg) {
        showStatus(
          "Telegram Mini App から開いてください",
          "error"
        );

        return false;
      }

      try {
        tg.ready();
        tg.expand();
      } catch (error) {
        console.error(error);
      }

      return true;
    }

    function initialize() {
      setupPeriodTabs();
      setupDetailsToggle();
      setupRefresh();
      setupSave();

      const telegramReady =
        initializeTelegram();

      if (!telegramReady) {
        return;
      }

      loadPersonal();
    }

    document.addEventListener(
      "DOMContentLoaded",
      initialize
    );
  </script>
</body>
</html>
