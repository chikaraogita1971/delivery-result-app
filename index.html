<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>📦 配達リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f5f7fb;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      padding-bottom: 32px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }

    /* =====================================================
       Header
    ===================================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .header-left {
      min-width: 0;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .user-name {
      margin-top: 4px;
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .refresh-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: #f3f4f6;
      color: #374151;
      font-size: 18px;
    }

    /* =====================================================
       Navigation
    ===================================================== */

    .main-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .main-tab {
      min-height: 46px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
      color: #6b7280;
      font-size: 14px;
      font-weight: 700;
    }

    .main-tab.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .main-tab.admin-tab {
      display: none;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* =====================================================
       Period
    ===================================================== */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .period-tab {
      min-height: 42px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* =====================================================
       Cards
    ===================================================== */

    .card {
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .card-subtitle {
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }

    /* =====================================================
       Hero
    ===================================================== */

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .hero-card {
      padding: 16px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .hero-label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-value {
      margin-top: 7px;
      font-size: 27px;
      line-height: 1.1;
      font-weight: 900;
    }

    .hero-unit {
      margin-left: 3px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
    }

    /* =====================================================
       Stats
    ===================================================== */

    .stats-grid,
    .highlight-grid,
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-box,
    .highlight,
    .analytics-item {
      padding: 14px;
      background: #f9fafb;
      border-radius: 14px;
    }

    .stat-label,
    .highlight-label,
    .analytics-item-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .stat-value,
    .highlight-value,
    .analytics-item-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 900;
    }

    .highlight-icon {
      font-size: 19px;
    }

    .highlight-label {
      margin-top: 6px;
    }

    .analytics-item {
      background: #fff;
      border: 1px solid #e5e7eb;
    }

    .analytics-item-value {
      font-size: 19px;
    }

    .analytics-item-sub {
      margin-top: 3px;
      color: #9ca3af;
      font-size: 10px;
    }

    /* =====================================================
       Records
    ===================================================== */

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 13px;
    }

    .record-date {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .record-main {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 800;
    }

    .record-side {
      flex-shrink: 0;
      text-align: right;
    }

    .record-sales {
      font-size: 14px;
      font-weight: 850;
    }

    .record-hours {
      margin-top: 2px;
      color: #6b7280;
      font-size: 11px;
    }

    /* =====================================================
       Analytics
    ===================================================== */

    .analytics-section-title {
      margin: 18px 2px 8px;
      color: #374151;
      font-size: 13px;
      font-weight: 900;
    }

    .pace-card {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .pace-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .pace-value {
      font-size: 28px;
      font-weight: 900;
    }

    .pace-unit {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
    }

    .pace-detail {
      margin-top: 8px;
      color: #475569;
      font-size: 12px;
      line-height: 1.7;
    }

    /* =====================================================
       Record Banner
    ===================================================== */

    .record-banner {
      display: none;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 16px;
    }

    .record-banner.show {
      display: block;
    }

    .record-banner-title {
      color: #9a3412;
      font-size: 15px;
      font-weight: 900;
    }

    .record-banner-text {
      margin-top: 4px;
      color: #c2410c;
      font-size: 12px;
      font-weight: 600;
    }

    /* =====================================================
       Loading / Error
    ===================================================== */

    .loading,
    .empty,
    .error-box {
      padding: 24px 14px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    .error-box {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 14px;
    }

    /* =====================================================
       Admin
    ===================================================== */

    .danger-btn {
      width: 100%;
      min-height: 46px;
      border: 1px solid #fecaca;
      border-radius: 13px;
      background: #fff1f2;
      color: #be123c;
      font-size: 13px;
      font-weight: 800;
    }

    /* =====================================================
       Responsive
    ===================================================== */

    @media (max-width: 420px) {
      .app {
        padding: 10px;
      }

      .hero-value {
        font-size: 24px;
      }

      .analytics-item-value {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ===================================================
       Header
  ==================================================== -->

  <header class="header">

    <div class="header-left">

      <h1 class="app-title">
        📦 配達リザルト
      </h1>

      <div
        id="userName"
        class="user-name"
      >
        読み込み中...
      </div>

    </div>

    <button
      id="refreshBtn"
      class="refresh-btn"
      type="button"
      aria-label="更新"
    >
      🔄
    </button>

  </header>


  <!-- ===================================================
       Main Tabs
  ==================================================== -->

  <nav class="main-tabs">

    <button
      class="main-tab active"
      data-section="personal"
      type="button"
    >
      📊 個人実績
    </button>

    <button
      class="main-tab"
      data-section="analytics"
      type="button"
    >
      📈 分析
    </button>

    <button
      id="adminTab"
      class="main-tab admin-tab"
      data-section="admin"
      type="button"
    >
      🛠 管理
    </button>

  </nav>


  <!-- ===================================================
       Personal
  ==================================================== -->

  <section
    id="personalSection"
    class="section active"
  >

    <div class="period-tabs">

      <button
        class="period-tab active"
        data-period="today"
        type="button"
      >
        今日
      </button>

      <button
        class="period-tab"
        data-period="week"
        type="button"
      >
        今週
      </button>

      <button
        class="period-tab"
        data-period="month"
        type="button"
      >
        今月
      </button>

      <button
        class="period-tab"
        data-period="year"
        type="button"
      >
        年間
      </button>

    </div>


    <div
      id="recordBanner"
      class="record-banner"
    >

      <div
        id="recordBannerTitle"
        class="record-banner-title"
      ></div>

      <div
        id="recordBannerText"
        class="record-banner-text"
      ></div>

    </div>


    <div
      id="personalHero"
      class="hero-grid"
    >

      <div class="loading">
        読み込み中...
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        📊 基本実績
      </div>

      <div
        id="personalStatsGrid"
        class="stats-grid"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        🔥 今日のハイライト
      </div>

      <div
        id="todayHighlights"
        class="highlight-grid"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        🏆 今月最高記録
      </div>

      <div
        id="monthlyBest"
        class="highlight-grid"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        🔥 連続稼働
      </div>

      <div
        id="streakCard"
        class="highlight-grid"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-title">

        📝 実績履歴

        <span
          id="recordsPeriodLabel"
          class="card-subtitle"
        >
          今日
        </span>

      </div>

      <div
        id="records"
        class="record-list"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>


    <div class="card">

      <button
        id="resetBtn"
        class="danger-btn"
        type="button"
      >
        🗑 自分の実績をリセット
      </button>

    </div>

  </section>


  <!-- ===================================================
       Analytics
  ==================================================== -->

  <section
    id="analyticsSection"
    class="section"
  >

    <div class="card">

      <div class="card-title">

        📈 個人分析

        <span
          id="analyticsDateLabel"
          class="card-subtitle"
        ></span>

      </div>

      <div
        id="analyticsLoading"
        class="loading"
        style="display:none;"
      >
        読み込み中...
      </div>

    </div>


    <div class="analytics-section-title">
      ⚡ 今日のパフォーマンス
    </div>

    <div
      id="todayAnalytics"
      class="analytics-grid"
    >

      <div class="loading">
        読み込み中...
      </div>

    </div>


    <div class="analytics-section-title">
      📊 ペース分析
    </div>

    <div
      id="paceAnalytics"
      class="card pace-card"
    >

      <div class="loading">
        読み込み中...
      </div>

    </div>


    <div class="analytics-section-title">
      🏆 自己ベスト
    </div>

    <div
      id="bestAnalytics"
      class="analytics-grid"
    >

      <div class="loading">
        読み込み中...
      </div>

    </div>


    <div class="analytics-section-title">
      🔄 前月・前日比較
    </div>

    <div
      id="comparisonAnalytics"
      class="analytics-grid"
    >

      <div class="loading">
        読み込み中...
      </div>

    </div>


    <div class="analytics-section-title">
      📅 今月の日別推移
    </div>

    <div class="card">

      <div
        id="dailyAnalytics"
        class="record-list"
      >

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>

  </section>


  <!-- ===================================================
       Admin
  ==================================================== -->

  <section
    id="adminSection"
    class="section"
  >

    <div class="card">

      <div class="card-title">
        🛠 管理
      </div>

      <div id="adminContent">

        <div class="loading">
          読み込み中...
        </div>

      </div>

    </div>

  </section>

</div>


<script>

  /* =====================================================
     Telegram
  ===================================================== */

  const tg =
    window.Telegram?.WebApp || null;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  /* =====================================================
     State
  ===================================================== */

  let activeSection = "personal";
  let activePeriod = "today";
  let currentPersonal = null;
  let currentAnalytics = null;
  let isAdmin = false;


  /* =====================================================
     DOM
  ===================================================== */

  function byId(id) {
    return document.getElementById(id);
  }

  function setText(id, value) {
    const el = byId(id);

    if (!el) {
      return;
    }

    el.textContent =
      value === null ||
      value === undefined
        ? ""
        : String(value);
  }

  function showLoading(id) {
    const el = byId(id);

    if (!el) {
      return;
    }

    el.innerHTML =
      `<div class="loading">読み込み中...</div>`;
  }

  function showEmpty(
    id,
    message = "データがありません"
  ) {
    const el = byId(id);

    if (!el) {
      return;
    }

    el.innerHTML =
      `<div class="empty">${escapeHtml(message)}</div>`;
  }

  function showError(id, message) {
    const el = byId(id);

    if (!el) {
      return;
    }

    el.innerHTML =
      `<div class="error-box">${escapeHtml(message)}</div>`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =====================================================
     Number
  ===================================================== */

  function num(value) {
    const n = Number(value);

    return Number.isFinite(n)
      ? n
      : 0;
  }

  function yen(value) {
    return (
      Math.round(
        num(value)
      ).toLocaleString("ja-JP") +
      "円"
    );
  }

  function countText(value) {
    return (
      Math.round(
        num(value)
      ).toLocaleString("ja-JP") +
      "件"
    );
  }

  function hoursText(value) {
    return (
      num(value).toFixed(1) +
      "時間"
    );
  }

  function rateText(value) {
    return (
      num(value).toFixed(1) +
      "%"
    );
  }

  function decimalText(
    value,
    digits = 1
  ) {
    return num(value)
      .toFixed(digits);
  }


  /* =====================================================
     Date
  ===================================================== */

  function parseDate(value) {
    if (!value) {
      return null;
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return null;
    }

    return date;
  }

  function formatDateJST(value) {
    const date =
      parseDate(value);

    if (!date) {
      return "-";
    }

    return new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }
    ).format(date);
  }

  function formatDateTimeJST(value) {
    const date =
      parseDate(value);

    if (!date) {
      return "-";
    }

    return new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }
    ).format(date);
  }

  function getPeriodLabel(period) {
    switch (period) {
      case "today":
        return "今日";

      case "week":
        return "今週";

      case "month":
        return "今月";

      case "year":
        return "年間";

      default:
        return "";
    }
  }


  /* =====================================================
     Telegram User
  ===================================================== */

  function getTelegramUser() {
    return (
      tg?.initDataUnsafe?.user ||
      null
    );
  }

  function renderUser() {
    const user =
      getTelegramUser();

    if (!user) {
      setText(
        "userName",
        "Telegramユーザー"
      );

      return;
    }

    const name =
      [
        user.first_name,
        user.last_name,
      ]
        .filter(Boolean)
        .join(" ")
        .trim();

    const displayName =
      name ||
      (
        user.username
          ? `@${user.username}`
          : `ID: ${user.id}`
      );

    setText(
      "userName",
      displayName
    );
  }


  /* =====================================================
     API
  ===================================================== */

  async function apiFetch(
    path,
    options = {}
  ) {
    const headers = {
      ...(options.headers || {}),
    };

    if (tg?.initData) {
      headers[
        "X-Telegram-Init-Data"
      ] = tg.initData;
    }

    const response =
      await fetch(
        path,
        {
          ...options,
          headers,
        }
      );

    let data = null;

    try {
      data =
        await response.json();
    } catch {
      throw new Error(
        `サーバー応答を読み込めませんでした。(${response.status})`
      );
    }

    if (
      !response.ok ||
      data?.ok === false
    ) {
      throw new Error(
        data?.error ||
        data?.message ||
        `APIエラー (${response.status})`
      );
    }

    return data;
  }


  /* =====================================================
     Personal
  ===================================================== */

  async function loadPersonal() {
    showLoading("personalHero");
    showLoading("personalStatsGrid");
    showLoading("todayHighlights");
    showLoading("monthlyBest");
    showLoading("streakCard");
    showLoading("records");

    try {
      const backendPeriod =
        activePeriod === "today"
          ? "day"
          : activePeriod;

      const [
        resultData,
        analyticsData,
      ] = await Promise.all([
        apiFetch(
          `/api/result?period=${encodeURIComponent(
            backendPeriod
          )}`
        ),

        apiFetch(
          "/api/analytics"
        ),
      ]);

      currentPersonal =
        resultData;

      currentAnalytics =
        analyticsData;

      renderPersonal(
        resultData,
        analyticsData
      );

    } catch (error) {
      console.error(
        "loadPersonal error:",
        error
      );

      showError(
        "personalHero",
        error.message
      );

      showError(
        "personalStatsGrid",
        "データを取得できませんでした。"
      );

      showError(
        "todayHighlights",
        "データを取得できませんでした。"
      );

      showError(
        "monthlyBest",
        "データを取得できませんでした。"
      );

      showError(
        "streakCard",
        "データを取得できませんでした。"
      );

      showError(
        "records",
        "データを取得できませんでした。"
      );
    }
  }

  function renderPersonal(
    data,
    analyticsData
  ) {
    renderPersonalHero(data);
    renderPersonalStats(data);

    renderTodayHighlights(
      analyticsData?.today || {}
    );

    renderMonthlyBest(
      analyticsData
    );

    renderStreak(
      analyticsData
    );

    renderRecordBanner(
      analyticsData
    );

    renderRecords(data);

    setText(
      "recordsPeriodLabel",
      getPeriodLabel(
        activePeriod
      )
    );
  }


  /* =====================================================
     Personal Hero
  ===================================================== */

  function renderPersonalHero(data) {
    const sales =
      num(data?.sales);

    const count =
      num(data?.count);

    const hours =
      num(data?.hours);

    byId(
      "personalHero"

    analyticsData

    const analysis =

    const isBestCount =
      analysis.isBestCount === true;

    const isBestSales =
      analysis.isBestSales === true;

    const banner =
      byId("recordBanner");

    if (!banner) {
      return;
    }

    if (
      !isBestCount &&
      !isBestSales
    ) {
      banner.classList.remove(
        "show"
      );

      return;
    }

    const messages = [];

    if (isBestCount) {
      messages.push(
        "配達件数の自己ベスト更新"
      );
    }

    if (isBestSales) {
      messages.push(
        "売上の自己ベスト更新"
      );
    }

    setText(
      "recordBannerTitle",
      "🎉 自己ベスト更新！"
    );

    setText(
      "recordBannerText",
      messages.join("・")
    );

    banner.classList.add(
      "show"
    );
  }

  /* =====================================================
     Section
  ===================================================== */

  function switchSection(section) {
    if (
      section === "admin" &&
      !isAdmin
    ) {
      return;
    }

    activeSection =
      section;

    document
      .querySelectorAll(".main-tab")
      .forEach((tab) => {

        tab.classList.toggle(
          "active",
          tab.dataset.section ===
            section
        );

      });

    document
      .querySelectorAll(".section")
      .forEach((el) => {

        const sectionId =
          el.id.replace(
            "Section",
            ""
          );

        el.classList.toggle(
          "active",
          sectionId === section
        );

      });

    if (section === "personal") {
      loadPersonal();
    }

    if (section === "analytics") {
      loadAnalytics();
    }

    if (section === "admin") {
      loadAdmin();
    }
  }

     Period
  ===================================================== */

  function switchPeriod(period) {
    activePeriod =
      period;

    document
      .querySelectorAll(".period-tab")
      .forEach((tab) => {

        tab.classList.toggle(
          "active",
          tab.dataset.period ===
            period
        );

      });

    loadPersonal();
  }

          </div>

            ${countText(month.deliveries)}
          </div>
        </div>

      </div>


      <div class="analytics-section-title">
        📝 最新登録
      </div>

      <div class="record-list">

        ${
          latest.length
            ? latest
                .map((record) => `

                  <div class="record-item">

                    <div>

                      <div class="record-date">
                        ${formatDateTimeJST(
                          record.createdAt
                        )}
                      </div>

                      <div class="record-main">
                        ${countText(
                          record.count
                        )}
                        ・
                        ${hoursText(
                          record.hours
                        )}
                      </div>

                    </div>

                    <div class="record-side">

                      <div class="record-sales">
                        ${yen(record.sale)}
                      </div>

                      <div class="record-hours">
                        ID:
                        ${escapeHtml(
                          record.telegramUserId
                        )}
                      </div>

                    </div>

                  </div>

                `)
                .join("")
            : `
                <div class="empty">
                  登録データはありません
                </div>
              `
        }

      </div>

    `;
  }


  /* =====================================================
     Reset
  ===================================================== */

  async function resetPersonal() {
    const confirmed =
      window.confirm(
        "自分の配達実績をすべて削除します。\n\nこの操作は元に戻せません。\n\n本当にリセットしますか？"
      );

    if (!confirmed) {
      return;
    }

    const button =
      byId("resetBtn");

    if (button) {
      button.disabled =
        true;

      button.textContent =
        "リセット中...";
    }

    try {
      await apiFetch(
        "/api/reset",
        {
          method: "POST",
        }
      );

      window.alert(
        "自分の実績をリセットしました。"
      );

      await loadPersonal();

    } catch (error) {
      console.error(
        "reset error:",
        error
      );

      window.alert(
        error.message ||
        "リセットに失敗しました。"
      );

    } finally {
      if (button) {
        button.disabled =
          false;

        button.textContent =
          "🗑 自分の実績をリセット";
      }
    }
  }


  /* =====================================================
     Events
  ===================================================== */

  document
    .querySelectorAll(".main-tab")
    .forEach((tab) => {

      tab.addEventListener(
        "click",
        () => {

          switchSection(
            tab.dataset.section
          );

        }
      );

    });


  document
    .querySelectorAll(".period-tab")
    .forEach((tab) => {

      tab.addEventListener(
        "click",
        () => {

          switchPeriod(
            tab.dataset.period
          );

        }
      );

    });


  byId(
    "refreshBtn"
  )?.addEventListener(
    "click",
    async () => {

      if (
        activeSection ===
        "personal"
      ) {
        await loadPersonal();

      } else if (
        activeSection ===
        "analytics"
      ) {
        await loadAnalytics();

      } else if (
        activeSection ===
        "admin"
      ) {
        await loadAdmin();
      }

    }
  );


  byId(
    "resetBtn"
  )?.addEventListener(
    "click",
    resetPersonal
  );


  /* =====================================================
     Admin Check
  ===================================================== */

  async function checkAdmin() {
    try {
      await apiFetch(
        "/api/admin"
      );

      isAdmin = true;

      const adminTab =
        byId("adminTab");

      if (adminTab) {
        adminTab.style.display =
          "block";
      }

      return true;

    } catch {
      isAdmin = false;

      const adminTab =
        byId("adminTab");

      if (adminTab) {
        adminTab.style.display =
          "none";
      }

      return false;
    }
  }


  /* =====================================================
     Init
  ===================================================== */

  async function init() {
    renderUser();

    await checkAdmin();

    await loadPersonal();
  }

  init();

</script>

</body>
</html>
