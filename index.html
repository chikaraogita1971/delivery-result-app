<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>配達リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f5f7fb;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      padding-bottom: 32px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }

    /* =========================================
       Header
    ========================================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 16px;
      margin-bottom: 12px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .header-left {
      min-width: 0;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .user-name {
      margin-top: 4px;
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .refresh-btn {
      flex-shrink: 0;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 12px;

      background: #f3f4f6;
      color: #374151;

      font-size: 18px;
    }

    .refresh-btn:active {
      transform: scale(0.96);
    }


    /* =========================================
       Main Navigation
    ========================================= */

    .main-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;

      margin-bottom: 12px;
    }

    .main-tab {
      min-height: 46px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      background: #ffffff;
      color: #6b7280;

      font-size: 14px;
      font-weight: 700;
    }

    .main-tab.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    .main-tab.admin-tab {
      display: none;
    }


    /* =========================================
       Section
    ========================================= */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }


    /* =========================================
       Period Tabs
    ========================================= */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;

      margin-bottom: 12px;
    }

    .period-tab {
      min-height: 42px;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      background: #ffffff;
      color: #6b7280;

      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }


    /* =========================================
       Cards
    ========================================= */

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      padding: 16px;
      margin-bottom: 12px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-bottom: 14px;

      font-size: 15px;
      font-weight: 800;
    }

    .card-subtitle {
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }


    /* =========================================
       Hero Stats
    ========================================= */

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;

      margin-bottom: 12px;
    }

    .hero-card {
      padding: 16px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .hero-label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .hero-value {
      margin-top: 7px;

      font-size: 27px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .hero-unit {
      margin-left: 3px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
    }


    /* =========================================
       Stats Grid
    ========================================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-box {
      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 850;
    }


    /* =========================================
       Goal
    ========================================= */

    .goal-card {
      background: #111827;
      color: #ffffff;
      border: 0;
    }

    .goal-card .card-title {
      color: #ffffff;
    }

    .goal-summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .goal-count {
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
    }

    .goal-count span {
      margin-left: 4px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.7;
    }

    .goal-rate {
      font-size: 22px;
      font-weight: 900;
    }

    .progress-track {
      height: 10px;
      margin-top: 15px;

      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;

      background: #ffffff;
      border-radius: 999px;

      transition: width 0.35s ease;
    }


    /* =========================================
       Highlight
    ========================================= */

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .highlight {
      padding: 14px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .highlight-icon {
      font-size: 19px;
    }

    .highlight-label {
      margin-top: 6px;
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .highlight-value {
      margin-top: 3px;
      font-size: 19px;
      font-weight: 900;
    }


    /* =========================================
       Record
    ========================================= */

    .record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 12px;

      background: #f9fafb;
      border-radius: 13px;
    }

    .record-date {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .record-main {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 800;
    }

    .record-side {
      text-align: right;
      flex-shrink: 0;
    }

    .record-sales {
      font-size: 14px;
      font-weight: 850;
    }

    .record-hours {
      margin-top: 2px;
      color: #6b7280;
      font-size: 11px;
    }


    /* =========================================
       Analytics
    ========================================= */

    .analytics-section-title {
      margin: 18px 2px 8px;

      font-size: 13px;
      font-weight: 900;
      color: #374151;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .analytics-item {
      padding: 14px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .analytics-item-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .analytics-item-value {
      margin-top: 5px;

      font-size: 19px;
      font-weight: 900;
    }

    .analytics-item-sub {
      margin-top: 3px;

      color: #9ca3af;
      font-size: 10px;
    }


    /* =========================================
       New Record Banner
    ========================================= */

    .record-banner {
      display: none;

      padding: 14px 16px;
      margin-bottom: 12px;

      border-radius: 16px;

      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .record-banner.show {
      display: block;
    }

    .record-banner-title {
      font-size: 15px;
      font-weight: 900;
      color: #9a3412;
    }

    .record-banner-text {
      margin-top: 4px;

      color: #c2410c;
      font-size: 12px;
      font-weight: 600;
    }


    /* =========================================
       Pace
    ========================================= */

    .pace-card {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .pace-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .pace-value {
      font-size: 28px;
      font-weight: 900;
    }

    .pace-unit {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
    }

    .pace-detail {
      margin-top: 8px;

      color: #475569;
      font-size: 12px;
      line-height: 1.6;
    }


    /* =========================================
       Empty / Loading / Error
    ========================================= */

    .loading,
    .empty,
    .error-box {
      padding: 24px 14px;

      text-align: center;

      color: #6b7280;
      font-size: 13px;
    }

    .error-box {
      color: #b91c1c;

      background: #fef2f2;
      border: 1px solid #fecaca;

      border-radius: 14px;
    }


    /* =========================================
       Admin
    ========================================= */

    .admin-only {
      display: none;
    }

    .admin-only.visible {
      display: block;
    }


    /* =========================================
       Reset
    ========================================= */

    .danger-btn {
      width: 100%;
      min-height: 46px;

      border: 1px solid #fecaca;
      border-radius: 13px;

      background: #fff1f2;
      color: #be123c;

      font-size: 13px;
      font-weight: 800;
    }


    /* =========================================
       Responsive
    ========================================= */

    @media (max-width: 420px) {
      .app {
        padding: 10px;
      }

      .hero-value {
        font-size: 24px;
      }

      .goal-count {
        font-size: 27px;
      }

      .analytics-item-value {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =====================================
         Header
    ====================================== -->

    <header class="header">

      <div class="header-left">
        <h1 class="app-title">
          📦 配達リザルト
        </h1>

        <div
          id="userName"
          class="user-name"
        >
          読み込み中...
        </div>
      </div>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
        aria-label="更新"
      >
        🔄
      </button>

    </header>


    <!-- =====================================
         Main Tabs
    ====================================== -->

    <nav class="main-tabs">

      <button
        class="main-tab active"
        data-section="personal"
        type="button"
      >
        📊 個人実績
      </button>

      <button
        class="main-tab"
        data-section="analytics"
        type="button"
      >
        📈 分析
      </button>

      <button
        id="adminTab"
        class="main-tab admin-tab"
        data-section="admin"
        type="button"
      >
        🛠 管理
      </button>

    </nav>


    <!-- =====================================
         Personal
    ====================================== -->

    <section
      id="personalSection"
      class="section active"
    >

      <!-- Period -->

      <div class="period-tabs">

        <button
          class="period-tab active"
          data-period="today"
          type="button"
        >
          今日
        </button>

        <button
          class="period-tab"
          data-period="week"
          type="button"
        >
          今週
        </button>

        <button
          class="period-tab"
          data-period="month"
          type="button"
        >
          今月
        </button>

        <button
          class="period-tab"
          data-period="year"
          type="button"
        >
          年間
        </button>

      </div>


      <!-- Record update banner -->

      <div
        id="recordBanner"
        class="record-banner"
      >
        <div
          id="recordBannerTitle"
          class="record-banner-title"
        ></div>

        <div
          id="recordBannerText"
          class="record-banner-text"
        ></div>
      </div>


      <!-- Hero -->

      <div
        id="personalHero"
        class="hero-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>


      <!-- Basic stats -->

      <div
        id="personalStats"
        class="card"
      >
        <div class="card-title">
          📊 基本実績
        </div>

        <div
          id="personalStatsGrid"
          class="stats-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>
      </div>


      <!-- Goal -->

      <div
        id="goalCard"
        class="card goal-card"
      >

        <div class="card-title">
          🎯 今月の目標

          <span
            id="goalMonthLabel"
            class="card-subtitle"
            style="color: rgba(255,255,255,.6)"
          >
            今月
          </span>
        </div>

        <div class="goal-summary">

          <div>
            <div
              id="goalCount"
              class="goal-count"
            >
              0
              <span>
                / 1件
              </span>
            </div>
          </div>

          <div
            id="goalRate"
            class="goal-rate"
          >
            0.0%
          </div>

        </div>

        <div class="progress-track">
          <div
            id="goalProgress"
            class="progress-bar"
          ></div>
        </div>

        <div
          id="goalMessage"
          style="
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            opacity: .85;
          "
        >
          あと 1件で目標達成
        </div>

      </div>


      <!-- Highlights -->

      <div class="card">

        <div class="card-title">
          🔥 今日のハイライト
        </div>

        <div
          id="todayHighlights"
          class="highlight-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Monthly best -->

      <div class="card">

        <div class="card-title">
          🏆 今月最高記録
        </div>

        <div
          id="monthlyBest"
          class="highlight-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>


      <!-- Streak -->

      <div class="card">

        <div class="card-title">
          🔥 連続稼働
        </div>

        <div
          id="streakCard"
          class="highlight-grid"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>
            <!-- Records -->

      <div class="card">

        <div class="card-title">
          📝 実績履歴

          <span
            id="recordsPeriodLabel"
            class="card-subtitle"
          >
            今日
          </span>
        </div>

        <div
          id="records"
          class="record-list"

            読み込み中...

      <!-- Reset -->

        <button
          id="resetBtn"
          class="danger-btn"

    <!-- =====================================

    ====================================== -->

    <section
      id="analyticsSection"

          <span
            id="analyticsDateLabel"
            class="card-subtitle"

        </div>

          id="analyticsLoading"

      <!-- Today -->

      <div class="analytics-section-title">
        ⚡ 今日のパフォーマンス
      </div>

      <div
        id="todayAnalytics"
        class="analytics-grid"
      >

          読み込み中...
        </div>
      </div>


      <!-- Pace -->

      <div class="analytics-section-title">
        📊 ペース分析
      </div>

      <div
        id="paceAnalytics"
        class="card pace-card"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>


      <!-- Goal -->

      <div class="analytics-section-title">
        🎯 目標分析
      </div>

      <div
        id="goalAnalytics"
        class="analytics-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>


      <!-- Best -->

      <div class="analytics-section-title">
        🏆 自己ベスト
      </div>

      <div
        id="bestAnalytics"
        class="analytics-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>


      <!-- Comparison -->

      <div class="analytics-section-title">
        🔄 前月・前日比較
      </div>

      <div
        id="comparisonAnalytics"
        class="analytics-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>


      <!-- Daily -->

      <div class="analytics-section-title">
        📅 今月の日別推移
      </div>

      <div class="card">

        <div
          id="dailyAnalytics"
          class="record-list"
        >
          <div class="loading">
            読み込み中...

        </div>

    <!-- =====================================
         Admin
    ====================================== -->

      id="adminSection"
      class="section admin-only"
    >

      <div class="card">

        <div class="card-title">
          🛠 管理

          id="adminContent"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>

  </div>


  <script>

    /* =========================================
       Telegram
    ========================================= */

    const tg = window.Telegram?.WebApp || null;

    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (error) {
        console.warn("Telegram WebApp init error:", error);
      }
    }


    /* =========================================
       Constants
    ========================================= */

    const JST = "Asia/Tokyo";

    let activeSection = "personal";
    let activePeriod = "today";

    let currentPersonal = null;
    let currentGoal = null;
    let currentAnalytics = null;
    let currentAdmin = null;


    /* =========================================
       DOM Helpers
    ========================================= */

    function $(id) {
      return document.getElementById(id);
    }

    function setText(id, value) {
      const element = $(id);

      if (!element) {
        return;
      }

      element.textContent =
        value === null ||
        value === undefined
          ? ""
          : String(value);
    }

    function setHTML(id, html) {
      const element = $(id);

      if (!element) {
        return;
      }

      element.innerHTML = html;
    }


    function showLoading(id) {
      setHTML(
        id,
        `<div class="loading">読み込み中...</div>`
      );
    }


    function showEmpty(id, message = "データがありません") {
      setHTML(
        id,
        `<div class="empty">${escapeHtml(message)}</div>`
      );
    }


    function showError(id, message) {
      setHTML(
        id,
        `<div class="error-box">${escapeHtml(
          message || "読み込みに失敗しました"
        )}</div>`
      );
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================
       Number Helpers
    ========================================= */

    function toNumber(value, fallback = 0) {
      const number = Number(value);

      return Number.isFinite(number)
        ? number
        : fallback;
    }


    function formatNumber(value, digits = 0) {
      const number = toNumber(value);

      return number.toLocaleString("ja-JP", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }


    function formatYen(value) {
      return `${formatNumber(value)}円`;
    }


    function formatHours(value) {
      return `${formatNumber(value, 2)}時間`;
    }


    function formatRate(value) {
      return `${formatNumber(value, 1)}%`;
    }


    function formatDecimal(value, digits = 1) {
      return formatNumber(value, digits);
    }


    /* =========================================
       Date Helpers
    ========================================= */

    function isValidDate(date) {
      return date instanceof Date &&
        !Number.isNaN(date.getTime());
    }


    function parseDate(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      if (value instanceof Date) {
        return isValidDate(value)
          ? value
          : null;
      }

      const raw = String(value).trim();

      if (!raw) {
        return null;
      }

      let date;

      /*
       * YYYY-MM-DD
       */
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
        date = new Date(
          `${raw}T00:00:00+09:00`
        );
      } else {
        /*
         * ISO / timestamp
         */
        date = new Date(raw);
      }

      return isValidDate(date)
        ? date
        : null;
    }


    function formatDateJST(value) {
      const date = parseDate(value);

      if (!date) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone: JST,
          month: "numeric",
          day: "numeric",
          weekday: "short"
        }
      ).format(date);
    }


    function formatDateTimeJST(value) {
      const date = parseDate(value);

      if (!date) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone: JST,
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }


    function getTodayJST() {
      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: JST,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).format(new Date());
    }


    function dateOnlyStringJST(value) {
      const date = parseDate(value);

      if (!date) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: JST,
          year: "numeric",
          month: "2-digit",

        }

    /* =========================================
       API
    ========================================= */

    async function apiFetch(
      url,
      options = {}
    ) {
      const headers = {
        ...(options.headers || {})
      };

      const initData =
        getTelegramInitData();

      if (initData) {
        headers["X-Telegram-Init-Data"] =
          initData;
      }

      const response =
        await fetch(url, {
          ...options,
          headers
        });

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        const message =
          data?.error ||
          data?.message ||
          `HTTP ${response.status}`;

        throw new Error(message);
      }

      return data;
    }

        );

      const goalRate =
        toNumber(
          analysis?.goalProgressRate ??
          analysis?.goalRate ??
          (currentCount / monthlyGoal) * 100
        );

      const monthProgressRate =
        toNumber(
          analysis?.monthProgressRate
        );

      const paceDifference =
        toNumber(
          analysis?.paceDifference
        );

      setHTML(
        "goalAnalytics",
        `
          <div class="analytics-item">
            <div class="analytics-item-label">
              月間目標
            </div>

            <div class="analytics-item-value">
              ${formatNumber(monthlyGoal)}件
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              現在の実績
            </div>

            <div class="analytics-item-value">
              ${formatNumber(currentCount)}件
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              目標まであと
            </div>

            <div class="analytics-item-value">
              ${formatNumber(remaining)}件
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              必要な1日平均
            </div>

            <div class="analytics-item-value">
              ${formatNumber(
                requiredDailyCount,
                1
              )}件/日
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              目標達成率
            </div>

            <div class="analytics-item-value">
              ${formatRate(goalRate)}
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              今月の進捗ペース
            </div>

            <div class="analytics-item-value">
              ${formatRate(
                monthProgressRate
              )}
            </div>

            <div class="analytics-item-sub">
              ペース差 ${formatNumber(
                paceDifference,
                1
              )}件
            </div>
          </div>
        `
      );
    }


    /* =========================================
       Best Analytics
    ========================================= */

    function renderBestAnalytics(
      today,
      analysis
    ) {
      const monthlyBestCount =
        toNumber(
          analysis?.monthlyBestCount
        );

      const monthlyBestSales =
        toNumber(
          analysis?.monthlyBestSales
        );

      const allTimeBestCount =
        toNumber(
          analysis?.allTimeBestCount
        );

      const allTimeBestSales =
        toNumber(
          analysis?.allTimeBestSales
        );

      const isBestCount =
        Boolean(
          analysis?.isBestCount
        );

      const isBestSales =
        Boolean(
          analysis?.isBestSales
        );

      setHTML(
        "bestAnalytics",
        `
          <div class="analytics-item">
            <div class="analytics-item-label">
              今月最高配達
            </div>

            <div class="analytics-item-value">
              ${formatNumber(
                monthlyBestCount
              )}件
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              今月最高売上
            </div>

            <div class="analytics-item-value">
              ${formatNumber(
                monthlyBestSales
              )}円
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              自己ベスト配達
            </div>

            <div class="analytics-item-value">
              ${formatNumber(
                allTimeBestCount
              )}件
              ${
                isBestCount
                  ? " 🆕"
                  : ""
              }
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              自己ベスト売上
            </div>

            <div class="analytics-item-value">
              ${formatNumber(
                allTimeBestSales
              )}円
              ${
                isBestSales
                  ? " 🆕"
                  : ""
              }
            </div>
          </div>
        `
      );
    }


    /* =========================================
       Comparison Analytics
    ========================================= */

    function renderComparisonAnalytics(
      today,
      yesterday,
      month,
      previousMonth,
      analysis
    ) {
      const salesChangeFromYesterday =
        toNumber(
          analysis?.salesChangeFromYesterday ??
          toNumber(today?.sales) -
          toNumber(yesterday?.sales)
        );

      const countChangeFromYesterday =
        toNumber(
          analysis?.countChangeFromYesterday ??
          toNumber(today?.count) -
          toNumber(yesterday?.count)
        );

      const salesChangeFromPreviousMonth =
        toNumber(
          analysis?.salesChangeFromPreviousMonth
        );

      const countChangeFromPreviousMonth =
        toNumber(
          analysis?.countChangeFromPreviousMonth
        );

      const salesChangeRate =
        toNumber(
          analysis?.salesChangeFromPreviousMonthRate
        );

      const countChangeRate =
        toNumber(
          analysis?.countChangeFromPreviousMonthRate
        );

      setHTML(
        "comparisonAnalytics",
        `
          <div class="analytics-item">
            <div class="analytics-item-label">
              前日売上差
            </div>

            <div class="analytics-item-value">
              ${salesChangeFromYesterday >= 0 ? "+" : ""}
              ${formatNumber(
                salesChangeFromYesterday
              )}円
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              前日配達差
            </div>

            <div class="analytics-item-value">
              ${countChangeFromYesterday >= 0 ? "+" : ""}
              ${formatNumber(
                countChangeFromYesterday
              )}件
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              先月売上差
            </div>

            <div class="analytics-item-value">
              ${salesChangeFromPreviousMonth >= 0 ? "+" : ""}
              ${formatNumber(
                salesChangeFromPreviousMonth
              )}円
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              先月配達差
            </div>

            <div class="analytics-item-value">
              ${countChangeFromPreviousMonth >= 0 ? "+" : ""}
              ${formatNumber(
                countChangeFromPreviousMonth
              )}件
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              先月比売上
            </div>

            <div class="analytics-item-value">
              ${salesChangeRate >= 0 ? "+" : ""}
              ${formatNumber(
                salesChangeRate,
                1
              )}%
            </div>
          </div>

          <div class="analytics-item">
            <div class="analytics-item-label">
              先月比配達
            </div>

            <div class="analytics-item-value">
              ${countChangeRate >= 0 ? "+" : ""}
              ${formatNumber(
                countChangeRate,
                1
              )}%
            </div>
          </div>
        `
      );
    }


    /* =========================================
       Daily Analytics
    ========================================= */

    function renderDailyAnalytics(data) {
      const rows =
        Array.isArray(data)
          ? data
          : [];

      if (!rows.length) {
        showEmpty(
          "dailyAnalytics",
          "今月の日別データはありません"
        );
        return;
      }

      setHTML(
        "dailyAnalytics",
        rows
          .map((row) => {
            const date =
              row?.date ??
              row?.day ??
              "";

            const sales =
              toNumber(
                row?.sales ??
                row?.totalSales ??
                0
              );

            const count =
              toNumber(
                row?.count ??
                row?.deliveryCount ??
                0
              );

            const hours =
              toNumber(
                row?.hours ??
                row?.workHours ??
                0
              );

            return `
              <div class="record-item">

                <div>
                  <div class="record-date">
                    ${escapeHtml(
                      formatDateJST(date)
                    )}
                  </div>

                  <div class="record-main">
                    📦 ${formatNumber(count)}件
                  </div>
                </div>

                <div class="record-side">

                  <div class="record-sales">
                    ${formatNumber(sales)}円
                  </div>

                  <div class="record-hours">
                    ${formatNumber(hours, 2)}時間
                  </div>

                </div>

              </div>
            `;
          })
          .join("")
      );
    }
        /* =========================================
       Admin
    ========================================= */

    async function loadAdmin() {
      showLoading("adminContent");

      try {
        const data =
          await apiFetch("/api/admin");

        currentAdmin = data;

        renderAdmin(data);
      } catch (error) {
        console.error(
          "admin load error:",
          error
        );

        showError(
          "adminContent",
          error.message
        );
      }
    }


    function renderAdmin(data) {
      const overall =
        data?.overall ||
        {};

      const month =
        data?.month ||
        {};

      const logs =
        Array.isArray(data?.logs)
          ? data.logs
          : [];

      setHTML(
        "adminContent",
        `
          <div class="stats-grid">

            <div class="stat-box">
              <div class="stat-label">
                総売上
              </div>

              <div class="stat-value">
                ${formatNumber(
                  overall?.sales ?? 0
                )}円
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                総配達数
              </div>

              <div class="stat-value">
                ${formatNumber(
                  overall?.count ?? 0
                )}件
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                今月売上
              </div>

              <div class="stat-value">
                ${formatNumber(
                  month?.sales ?? 0
                )}円
              </div>
            </div>

            <div class="stat-box">
              <div class="stat-label">
                今月配達
              </div>

              <div class="stat-value">
                ${formatNumber(
                  month?.count ?? 0
                )}件
              </div>
            </div>

          </div>

          ${
            logs.length
              ? `
                <div
                  style="
                    margin-top:16px;
                    font-size:13px;
                    font-weight:800;
                  "
                >
                  最近の操作
                </div>

                <div
                  style="
                    margin-top:8px;
                    display:flex;
                    flex-direction:column;
                    gap:6px;
                  "
                >
                  ${logs
                    .slice(0, 10)
                    .map((log) => {
                      const action =
                        log?.action || "";

                      const createdAt =
                        log?.created_at ??
                        log?.createdAt ??
                        "";

                      return `
                        <div
                          style="
                            padding:10px;
                            background:#f9fafb;
                            border-radius:10px;
                          "
                        >
                          <div
                            style="
                              font-size:12px;
                              font-weight:800;
                            "
                          >
                            ${escapeHtml(action)}
                          </div>

                          <div
                            style="
                              margin-top:3px;
                              color:#6b7280;
                              font-size:10px;
                            "
                          >
                            ${escapeHtml(
                              formatDateTimeJST(
                                createdAt
                              )
                            )}
                          </div>
                        </div>
                      `;
                    })
                    .join("")}
                </div>
              `
              : `
                <div class="empty">
                  操作履歴はありません
                </div>
              `
          }
        `
      );
    }


    /* =========================================
       Goal / Personal Refresh
       ========================================= */

    async function refreshAll() {
      renderUser();

      if (activeSection === "personal") {
        await loadPersonal();
        return;
      }

      if (activeSection === "analytics") {
        await loadAnalytics();
        return;
      }

      if (activeSection === "admin") {
        await loadAdmin();
      }
    }


    /* =========================================
       Reset
    ========================================= */

    async function resetPersonalResults() {
      const confirmed =
        window.confirm(
          "自分の実績をすべてリセットします。\n\nこの操作は元に戻せません。\n\n実行しますか？"
        );

      if (!confirmed) {
        return;
      }

      const button =
        $("resetBtn");

      if (button) {
        button.disabled = true;
        button.textContent =
          "リセット中...";
      }

      try {
        await apiFetch(
          "/api/reset",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({})
          }
        );

        window.alert(
          "自分の実績をリセットしました。"
        );

        await refreshAll();

      } catch (error) {
        console.error(
          "reset error:",
          error
        );

        window.alert(
          `リセットに失敗しました。\n${error.message}`
        );

      } finally {
        if (button) {
          button.disabled = false;
          button.textContent =
            "🗑 自分の実績をリセット";
        }
      }
    }


    /* =========================================
       Event Listeners
    ========================================= */

    document
      .querySelectorAll(".main-tab")
      .forEach((button) => {
        button.addEventListener(
          "click",
          () => {
            const section =
              button.dataset.section;

            if (!section) {
              return;
            }

            setActiveSection(section);
          }
        );
      });


    document
      .querySelectorAll(".period-tab")
      .forEach((button) => {
        button.addEventListener(
          "click",
          () => {
            const period =
              button.dataset.period;

            if (!period) {
              return;
            }

            setActivePeriod(period);
          }
        );
      });


    const refreshButton =
      $("refreshBtn");

    if (refreshButton) {
      refreshButton.addEventListener(
        "click",
        async () => {
          refreshButton.disabled = true;

          try {
            await refreshAll();
          } finally {
            refreshButton.disabled = false;
          }
        }
      );
    }


    const resetButton =
      $("resetBtn");

    if (resetButton) {
      resetButton.addEventListener(
        "click",
        resetPersonalResults
      );
    }


    /* =========================================
       Telegram Main Button
    ========================================= */

    if (tg) {
      try {
        tg.MainButton.hide();
      } catch (error) {
        console.warn(
          "Telegram MainButton error:",
          error
        );
      }
    }


    /* =========================================
       Init
    ========================================= */

    async function init() {
      renderUser();

      try {
        /*
         * APIから現在の目標を取得できる場合は
         * 個人データ側のgoalを優先して表示します。
         *
         * 目標未設定の場合は1件を表示します。
         */
        await loadPersonal();

      } catch (error) {
        console.error(
          "init error:",
          error
        );
      }
    }


    init();

  </script>

</body>
</html>
