<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>配達リザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #222);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 40px;
    }

    h1 {
      margin: 4px 0 18px;
      font-size: 24px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 4px;
      background: var(--tg-theme-secondary-bg-color, #e9e9e9);
      color: var(--tg-theme-text-color, #222);
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }

    .status {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #e9e9e9);
      font-size: 13px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      padding: 14px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    .card .label {
      font-size: 12px;
      opacity: 0.65;
      margin-bottom: 6px;
    }

    .card .value {
      font-size: 21px;
      font-weight: 700;
      word-break: break-word;
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: 700;
    }

    .records {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record {
      padding: 12px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    .record-date {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 7px;
    }

    .record-values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 13px;
    }

    .record-value {
      font-weight: 600;
    }

    .empty {
      padding: 20px;
      text-align: center;
      opacity: 0.6;
      background: var(--tg-theme-secondary-bg-color, #fff);
      border-radius: 12px;
    }

    .reset-box {
      margin-top: 28px;
      padding: 16px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    .reset-warning {
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.75;
    }

    .reset-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #d93025;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .loading {
      padding: 30px;
      text-align: center;
      opacity: 0.65;
    }

    .error {
      padding: 16px;
      border-radius: 12px;
      background: #ffe8e8;
      color: #b00020;
      line-height: 1.6;
    }

    @media (max-width: 420px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .card .value {
        font-size: 18px;
      }

      .record-values {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 配達リザルト</h1>

  <!-- 期間タブ -->
  <div class="tabs">
    <button class="tab active" data-period="day">
      日
    </button>

    <button class="tab" data-period="week">
      週
    </button>

    <button class="tab" data-period="month">
      月
    </button>

    <button class="tab" data-period="year">
      年
    </button>
  </div>

  <div id="status" class="status"></div>

  <!-- ダッシュボード -->
  <div id="dashboard">
    <div class="loading">
      読み込み中...
    </div>
  </div>

  <!-- 記録 -->
  <div class="section">
    <div class="section-title">
      📝 最近の記録
    </div>

    <div id="records">
      <div class="loading">
        読み込み中...
      </div>
    </div>
  </div>

  <!-- リセット -->
  <div class="reset-box">

    <div class="section-title">
      🗑️ 実績リセット
    </div>

    <div class="reset-warning">
      登録されているあなたの配達実績をすべて削除します。<br>
      この操作は取り消せません。<br>
      <br>
      ※ 月間目標は削除されません。
    </div>

    <button
      id="resetButton"
      class="reset-button"
      type="button"
    >
      🗑️ 全実績をリセット
    </button>

  </div>

</div>

<script>
  /*
  ============================================================
  Telegram Mini App
  ============================================================
  */

  const tg = window.Telegram?.WebApp;

  if (!tg) {
    document.body.innerHTML = `
      <div style="
        padding:30px;
        text-align:center;
        font-family:sans-serif;
      ">
        Telegram Mini Appとして開いてください。
      </div>
    `;
    throw new Error("Telegram WebApp is unavailable.");
  }

  tg.ready();
  tg.expand();

  /*
  ============================================================
  状態
  ============================================================
  */

  let currentPeriod = "day";

  const dashboard =
    document.getElementById("dashboard");

  const records =
    document.getElementById("records");

  const status =
    document.getElementById("status");

  const resetButton =
    document.getElementById("resetButton");

  /*
  ============================================================
  共通関数
  ============================================================
  */

  function formatNumber(value) {
    return Number(value || 0).toLocaleString("ja-JP");
  }

  function formatHours(value) {
    return Number(value || 0).toLocaleString(
      "ja-JP",
      {
        maximumFractionDigits: 2
      }
    );
  }

  function formatDate(value) {
    if (!value) {
      return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "-";
    }

    return date.toLocaleString(
      "ja-JP",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }

  function showStatus(message) {
    status.textContent = message;
    status.classList.add("show");
  }

  function hideStatus() {
    status.textContent = "";
    status.classList.remove("show");
  }

  /*
  ============================================================
  ダッシュボード描画
  ============================================================
  */

  function renderDashboard(data) {
    const sales = Number(data.sales || 0);
    const count = Number(data.count || 0);
    const hours = Number(data.hours || 0);
    const workDays = Number(data.workDays || 0);
    const maxSales = Number(data.maxSales || 0);
    const maxCount = Number(data.maxCount || 0);
    const average = Number(data.average || 0);
    const goal = Number(data.goal || 0);
    const rate = Number(data.rate || 0);
    const totalCount = Number(data.totalCount || 0);

    const dailyAverageSales =
      workDays > 0
        ? sales / workDays
        : 0;

    dashboard.innerHTML = `
      <div class="cards">

        <div class="card">
          <div class="label">売上</div>
          <div class="value">
            ${formatNumber(sales)}円
          </div>
        </div>

        <div class="card">
          <div class="label">件数</div>
          <div class="value">
            ${formatNumber(count)}件
          </div>
        </div>

        <div class="card">
          <div class="label">平均単価</div>
          <div class="value">
            ${formatNumber(average)}円
          </div>
        </div>

        <div class="card">
          <div class="label">稼働時間</div>
          <div class="value">
            ${formatHours(hours)}時間
          </div>
        </div>

        <div class="card">
          <div class="label">月間目標</div>
          <div class="value">
            ${
              goal > 0
                ? `${formatNumber(goal)}円`
                : "未設定"
            }
          </div>
        </div>

        <div class="card">
          <div class="label">目標達成率</div>
          <div class="value">
            ${
              goal > 0
                ? `${rate.toLocaleString("ja-JP", {
                    maximumFractionDigits: 1
                  })}%`
                : "-"
            }
          </div>
        </div>

        <div class="card">
          <div class="label">稼働日数</div>
          <div class="value">
            ${formatNumber(workDays)}日
          </div>
        </div>

        <div class="card">
          <div class="label">1日平均売上</div>
          <div class="value">
            ${formatNumber(
              Math.round(dailyAverageSales)
            )}円
          </div>
        </div>

        <div class="card">
          <div class="label">期間最高売上</div>
          <div class="value">
            ${formatNumber(maxSales)}円
          </div>
        </div>

        <div class="card">
          <div class="label">期間最高件数</div>
          <div class="value">
            ${formatNumber(maxCount)}件
          </div>
        </div>

        <div class="card">
          <div class="label">累計件数</div>
          <div class="value">
            ${formatNumber(totalCount)}件
          </div>
        </div>

      </div>
    `;
  }

  /*
  ============================================================
  記録描画
  ============================================================
  */

  function renderRecords(data) {
    const list = Array.isArray(data.records)
      ? data.records
      : [];

    if (list.length === 0) {
      records.innerHTML = `
        <div class="empty">
          この期間の記録はありません。
        </div>
      `;

      return;
    }

    records.innerHTML = `
      <div class="records">
        ${list.map(record => `
          <div class="record">

            <div class="record-date">
              ${formatDate(record.createdAt)}
            </div>

            <div class="record-values">

              <div>
                売上<br>
                <span class="record-value">
                  ${formatNumber(record.sale)}円
                </span>
              </div>

              <div>
                件数<br>
                <span class="record-value">
                  ${formatNumber(record.count)}件
                </span>
              </div>

              <div>
                時間<br>
                <span class="record-value">
                  ${formatHours(record.hours)}時間
                </span>
              </div>

            </div>

          </div>
        `).join("")}
      </div>
    `;
  }

  /*
  ============================================================
  集計データ取得
  ============================================================
  */

  async function loadResults() {
    hideStatus();

    dashboard.innerHTML = `
      <div class="loading">
        読み込み中...
      </div>
    `;

    records.innerHTML = `
      <div class="loading">
        読み込み中...
      </div>
    `;

    try {
      const initData = tg.initData;

      if (!initData) {
        throw new Error(
          "Telegram認証情報を取得できません。"
        );
      }

      const response = await fetch(
        `/api/result?period=${encodeURIComponent(
          currentPeriod
        )}`,
        {
          method: "GET",
          headers: {
            "X-Telegram-Init-Data": initData
          }
        }
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error ||
          "データ取得に失敗しました。"
        );
      }

      renderDashboard(data);
      renderRecords(data);

    } catch (error) {
      console.error(
        "Load result error:",
        error
      );

      dashboard.innerHTML = `
        <div class="error">
          データを取得できませんでした。<br>
          ${error.message || ""}
        </div>
      `;

      records.innerHTML = "";

    }
  }

  /*
  ============================================================
  期間タブ
  ============================================================
  */

  document
    .querySelectorAll(".tab")
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          document
            .querySelectorAll(".tab")
            .forEach(tab => {
              tab.classList.remove("active");
            });

          button.classList.add("active");

          currentPeriod =
            button.dataset.period;

          await loadResults();
        }
      );

    });

  /*
  ============================================================
  Mini Appから全実績リセット
  ============================================================
  */

  resetButton.addEventListener(
    "click",
    async () => {

      /*
      --------------------------------------------------------
      二重クリック防止
      --------------------------------------------------------
      */

      if (resetButton.disabled) {
        return;
      }

      /*
      --------------------------------------------------------
      確認
      --------------------------------------------------------
      */

      const confirmed =
        window.confirm(
          "登録されている配達実績をすべて削除します。\n\n" +
          "この操作は取り消せません。\n\n" +
          "月間目標は削除されません。\n\n" +
          "本当にリセットしますか？"
        );

      if (!confirmed) {
        return;
      }

      /*
      --------------------------------------------------------
      Telegram initData確認
      --------------------------------------------------------
      */

      const initData = tg.initData;

      if (!initData) {
        showStatus(
          "Telegram認証情報を取得できません。"
        );

        return;
      }

      /*
      --------------------------------------------------------
      ボタン無効化
      --------------------------------------------------------
      */

      resetButton.disabled = true;
      resetButton.textContent =
        "リセット中...";

      showStatus(
        "実績をリセットしています..."
      );

      try {

        const response = await fetch(
          "/api/reset",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "X-Telegram-Init-Data": initData
            },

            body: JSON.stringify({})
          }
        );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.ok
        ) {
          throw new Error(
            data.error ||
            "リセットに失敗しました。"
          );
        }

        /*
        ------------------------------------------------------
        成功
        ------------------------------------------------------
        */

        if (data.deletedCount > 0) {

          showStatus(
            `✅ ${data.deletedCount}件の実績を削除しました。`
          );

        } else {

          showStatus(
            "📭 削除する実績はありませんでした。"
          );

        }

        /*
        ------------------------------------------------------
        最新データを再取得
        ------------------------------------------------------
        */

        await loadResults();

        /*
        loadResults()でstatusが消えるため、
        成功メッセージをもう一度表示
        */

        if (data.deletedCount > 0) {

          showStatus(
            `✅ ${data.deletedCount}件の実績を削除しました。`
          );

        } else {

          showStatus(
            "📭 削除する実績はありませんでした。"
          );

        }

        /*
        ------------------------------------------------------
        Telegramのハプティック
        ------------------------------------------------------
        */

        if (
          tg.HapticFeedback &&
          tg.HapticFeedback.notificationOccurred
        ) {
          tg.HapticFeedback.notificationOccurred(
            "success"
          );
        }

      } catch (error) {

        console.error(
          "Reset error:",
          error
        );

        showStatus(
          `❌ ${error.message || "リセットに失敗しました。"}`
        );

        if (
          tg.HapticFeedback &&
          tg.HapticFeedback.notificationOccurred
        ) {
          tg.HapticFeedback.notificationOccurred(
            "error"
          );
        }

      } finally {

        resetButton.disabled = false;

        resetButton.textContent =
          "🗑️ 全実績をリセット";
      }

    }
  );

  /*
  ============================================================
  初期読み込み
  ============================================================
  */

  loadResults();

</script>

</body>
</html>
