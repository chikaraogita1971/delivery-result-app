<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>個人テレグラムリザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #7b8495;
      --border: #e5e9f0;
      --primary: #229ed9;
      --primary-dark: #1686bd;
      --danger: #e05252;
      --shadow: 0 4px 18px rgba(23, 32, 51, .07);
      --radius: 16px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
    }

    .user-name {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .refresh-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 18px;
    }

    .period-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 14px 16px 2px;
    }

    .period-tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .period-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .section {
      padding: 16px;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 800;
    }

    .add-result-card {
      margin-bottom: 16px;
      padding: 18px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #596273;
    }

    .result-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .result-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34,158,217,.12);
    }

    .details-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 3px 0 10px;
      padding: 11px 0;
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--primary-dark);
      font-weight: 700;
      text-align: left;
    }

    .optional-details {
      display: none;
    }

    .optional-details.open {
      display: block;
    }

    .add-result-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .add-result-submit:disabled {
      opacity: .6;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 20px;
      font-weight: 850;
    }

    .summary-value.small {
      font-size: 16px;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .analysis-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }

    .analysis-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .analysis-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: 850;
    }

    .empty {
      padding: 24px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 18px;
      z-index: 100;
      display: none;
      padding: 13px 15px;
      border-radius: 12px;
      background: rgba(23,32,51,.94);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      background: rgba(180,45,45,.95);
    }

    @media (min-width: 700px) {
      .section {
        max-width: 760px;
        margin: 0 auto;
      }

      .header {
        padding-left: calc((100% - 760px) / 2 + 16px);
        padding-right: calc((100% - 760px) / 2 + 16px);
      }

      .period-tabs {
        max-width: 760px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div>
        <div class="header-title">
          📦 個人テレグラムリザルト
        </div>

        <div id="userName" class="user-name">
          読み込み中…
        </div>
      </div>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
        aria-label="更新"
      >
        ↻
      </button>
    </header>

    <div class="period-tabs">

      <button
        class="period-tab active"
        type="button"
        data-period="today"
      >
        今日
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="week"
      >
        今週
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="month"
      >
        今月
      </button>

      <button
        class="period-tab"
        type="button"
        data-period="all"
      >
        全期間
      </button>

    </div>

    <section class="section">

      <!-- 実績入力 -->
      <div class="add-result-card">

        <h2 class="card-title">
          実績を追加
        </h2>

        <form id="addResultForm">

          <div class="form-row">

            <div class="field">
              <label for="saleAmountInput">
                売上（円）
              </label>

              <input
                id="saleAmountInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="5000"
                required
              >
            </div>

            <div class="field">
              <label for="deliveryCountInput">
                配達件数
              </label>

              <input
                id="deliveryCountInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="1"
                step="1"
                placeholder="5"
                required
              >
            </div>

          </div>

          <button
            id="detailsToggle"
            class="details-toggle"
            type="button"
            aria-expanded="false"
          >
            <span>詳細設定（任意）</span>
            <span id="detailsToggleIcon">＋</span>
          </button>

          <div
            id="optionalDetails"
            class="optional-details"
          >

            <div class="field">
              <label for="workStartTimeInput">
                稼働開始時刻
              </label>

              <input
                id="workStartTimeInput"
                class="result-input"
                type="time"
              >
            </div>

            <div class="field">
              <label for="workHoursInput">
                稼働時間（時間）
              </label>

              <input
                id="workHoursInput"
                class="result-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="5.5"
              >
            </div>

            <div class="field">
              <label for="distanceInput">
                走行距離（km）
              </label>

              <input
                id="distanceInput"
                class="result-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="30"
              >
            </div>

            <div class="field">
              <label for="expenseInput">
                経費（円）
              </label>

              <input
                id="expenseInput"
                class="result-input"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="500"
              >
            </div>

          </div>

          <button
            class="add-result-submit"
            type="submit"
          >
            実績を保存
          </button>

        </form>
      </div>

      <!-- 集計 -->
      <div class="summary-grid">

        <div class="summary-item">
          <div class="summary-label">
            売上
          </div>

          <div
            id="summarySales"
            class="summary-value"
          >
            ¥0
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">
            配達件数
          </div>

          <div
            id="summaryDeliveries"
            class="summary-value"
          >
            0件
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">
            稼働時間
          </div>

          <div
            id="summaryHours"
            class="summary-value small"
          >
            0時間
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">
            時給
          </div>

          <div
            id="summaryHourly"
            class="summary-value small"
          >
            ¥0
          </div>
        </div>

        <div class="summary-item">
          <div class="summary-label">
            平均単価
          </div>

          <div
            id="summaryUnitPrice"
            class="summary-value small"
          >
            ¥0
          </div>
        </div>

      </div>

      <!-- 📊 効率分析 -->
      <div class="card">

        <h2 class="card-title">
          📊 効率分析
        </h2>

        <div class="analysis-grid">

          <div class="analysis-card">

            <div class="analysis-label">
              1件あたり売上
            </div>

            <div
              id="analysisPerDelivery"
              class="analysis-value"
            >
              ¥0
            </div>

          </div>

          <div class="analysis-card">

            <div class="analysis-label">
              1時間あたり件数
            </div>

            <div
              id="analysisDeliveriesPerHour"
              class="analysis-value"
            >
              0件
            </div>

          </div>

          <div class="analysis-card">

            <div class="analysis-label">
              1kmあたり売上
            </div>

            <div
              id="analysisSalesPerKm"
              class="analysis-value"
            >
              —
            </div>

          </div>

          <div class="analysis-card">

            <div class="analysis-label">
              経費
            </div>

            <div
              id="analysisExpense"
              class="analysis-value"
            >
              ¥0
            </div>

          </div>

        </div>

      </div>

      <div
        id="recordList"
        class="card"
      >
        <div class="empty">
          読み込み中…
        </div>
      </div>

    </section>

  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    const tg =
      window.Telegram?.WebApp || null;

    let currentPeriod = 'today';
    let currentData = null;

    function formatYen(value) {
      const number = Number(value || 0);

      return `¥${Math.round(number).toLocaleString('ja-JP')}`;
    }

    function formatHours(value) {
      const number = Number(value || 0);

      if (
        !Number.isFinite(number) ||
        number <= 0
      ) {
        return '0時間';
      }

      return `${number.toFixed(1)}時間`;
    }

    function formatNumber(
      value,
      digits = 1
    ) {
      const number = Number(value || 0);

      if (!Number.isFinite(number)) {
        return '0';
      }

      return number.toLocaleString(
        'ja-JP',
        {
          maximumFractionDigits: digits
        }
      );
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(
      message,
      type = 'normal'
    ) {
      const toast =
        document.getElementById('toast');

      if (!toast) {
        return;
      }

      toast.textContent = message;

      toast.className =
        `toast show ${
          type === 'error'
            ? 'error'
            : ''
        }`;

      clearTimeout(showToast.timer);

      showToast.timer =
        setTimeout(() => {
          toast.className = 'toast';
        }, 3000);
    }

    function getTelegramUser() {
      return tg?.initDataUnsafe?.user || null;
    }

    function updateUserName() {
      const element =
        document.getElementById('userName');

      if (!element) {
        return;
      }

      const user =
        getTelegramUser();

      if (!user) {
        element.textContent =
          'Telegram Mini Appとして起動してください';

        return;
      }

      const name =
        user.first_name ||
        user.username ||
        'ユーザー';

      element.textContent =
        `${name}さん`;
    }

    function apiFetch(
      url,
      options = {}
    ) {
      const headers =
        new Headers(
          options.headers || {}
        );

      headers.set(
        'Accept',
        'application/json'
      );

      if (tg?.initData) {
        headers.set(
          'X-Telegram-Init-Data',
          tg.initData
        );
      }

      return fetch(
        url,
        {
          ...options,
          headers
        }
      );
    }

    async function readApiResponse(
      response
    ) {
      const text =
        await response.text();

      let data = null;

      try {
        data =
          text
            ? JSON.parse(text)
            : null;
      } catch {
        data = null;
      }

      if (!response.ok) {
        throw new Error(
          data?.error ||
          data?.message ||
          `通信エラー (${response.status})`
        );
      }

      if (data?.ok === false) {
        throw new Error(
          data.error ||
          data.message ||
          '処理に失敗しました'
        );
      }

      return data;
    }

    function getRecordsFromData(data) {
      if (!data) {
        return [];
      }

      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data.records)) {
        return data.records;
      }

      if (Array.isArray(data.results)) {
        return data.results;
      }

      if (Array.isArray(data.data)) {
        return data.data;
      }

      return [];
    }

    function getRecordValue(
      record,
      ...keys
    ) {
      for (const key of keys) {
        if (
          record &&
          record[key] !== undefined &&
          record[key] !== null
        ) {
          return record[key];
        }
      }

      return null;
    }

    function getSaleAmount(record) {
      return Number(
        getRecordValue(
          record,
          'saleAmount',
          'sale_amount',
          'sales',
          'sale'
        ) || 0
      );
    }

    function getDeliveryCount(record) {
      return Number(
        getRecordValue(
          record,
          'deliveryCount',
          'delivery_count',
          'deliveries'
        ) || 0
      );
    }

    function getWorkHours(record) {
      const value =
        getRecordValue(
          record,
          'workHours',
          'work_hours',
          'hours'
        );

      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {
        return 0;
      }

      return Number(value) || 0;
    }

    function getDistance(record) {
      return Number(
        getRecordValue(
          record,
          'distanceKm',
          'distance_km',
          'distance'
        ) || 0
      );
    }

    function getExpense(record) {
      return Number(
        getRecordValue(
          record,
          'expenseAmount',
          'expense_amount',
          'expense'
        ) || 0
      );
    }

    function getCreatedAt(record) {
      return getRecordValue(
        record,
        'created_at',
        'createdAt'
      );
    }

    function getWorkStartedAt(record) {
      return getRecordValue(
        record,
        'work_started_at',
        'workStartedAt'
      );
    }

    function getDateValue(record) {
      return (
        getWorkStartedAt(record) ||
        getCreatedAt(record)
      );
    }

    function getSummaryFromRecords(
      records
    ) {
      let sales = 0;
      let deliveries = 0;
      let hours = 0;
      let distance = 0;
      let expense = 0;

      for (const record of records) {
        sales += getSaleAmount(record);
        deliveries += getDeliveryCount(record);
        hours += getWorkHours(record);
        distance += getDistance(record);
        expense += getExpense(record);
      }

      return {
        sales,
        deliveries,
        hours,
        distance,
        expense
      };
    }

    function getSummaryValues(data) {
      const records =
        getRecordsFromData(data);

      const summary =
        data?.summary || {};

      const fallback =
        getSummaryFromRecords(records);

      const sales =
        Number(
          summary.saleAmount ??
          summary.sales ??
          summary.sale_amount ??
          fallback.sales ??
          0
        );

      const deliveries =
        Number(
          summary.deliveryCount ??
          summary.deliveries ??
          summary.delivery_count ??
          fallback.deliveries ??
          0
        );

      const hours =
        Number(
          summary.workHours ??
          summary.hours ??
          summary.work_hours ??
          fallback.hours ??
          0
        );

      const distance =
        Number(
          summary.distanceKm ??
          summary.distance ??
          summary.distance_km ??
          fallback.distance ??
          0
        );

      const expense =
        Number(
          summary.expenseAmount ??
          summary.expense ??
          summary.expense_amount ??
          fallback.expense ??
          0
        );

      return {
        sales:
          Number.isFinite(sales)
            ? sales
            : 0,

        deliveries:
          Number.isFinite(deliveries)
            ? deliveries
            : 0,

        hours:
          Number.isFinite(hours)
            ? hours
            : 0,

        distance:
          Number.isFinite(distance)
            ? distance
            : 0,

        expense:
          Number.isFinite(expense)
            ? expense
            : 0
      };
    }

    function renderSummary(data) {
      const summary =
        getSummaryValues(data);

      const hourly =
        summary.hours > 0
          ? summary.sales /
            summary.hours
          : 0;

      const unitPrice =
        summary.deliveries > 0
          ? summary.sales /
            summary.deliveries
          : 0;

      document.getElementById(
        'summarySales'
      ).textContent =
        formatYen(summary.sales);

      document.getElementById(
        'summaryDeliveries'
      ).textContent =
        `${summary.deliveries.toLocaleString('ja-JP')}件`;

      document.getElementById(
        'summaryHours'
      ).textContent =
        formatHours(summary.hours);

      document.getElementById(
        'summaryHourly'
      ).textContent =
        formatYen(hourly);

      document.getElementById(
        'summaryUnitPrice'
      ).textContent =
        formatYen(unitPrice);

      renderEfficiency(summary);
    }

    function renderEfficiency(
      summary
    ) {
      const perDelivery =
        summary.deliveries > 0
          ? summary.sales /
            summary.deliveries
          : 0;

      const deliveriesPerHour =
        summary.hours > 0
          ? summary.deliveries /
            summary.hours
          : 0;

      const salesPerKm =
        summary.distance > 0
          ? summary.sales /
            summary.distance
          : 0;

      document.getElementById(
        'analysisPerDelivery'
      ).textContent =
        formatYen(perDelivery);

      document.getElementById(
        'analysisDeliveriesPerHour'
      ).textContent =
        `${formatNumber(
          deliveriesPerHour,
          1
        )}件`;

      document.getElementById(
        'analysisSalesPerKm'
      ).textContent =
        summary.distance > 0
          ? formatYen(salesPerKm)
          : '—';

      document.getElementById(
        'analysisExpense'
      ).textContent =
        formatYen(summary.expense);
    }

    function getRecordSortTime(
      record
    ) {
      const value =
        getDateValue(record);

      if (!value) {
        return 0;
      }

      const time =
        new Date(value).getTime();

      return Number.isFinite(time)
        ? time
        : 0;
    }

    function formatDateTime(value) {
      if (!value) {
        return '日時不明';
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return '日時不明';
      }

      return date.toLocaleString(
        'ja-JP',
        {
          month: 'numeric',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }
      );
    }

    function renderRecords(
      records
    ) {
      const container =
        document.getElementById(
          'recordList'
        );

      if (!container) {
        return;
      }

      const sorted =
        [...records].sort(
          (a, b) =>
            getRecordSortTime(b) -
            getRecordSortTime(a)
        );

      if (sorted.length === 0) {
        container.innerHTML = `
          <div class="empty">
            まだ実績がありません
          </div>
        `;

        return;
      }

      container.innerHTML =
        sorted.map(record => {

          const sales =
            getSaleAmount(record);

          const deliveries =
            getDeliveryCount(record);

          const hours =
            getWorkHours(record);

          const date =
            getDateValue(record);

          return `
            <div style="
              display:flex;
              justify-content:space-between;
              gap:12px;
              padding:12px;
              margin-bottom:9px;
              border:1px solid var(--border);
              border-radius:12px;
              background:#fff;
            ">
              <div>
                <div style="
                  color:var(--muted);
                  font-size:11px;
                ">
                  ${escapeHtml(
                    formatDateTime(date)
                  )}
                </div>

                <div style="
                  margin-top:3px;
                  font-size:14px;
                  font-weight:800;
                ">
                  ${deliveries.toLocaleString('ja-JP')}件
                </div>

                <div style="
                  margin-top:3px;
                  color:var(--muted);
                  font-size:12px;
                ">
                  ${formatHours(hours)}
                  ・平均単価
                  ${formatYen(
                    deliveries > 0
                      ? sales / deliveries
                      : 0
                  )}
                </div>
              </div>

              <div style="
                white-space:nowrap;
                font-size:16px;
                font-weight:850;
              ">
                ${formatYen(sales)}
              </div>
            </div>
          `;

        }).join('');
    }

    function getPeriodQuery(period) {
      switch (period) {
        case 'today':
          return 'today';

        case 'week':
          return 'week';

        case 'month':
          return 'month';

        case 'all':
        default:
          return 'all';
      }
    }

    async function loadPersonal() {
      if (!tg?.initData) {
        updateUserName();

        showToast(
          'Telegram Mini Appとして起動してください',
          'error'
        );

        return;
      }

      try {
        const query =
          getPeriodQuery(
            currentPeriod
          );

        const response =
          await apiFetch(
            `/api/result?period=${encodeURIComponent(query)}`
          );

        const data =
          await readApiResponse(
            response
          );

        currentData = data;

        updateUserName();

        const records =
          getRecordsFromData(data);

        renderSummary(data);
        renderRecords(records);

      } catch (error) {
        console.error(
          'loadPersonal error:',
          error
        );

        showToast(
          error.message ||
          'データの取得に失敗しました',
          'error'
        );
      }
    }

    function setupPeriodTabs() {
      const tabs =
        document.querySelectorAll(
          '[data-period]'
        );

      tabs.forEach(tab => {

        tab.addEventListener(
          'click',
          async () => {

            const period =
              tab.dataset.period;

            currentPeriod =
              period;

            tabs.forEach(item => {
              item.classList.toggle(
                'active',
                item === tab
              );
            });

            await loadPersonal();
          }
        );

      });
    }

    function setupDetailsToggle() {
      const button =
        document.getElementById(
          'detailsToggle'
        );

      const details =
        document.getElementById(
          'optionalDetails'
        );

      const icon =
        document.getElementById(
          'detailsToggleIcon'
        );

      if (
        !button ||
        !details
      ) {
        return;
      }

      button.addEventListener(
        'click',
        () => {

          const open =
            details.classList.toggle(
              'open'
            );

          button.setAttribute(
            'aria-expanded',
            String(open)
          );

          if (icon) {
            icon.textContent =
              open ? '−' : '＋';
          }

        }
      );
    }

    function setupRefresh() {
      const button =
        document.getElementById(
          'refreshBtn'
        );

      if (!button) {
        return;
      }

      button.addEventListener(
        'click',
        async () => {

          button.disabled = true;

          try {
            await loadPersonal();

            showToast(
              '更新しました'
            );

          } finally {
            button.disabled =
              false;
          }

        }
      );
    }

    function buildWorkStartedAt(
      timeValue
    ) {
      if (!timeValue) {
        return undefined;
      }

      const parts =
        String(timeValue).split(':');

      if (parts.length < 2) {
        return undefined;
      }

      const hour =
        Number(parts[0]);

      const minute =
        Number(parts[1]);

      if (
        !Number.isInteger(hour) ||
        !Number.isInteger(minute) ||
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
      ) {
        return undefined;
      }

      const now =
        new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          now.getDate()
        ).padStart(2, '0');

      const hh =
        String(hour)
          .padStart(2, '0');

      const mm =
        String(minute)
          .padStart(2, '0');

      return (
        `${year}-${month}-${day}` +
        `T${hh}:${mm}:00+09:00`
      );
    }

    function getOptionalNumber(
      elementId
    ) {
      const element =
        document.getElementById(
          elementId
        );

      if (!element) {
        return undefined;
      }

      const value =
        element.value.trim();

      if (value === '') {
        return undefined;
      }

      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return undefined;
      }

      return number;
    }

    function resetAddResultForm() {
      const form =
        document.getElementById(
          'addResultForm'
        );

      form?.reset();

      const details =
        document.getElementById(
          'optionalDetails'
        );

      const toggle =
        document.getElementById(
          'detailsToggle'
        );

      const icon =
        document.getElementById(
          'detailsToggleIcon'
        );

      details?.classList.remove(
        'open'
      );

      toggle?.setAttribute(
        'aria-expanded',
        'false'
      );

      if (icon) {
        icon.textContent = '＋';
      }
    }

    function setupAddResultForm() {
      const form =
        document.getElementById(
          'addResultForm'
        );

      if (!form) {
        return;
      }

      form.addEventListener(
        'submit',
        async event => {

          event.preventDefault();

          if (!tg?.initData) {
            showToast(
              'Telegram Mini Appとして起動してください',
              'error'
            );

            return;
          }

          const submitButton =
            form.querySelector(
              '.add-result-submit'
            );

          const saleAmount =
            getOptionalNumber(
              'saleAmountInput'
            );

          const deliveryCount =
            getOptionalNumber(
              'deliveryCountInput'
            );

          const workHours =
            getOptionalNumber(
              'workHoursInput'
            );

          const distanceKm =
            getOptionalNumber(
              'distanceInput'
            );

          const expenseAmount =
            getOptionalNumber(
              'expenseInput'
            );

          const workStartTime =
            document
              .getElementById(
                'workStartTimeInput'
              )
              ?.value
              ?.trim() || '';

          if (
            saleAmount === undefined ||
            saleAmount < 0
          ) {
            showToast(
              '売上を入力してください',
              'error'
            );

            return;
          }

          if (
            deliveryCount === undefined ||
            deliveryCount < 1
          ) {
            showToast(
              '配達件数を入力してください',
              'error'
            );

            return;
          }

          if (
            workHours !== undefined &&
            workHours < 0
          ) {
            showToast(
              '稼働時間を確認してください',
              'error'
            );

            return;
          }

          if (
            distanceKm !== undefined &&
            distanceKm < 0
          ) {
            showToast(
              '走行距離を確認してください',
              'error'
            );

            return;
          }

          if (
            expenseAmount !== undefined &&
            expenseAmount < 0
          ) {
            showToast(
              '経費を確認してください',
              'error'
            );

            return;
          }

          const body = {
            saleAmount:
              Math.round(saleAmount),

            deliveryCount:
              Math.round(deliveryCount)
          };

          if (
            workHours !== undefined
          ) {
            body.workHours =
              workHours;
          }

          if (
            distanceKm !== undefined
          ) {
            body.distanceKm =
              distanceKm;
          }

          if (
            expenseAmount !== undefined
          ) {
            body.expenseAmount =
              Math.round(
                expenseAmount
              );
          }

          const workStartedAt =
            buildWorkStartedAt(
              workStartTime
            );

          if (workStartedAt) {
            body.workStartedAt =
              workStartedAt;
          }

          submitButton.disabled =
            true;

          const originalText =
            submitButton.textContent;

          submitButton.textContent =
            '保存中…';

          try {

            const response =
              await apiFetch(
                '/api/result',
                {
                  method: 'POST',

                  headers: {
                    'Content-Type':
                      'application/json'
                  },

                  body:
                    JSON.stringify(body)
                }
              );

            await readApiResponse(
              response
            );

            resetAddResultForm();

            showToast(
              '実績を保存しました'
            );

            await loadPersonal();

          } catch (error) {

            console.error(
              'add result error:',
              error
            );

            showToast(
              error.message ||
              '実績の保存に失敗しました',
              'error'
            );

          } finally {

            submitButton.disabled =
              false;

            submitButton.textContent =
              originalText;
          }
        }
      );
    }

    async function initializeApp() {

      /*
       * Telegram認証の前に
       * UIイベントを登録する。
       */
      setupPeriodTabs();
      setupDetailsToggle();
      setupRefresh();
      setupAddResultForm();

      updateUserName();

      if (!tg?.initData) {

        document.getElementById(
          'userName'
        ).textContent =
          'Telegram Mini Appとして起動してください';

        showToast(
          'Telegram Mini Appとして起動してください',
          'error'
        );

        return;
      }

      try {
        tg.ready();
        tg.expand();
      } catch (error) {
        console.warn(
          'Telegram WebApp initialization warning:',
          error
        );
      }

      await loadPersonal();
    }

    if (
      document.readyState ===
      'loading'
    ) {

      document.addEventListener(
        'DOMContentLoaded',
        initializeApp,
        { once: true }
      );

    } else {

      initializeApp();

    }
  </script>

</body>
</html>
