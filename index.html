<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>個人テレグラムリザルト</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f5f7fb;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      padding-bottom: 32px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }

    /* =========================================
       Header
    ========================================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 16px;
      margin-bottom: 12px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .header-title {
      margin: 0;

      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .user-name {
      margin-top: 5px;

      color: #6b7280;
      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .refresh-btn {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border: 0;
      border-radius: 12px;

      background: #f3f4f6;
      color: #374151;

      font-size: 18px;
    }

    .refresh-btn:active {
      transform: scale(0.96);
    }

    /* =========================================
       Main tabs
    ========================================= */

    .main-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;

      margin-bottom: 12px;
    }

    .main-tab {
      min-height: 44px;

      border: 1px solid #e5e7eb;
      border-radius: 13px;

      background: #ffffff;
      color: #6b7280;

      font-size: 14px;
      font-weight: 800;
    }

    .main-tab.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    /* =========================================
       Sections
    ========================================= */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* =========================================
       Period
    ========================================= */

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;

      margin-bottom: 12px;
    }

    .period-tab {
      min-height: 42px;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      background: #ffffff;
      color: #6b7280;

      font-size: 13px;
      font-weight: 800;
    }

    .period-tab.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* =========================================
       History selector
    ========================================= */

    .history-card {
      padding: 14px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;

      margin-bottom: 12px;
    }

    .history-title {
      margin-bottom: 10px;

      font-size: 13px;
      font-weight: 900;
    }

    .history-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .history-select {
      width: 100%;
      height: 42px;

      padding: 0 10px;

      border: 1px solid #d1d5db;
      border-radius: 11px;

      background: #ffffff;
      color: #111827;
    }

    /* =========================================
       Cards
    ========================================= */

    .card {
      padding: 16px;
      margin-bottom: 12px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .card-title {
      margin-bottom: 14px;

      font-size: 15px;
      font-weight: 900;
    }

    .card-subtitle {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================================
       Hero
    ========================================= */

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;

      margin-bottom: 12px;
    }

    .hero-card {
      padding: 16px;

      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.035);
    }

    .hero-label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 800;
    }

    .hero-value {
      margin-top: 7px;

      font-size: 27px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .hero-unit {
      margin-left: 3px;

      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================
       Stats
    ========================================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-box {
      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .stat-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 800;
    }

    .stat-value {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 900;
    }

    /* =========================================
       Analysis
    ========================================= */

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .analysis-item {
      padding: 14px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .analysis-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 800;
    }

    .analysis-value {
      margin-top: 5px;

      font-size: 19px;
      font-weight: 900;
    }

    .analysis-sub {
      margin-top: 3px;

      color: #9ca3af;
      font-size: 10px;
    }

    /* =========================================
       Best
    ========================================= */

    .best-list {
      display: grid;
      gap: 8px;
    }

    .best-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .best-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 800;
    }

    .best-date {
      margin-top: 3px;

      font-size: 13px;
      font-weight: 800;
    }

    .best-value {
      text-align: right;

      font-size: 18px;
      font-weight: 900;
    }

    /* =========================================
       Streak
    ========================================= */

    .streak-box {
      padding: 18px;

      background: #111827;
      color: #ffffff;

      border-radius: 16px;

      text-align: center;
    }

    .streak-number {
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
    }

    .streak-unit {
      margin-top: 7px;

      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================
       Monthly report
    ========================================= */

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .report-item {
      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .report-label {
      color: #6b7280;
      font-size: 11px;
      font-weight: 800;
    }

    .report-value {
      margin-top: 5px;

      font-size: 18px;
      font-weight: 900;
    }

    .report-best {
      margin-top: 14px;

      color: #374151;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================
       Daily chart
    ========================================= */

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;

      min-height: 180px;

      padding: 12px 4px;

      overflow-x: auto;
    }

    .chart-column {
      min-width: 34px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;

      height: 155px;
    }

    .chart-value {
      margin-bottom: 4px;

      font-size: 8px;
      color: #6b7280;

      white-space: nowrap;
    }

    .chart-bar-wrap {
      width: 24px;
      height: 115px;

      display: flex;
      align-items: flex-end;
    }

    .chart-bar {
      width: 100%;

      min-height: 2px;

      background: #2563eb;
      border-radius: 6px 6px 2px 2px;
    }

    .chart-date {
      margin-top: 5px;

      color: #6b7280;
      font-size: 8px;

      white-space: nowrap;
    }

    /* =========================================
       Daily list
    ========================================= */

    .daily-list {
      display: grid;
      gap: 8px;
    }

    .daily-item {
      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .daily-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .daily-date {
      font-size: 13px;
      font-weight: 900;
    }

    .daily-sales {
      font-size: 15px;
      font-weight: 900;
    }

    .daily-detail {
      margin-top: 5px;

      color: #6b7280;
      font-size: 11px;
    }

    /* =========================================
       Records
    ========================================= */

    .record-list {
      display: grid;
      gap: 8px;
    }

    .record-item {
      padding: 13px;

      background: #f9fafb;
      border-radius: 14px;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .record-date {
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
    }

    .record-sales {
      font-size: 15px;
      font-weight: 900;
    }

    .record-detail {
      margin-top: 5px;

      color: #6b7280;
      font-size: 11px;
    }

    /* =========================================
       Loading / Empty / Error
    ========================================= */

    .loading,
    .empty {
      padding: 24px 10px;

      text-align: center;

      color: #6b7280;
      font-size: 13px;
    }

    .error {
      padding: 14px;

      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 14px;

      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================================
       Buttons
    ========================================= */

    .danger-btn {
      width: 100%;
      min-height: 46px;

      border: 1px solid #fecaca;
      border-radius: 13px;

      background: #fff1f2;
      color: #be123c;

      font-size: 13px;
      font-weight: 800;
    }

    /* =========================================
       Responsive
    ========================================= */

    @media (max-width: 420px) {
      .app {
        padding: 10px;
      }

      .hero-value {
        font-size: 23px;
      }

      .analysis-value,
      .report-value {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================================
       Header
  ========================================== -->

  <header class="header">

    <div>
      <h1 class="header-title">
        📦 個人テレグラムリザルト
      </h1>

      <div
        id="userName"
        class="user-name"
      >
        読み込み中...
      </div>
    </div>

    <button
      id="refreshBtn"
      class="refresh-btn"
      type="button"
    >
      🔄
    </button>

  </header>


  <!-- =========================================
       Main tabs
  ========================================== -->

  <nav class="main-tabs">

    <button
      class="main-tab active"
      data-section="personal"
      type="button"
    >
      📊 個人実績
    </button>

    <button
      class="main-tab"
      data-section="analytics"
      type="button"
    >
      📈 分析
    </button>

  </nav>


  <!-- =========================================
       Personal
  ========================================== -->

  <section
    id="personalSection"
    class="section active"
  >

    <!-- Period -->

    <div class="period-tabs">

      <button
        class="period-tab active"
        data-period="today"
        type="button"
      >
        今日
      </button>

      <button
        class="period-tab"
        data-period="week"
        type="button"
      >
        今週
      </button>

      <button
        class="period-tab"
        data-period="month"
        type="button"
      >
        今月
      </button>

      <button
        class="period-tab"
        data-period="year"
        type="button"
      >
        年間
      </button>

    </div>


    <!-- Historical selection -->

    <div class="history-card">

      <div class="history-title">
        📅 過去の実績を確認
      </div>

      <div class="history-row">

        <select
          id="monthSelect"
          class="history-select"
        >
          <option value="">
            月を選択
          </option>
        </select>

        <select
          id="yearSelect"
          class="history-select"
        >
          <option value="">
            年を選択
          </option>
        </select>

      </div>

    </div>


    <!-- Hero -->

    <div
      id="hero"
      class="hero-grid"
    >
      <div class="loading">
        読み込み中...
      </div>
    </div>


    <!-- Basic analysis -->

    <div class="card">

      <div class="card-title">
        基本分析
      </div>

      <div
        id="basicStats"
        class="stats-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>


    <!-- Pace -->

    <div class="card">

      <div class="card-title">
        ペース
      </div>

      <div
        id="paceStats"
        class="analysis-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>


    <!-- Best -->

    <div class="card">

      <div class="card-title">
        自己ベスト
      </div>

      <div
        id="bestStats"
        class="best-list"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>


    <!-- Monthly report -->

    <div class="card">

      <div class="card-title">
        月次レポート
      </div>

      <div
        id="monthlyReport"
        class="report-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

      <div
        id="monthlyBestText"
        class="report-best"
      ></div>

    </div>


    <!-- Daily chart -->

    <div class="card">

      <div class="card-title">
        日別売上
      </div>

      <div
        id="dailyChart"
        class="chart"
      >
        <div class="empty">
          データなし
        </div>
      </div>

    </div>


    <!-- Daily list -->

    <div class="card">

      <div class="card-title">
        日別実績
      </div>

      <div
        id="dailyList"
        class="daily-list"
      >
        <div class="empty">
          データなし
        </div>
      </div>

    </div>


    <!-- Records -->

    <div class="card">

      <div class="card-title">
        実績履歴
      </div>

      <div
        id="recordList"
        class="record-list"
      >
        <div class="empty">
          データなし
        </div>
      </div>

    </div>


    <!-- Reset -->

    <div class="card">

      <button
        id="resetBtn"
        class="danger-btn"
        type="button"
      >
        自分の実績をすべて削除
      </button>

    </div>

  </section>


  <!-- =========================================
       Analytics
  ========================================== -->

  <section
    id="analyticsSection"
    class="section"
  >

    <div class="card">

      <div class="card-title">
        個人実績分析
      </div>

      <div
        id="analyticsSummary"
        class="analysis-grid"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        自己ベスト
      </div>

      <div
        id="analyticsBest"
        class="best-list"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        継続日数
      </div>

      <div
        id="streak"
        class="streak-box"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </div>

  </section>

</div>


<script>
  // =========================================================
  // Telegram
  // =========================================================

  const tg =
    window.Telegram?.WebApp || null;

  const JST =
    "Asia/Tokyo";

  let activeSection =
    "personal";

  let activePeriod =
    "today";

  let currentData =
    null;


  // =========================================================
  // Telegram初期化
  // =========================================================

  function initTelegram() {
    if (!tg) {
      return;
    }

    try {
      tg.ready();
      tg.expand();

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#f5f7fb");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#f5f7fb");
      }
    } catch (error) {
      console.error(
        "Telegram init error:",
        error
      );
    }
  }


  // =========================================================
  // API
  // =========================================================

  async function apiFetch(
    url,
    options = {}
  ) {
    const headers = {
      ...(options.headers || {}),
    };

    if (tg?.initData) {
      headers[
        "X-Telegram-Init-Data"
      ] = tg.initData;
    }

    const response =
      await fetch(url, {
        ...options,
        headers,
      });

    let data = null;

    try {
      data =
        await response.json();
    } catch (error) {
      throw new Error(
        "APIレスポンスを読み込めませんでした。"
      );
    }

    if (!response.ok) {
      throw new Error(
        data?.error ||
        `APIエラー: ${response.status}`
      );
    }

    return data;
  }


  // =========================================================
  // Format
  // =========================================================

  function formatNumber(value) {
    return Number(
      value || 0
    ).toLocaleString("ja-JP");
  }


  function formatYen(value) {
    return (
      "¥" +
      Number(
        value || 0
      ).toLocaleString("ja-JP", {
        maximumFractionDigits: 0,
      })
    );
  }


  function formatHours(value) {
    return Number(
      value || 0
    ).toFixed(2);
  }


  function formatDecimal(value) {
    return Number(
      value || 0
    ).toFixed(1);
  }


  function formatDate(value) {
    if (!value) {
      return "-";
    }

    const text =
      String(value);

    if (
      /^\d{4}-\d{2}-\d{2}$/.test(
        text
      )
    ) {
      return text;
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return text;
    }

    const parts =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: JST,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }
      ).formatToParts(date);

    const year =
      parts.find(
        p => p.type === "year"
      )?.value;

    const month =
      parts.find(
        p => p.type === "month"
      )?.value;

    const day =
      parts.find(
        p => p.type === "day"
      )?.value;

    if (
      !year ||
      !month ||
      !day
    ) {
      return text;
    }

    return `${year}-${month}-${day}`;
  }


  function formatDateTime(value) {
    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return formatDate(value);
    }

    return new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: JST,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }
    ).format(date);
  }


  // =========================================================
  // User
  // =========================================================

  function renderUserName() {
    const element =
      document.getElementById(
        "userName"
      );

    const user =
      tg?.initDataUnsafe?.user;

    if (!user) {
      element.textContent =
        "個人ダッシュボード";

      return;
    }

    const name = [
      user.first_name,
      user.last_name,
    ]
      .filter(Boolean)
      .join(" ");

    if (name) {
      element.textContent =
        `${name}さん`;
      return;
    }

    if (user.username) {
      element.textContent =
        `@${user.username}`;
      return;
    }

    element.textContent =
      "個人ダッシュボード";
  }


  // =========================================================
  // Section
  // =========================================================

  function showSection(
    section
  ) {
    activeSection =
      section;

    document
      .querySelectorAll(
        ".main-tab"
      )
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.section ===
            section
        );
      });

    document
      .getElementById(
        "personalSection"
      )
      .classList.toggle(
        "active",
        section === "personal"
      );

    document
      .getElementById(
        "analyticsSection"
      )
      .classList.toggle(
        "active",
        section === "analytics"
      );

    if (
      section === "personal"
    ) {
      loadPersonal(
        activePeriod
      );
    }

    if (
      section === "analytics"
    ) {
      loadAnalytics();
    }
  }


  // =========================================================
  // Period
  // =========================================================

  function updatePeriodTabs() {
    document
      .querySelectorAll(
        ".period-tab"
      )
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.period ===

  async function loadPersonal(

  ) {
    activePeriod =

    query.set(
      "period",

    );

    if (params.month) {

        params.month
      );
    }

    if (params.year) {

      );

    setLoading();

    try {

          `/api/result?${query.toString()}`

      renderError(
        error.message ||

  // =========================================================
  // Daily chart
  // =========================================================

  function renderDailyChart(
    daily
  ) {
    const container =
      document.getElementById(
        "dailyChart"
      );

    if (!daily.length) {
      container.innerHTML = `
        <div class="empty">
          データがありません。
        </div>
      `;

      return;
    }

    const maxSales =
      Math.max(
        ...daily.map(
          day =>
            Number(
              day.sales || 0
            )
        ),
        1
      );

    container.innerHTML =
      daily
        .map(day => {
          const sales =
            Number(
              day.sales || 0
            );

          const height =
            Math.max(
              2,
              Math.round(
                (sales /
                  maxSales) *
                  115
              )
            );

          const date =
            formatDate(
              day.date
            );

          return `
            <div class="chart-column">

              <div class="chart-value">
                ${formatYen(
                  sales
                )}
              </div>

              <div class="chart-bar-wrap">
                <div
                  class="chart-bar"
                  style="height:${height}px"
                ></div>
              </div>

              <div class="chart-date">
                ${escapeHtml(
                  date.slice(5)
                )}
              </div>

            </div>
          `;
        })
        .join("");
  }

  // =========================================================
  // Streak
  // =========================================================

  function renderStreak(
    daily
  ) {
    const container =
      document.getElementById(
        "streak"
      );

    if (!daily.length) {
      container.innerHTML = `
        <div class="streak-number">
          0
        </div>

        <div class="streak-unit">
          連続稼働日
        </div>
      `;

      return;
    }

    const activeDates =
      new Set(
        daily
          .filter(
            day =>
              Number(
                day.records || 0
              ) > 0
          )
          .map(
            day =>
              formatDate(
                day.date
              )
          )
      );

    const today =
      getTodayJst();

    let streak = 0;

    let cursor =
      new Date(
        `${today}T00:00:00+09:00`
      );

    while (true) {
      const key =
        formatDate(
          cursor
        );

      if (
        activeDates.has(key)
      ) {
        streak++;

        cursor.setUTCDate(
          cursor.getUTCDate() - 1
        );
      } else {
        break;
      }

      if (streak > 3650) {
        break;
      }
    }

    container.innerHTML = `
      <div class="streak-number">
        ${streak}
      </div>

      <div class="streak-unit">
        連続稼働日
      </div>
    `;
  }


  function getTodayJst() {
    const parts =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: JST,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }
      ).formatToParts(
        new Date()
      );

    const year =
      parts.find(
        p => p.type === "year"
      )?.value;

    const month =
      parts.find(
        p => p.type === "month"
      )?.value;

    const day =
      parts.find(
        p => p.type === "day"
      )?.value;

    return `${year}-${month}-${day}`;
  }


  // =========================================================
  // History selectors
  // =========================================================

  function populateHistorySelectors() {
    const monthSelect =
      document.getElementById(
        "monthSelect"
      );

    const yearSelect =
      document.getElementById(
        "yearSelect"
      );

    const today =
      new Date();

    const parts =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: JST,
          year: "numeric",
          month: "2-digit",
        }
      ).formatToParts(
        today
      );

    const currentYear =
      Number(
        parts.find(
          p => p.type === "year"
        )?.value
      );

    const currentMonth =
      Number(
        parts.find(
          p => p.type === "month"
        )?.value
      );

    // 過去24か月
    monthSelect.innerHTML = `
      <option value="">
        月を選択
      </option>
    `;

    for (
      let i = 0;
      i < 24;
      i++
    ) {
      const date =
        new Date(
          currentYear,
          currentMonth - 1 - i,
          1
        );

      const year =
        date.getFullYear();

      const month =
        date.getMonth() + 1;

      const value =
        `${year}-${String(
          month
        ).padStart(2, "0")}`;

      const option =
        document.createElement(
          "option"
        );

      option.value =
        value;

      option.textContent =
        value;

      monthSelect.appendChild(
        option
      );
    }

    // 過去5年
    yearSelect.innerHTML = `
      <option value="">
        年を選択
      </option>
    `;

    for (
      let i = 0;
      i < 5;
      i++
    ) {
      const year =
        currentYear - i;

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(year);

      option.textContent =
        `${year}年`;

      yearSelect.appendChild(
        option
      );
    }
  }


  // =========================================================
  // Events
  // =========================================================

  function setupEvents() {

    // Main tabs
    document
      .querySelectorAll(
        ".main-tab"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            showSection(
              button.dataset.section
            );
          }
        );
      });


    // Period tabs
    document
      .querySelectorAll(
        ".period-tab"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const period =
              button.dataset.period;

            loadPersonal(
              period
            );
          }
        );
      });


    // Month
    document
      .getElementById(
        "monthSelect"
      )
      .addEventListener(
        "change",
        event => {
          const month =
            event.target.value;

          if (!month) {
            return;
          }

          document
            .getElementById(
              "yearSelect"
            )
            .value = "";

          loadPersonal(
            "month",
            {
              month,
            }
          );
        }
      );


    // Year
    document
      .getElementById(
        "yearSelect"
      )
      .addEventListener(
        "change",
        event => {
          const year =
            event.target.value;

          if (!year) {
            return;
          }

          document
            .getElementById(
              "monthSelect"
            )
            .value = "";

          loadPersonal(
            "year",
            {
              year,
            }
          );
        }
      );


    // Refresh
    document
      .getElementById(
        "refreshBtn"
      )
      .addEventListener(
        "click",
        () => {
          if (
            activeSection ===
            "personal"
          ) {
            loadPersonal(
              activePeriod
            );
          } else {
            loadAnalytics();
          }
        }
      );


    // Reset
    document
      .getElementById(
        "resetBtn"
      )
      .addEventListener(
        "click",
        resetData
      );
  }


  // =========================================================
  // Reset
  // =========================================================

  async function resetData() {
    const first =
      confirm(
        "自分の配達実績をすべて削除します。\n\n本当に実行しますか？"
      );

    if (!first) {
      return;
    }

    const second =
      confirm(
        "この操作は元に戻せません。\n\n本当に全削除しますか？"
      );

    if (!second) {
      return;
    }

    try {
      const data =
        await apiFetch(
          "/api/reset",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json",
            },
            body:
              JSON.stringify({}),
          }
        );

      if (!data?.ok) {
        throw new Error(
          data?.error ||
            "リセットに失敗しました。"
        );
      }

      alert(
        "自分の実績を削除しました。"
      );

      await loadPersonal(
        "today"
      );

    } catch (error) {
      console.error(
        "reset error:",
        error
      );

      alert(
        error.message ||
          "リセットに失敗しました。"
      );
    }
  }


  // =========================================================
  // Escape
  // =========================================================

  function escapeHtml(
    value
  ) {
    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  // =========================================================
  // Initialize
  // =========================================================

  async function init() {
    initTelegram();

    renderUserName();

    populateHistorySelectors();

    setupEvents();

    await loadPersonal(
      "today"
    );
  }

  init();
</script>
